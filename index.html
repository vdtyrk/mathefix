ckNr":2,"nr":15,"rechenarten":["*","/"],"schwierigkeit":5,"thema":"Fußballturnier","geschichte":"Amar räumt nach dem Fußballturnier auf. Es gab 8 Spiele. Er sammelt 3 Netze mit je 12 Bällen ein. Alle Bälle verteilt er gleichmäßig auf 4 Taschen.","frage":"Wie viele Bälle sind in einer Tasche?","antwort":9,"rechenweg":"3 * 12 / 4","hinweis":"Wie viele Bälle sind es insgesamt? Die Spiele brauchst du nicht.","erklaerung":"So denkst du: 3 Netze mit je 12 Bällen: 3 · 12 = 36 Bälle. Die 8 Spiele sind für die Rechnung egal. 36 Bälle auf 4 Taschen: 36 : 4 = 9. In jeder Tasche sind 9 Bälle.","sprachtext":null,"symbol":"⚽"},{"id":"I-16","gruppe":"I","block":"Ib","blockNr":2,"nr":16,"rechenarten":["-","/"],"schwierigkeit":6,"thema":"Klassenfest","geschichte":"Mama Cangül bäckt 52 Muffins für das Klassenfest. Am Vormittag werden 24 Muffins gegessen. Ayda legt die restlichen Muffins gleichmäßig auf 4 Teller.","frage":"Wie viele Muffins liegen auf einem Teller?","antwort":7,"rechenweg":"(52 - 24) / 4","hinweis":"Wie viele Muffins bleiben nach dem Vormittag übrig? Diese Zahl teilst du durch 4.","erklaerung":"So denkst du: Von 52 Muffins werden 24 gegessen. 52 − 24 = 28 Muffins bleiben übrig. 28 Muffins auf 4 Teller: 28 : 4 = 7. Auf jedem Teller liegen 7 Muffins.","sprachtext":null,"symbol":"🧁"},{"id":"I-17","gruppe":"I","block":"Ib","blockNr":2,"nr":17,"rechenarten":["/","-"],"schwierigkeit":7,"thema":"Pizzaofen","geschichte":"Beim Schulfest kommen 96 Pizzastücke aus dem Pizzaofen. Ein Blech braucht 15 Minuten. Die Stücke werden gleichmäßig auf 8 Platten gelegt. Von einer Platte nehmen sich die Kinder gleich 2 Stücke.","frage":"Wie viele Stücke liegen noch auf dieser Platte?","antwort":10,"rechenweg":"96 / 8 - 2","hinweis":"Wie viele Stücke kommen auf eine Platte? Die Minuten brauchst du nicht.","erklaerung":"So denkst du: 96 Stücke auf 8 Platten: 96 : 8 = 12 Stücke pro Platte. Die 15 Minuten sind für die Rechnung egal. Die Kinder nehmen 2 Stücke weg. 12 − 2 = 10. Auf der Platte liegen noch 10 Stücke.","sprachtext":null,"symbol":"🍕"},{"id":"I-18","gruppe":"I","block":"Ib","blockNr":2,"nr":18,"rechenarten":["+","/"],"schwierigkeit":8,"thema":"Jausenstand","geschichte":"Cesur und Aras schmieren Brote für den Jausenstand. Cesur macht 30 Brote, Aras macht 42 Brote. Alle Brote legen sie zusammen gleichmäßig in 8 Körbe.","frage":"Wie viele Brote sind in einem Korb?","antwort":9,"rechenweg":"(30 + 42) / 8","hinweis":"Zähl zuerst alle Brote zusammen. Dann teile durch 8.","erklaerung":"So denkst du: Cesur und Aras haben zusammen 30 + 42 = 72 Brote. 72 Brote auf 8 Körbe: 72 : 8 = 9. In jedem Korb sind 9 Brote.","sprachtext":null,"symbol":"🥪"},{"id":"I-19","gruppe":"I","block":"Ib","blockNr":2,"nr":19,"rechenarten":["-","/"],"schwierigkeit":9,"thema":"Gemüsebeet","geschichte":"Die Klasse bekommt 100 Setzlinge für den Schulgarten. 37 Setzlinge sind Paradeiser. Alle anderen sind Salat. Asel pflanzt die Salat-Setzlinge gleichmäßig in 9 Beete.","frage":"Wie viele Salat-Setzlinge kommen in ein Beet?","antwort":7,"rechenweg":"(100 - 37) / 9","hinweis":"Wie viele Setzlinge sind Salat? Diese Zahl teilst du durch 9.","erklaerung":"So denkst du: Von 100 Setzlingen sind 37 Paradeiser. 100 − 37 = 63 Setzlinge sind Salat. 63 Setzlinge auf 9 Beete: 63 : 9 = 7. In jedes Beet kommen 7 Salat-Setzlinge.","sprachtext":null,"symbol":"🌱"},{"id":"I-20","gruppe":"I","block":"Ib","blockNr":2,"nr":20,"rechenarten":["*","/"],"schwierigkeit":10,"thema":"Familienessen","geschichte":"Das Familienessen beginnt um 18 Uhr. Mama Rabia füllt 3 Krüge mit je 24 Bechern Ayran. Aslan stellt alle Becher gleichmäßig auf 8 Tabletts.","frage":"Wie viele Becher stehen auf einem Tablett?","antwort":9,"rechenweg":"3 * 24 / 8","hinweis":"Wie viele Becher sind es insgesamt? Die Uhrzeit brauchst du nicht.","erklaerung":"So denkst du: 3 Krüge mit je 24 Bechern: 3 · 24 = 72 Becher. Die Uhrzeit ist für die Rechnung egal. 72 Becher auf 8 Tabletts: 72 : 8 = 9. Auf jedem Tablett stehen 9 Becher.","sprachtext":null,"symbol":"🥛"},{"id":"I-21","gruppe":"I","block":"Ic","blockNr":3,"nr":21,"rechenarten":["/","+"],"schwierigkeit":1,"thema":"Bücherregal","geschichte":"Paul räumt 45 Hefte in 9 gleich hohe Stapel. Auf dem Tisch liegt schon ein alter Stapel mit 16 Heften. Paul legt einen neuen Stapel oben auf den alten Stapel.","frage":"Wie viele Hefte hat dieser große Stapel jetzt?","antwort":21,"rechenweg":"45 / 9 + 16","hinweis":"Wie viele Hefte sind in einem neuen Stapel? Dann rechne die alten Hefte dazu.","erklaerung":"So denkst du: 45 Hefte in 9 Stapel: 45 : 9 = 5 Hefte pro Stapel. Ein neuer Stapel kommt auf den alten mit 16 Heften. 5 + 16 = 21. Der große Stapel hat 21 Hefte.","sprachtext":null,"symbol":"📒"},{"id":"I-22","gruppe":"I","block":"Ic","blockNr":3,"nr":22,"rechenarten":["*","/"],"schwierigkeit":2,"thema":"Imker","geschichte":"Der Imker arbeitet seit 20 Jahren mit Bienen. Er nimmt 9 Rahmen mit je 8 Waben aus den Stöcken. Alle Waben legt er gleichmäßig in 6 Kisten.","frage":"Wie viele Waben sind in einer Kiste?","antwort":12,"rechenweg":"9 * 8 / 6","hinweis":"Wie viele Waben sind es insgesamt? Die Jahre brauchst du nicht.","erklaerung":"So denkst du: 9 Rahmen mit je 8 Waben: 9 · 8 = 72 Waben. Die 20 Jahre sind für die Rechnung egal. 72 Waben auf 6 Kisten: 72 : 6 = 12. In jeder Kiste sind 12 Waben.","sprachtext":null,"symbol":"🐝"},{"id":"I-23","gruppe":"I","block":"Ic","blockNr":3,"nr":23,"rechenarten":["-","/"],"schwierigkeit":3,"thema":"Werkunterricht","geschichte":"Im Werkunterricht liegen 72 Nägel in einer Schachtel. 18 Nägel sind verbogen und kommen weg. Die guten Nägel werden gleichmäßig an 6 Gruppen verteilt. Ayups Gruppe schlägt gleich 4 Nägel in ein Brett.","frage":"Wie viele Nägel hat Ayups Gruppe noch?","antwort":5,"rechenweg":"(72 - 18) / 6 - 4","hinweis":"Rechne zuerst die guten Nägel aus. Verteile sie auf die Gruppen. Dann zieh die verbrauchten Nägel ab.","erklaerung":"So denkst du: 72 − 18 = 54 gute Nägel. 54 Nägel auf 6 Gruppen: 54 : 6 = 9 Nägel pro Gruppe. Ayups Gruppe verbraucht 4 Nägel. 9 − 4 = 5. Die Gruppe hat noch 5 Nägel.","sprachtext":null,"symbol":"🔩"},{"id":"I-24","gruppe":"I","block":"Ic","blockNr":3,"nr":24,"rechenarten":["*","+","/"],"schwierigkeit":4,"thema":"Klassenfest","geschichte":"Beim Klassenfest verkaufen Lia und Elyas Lose. Lia verkauft 5 Bögen mit je 6 Losen. Elyas hat 42 Lose in 7 gleich dicken Heftchen. Er verkauft genau 1 Heftchen.","frage":"Wie viele Lose verkaufen die beiden zusammen?","antwort":36,"rechenweg":"5 * 6 + 42 / 7","hinweis":"Rechne zuerst Lias Lose aus und dann die Lose in einem Heftchen. Zähl beides zusammen.","erklaerung":"So denkst du: Lia verkauft 5 · 6 = 30 Lose. In einem Heftchen sind 42 : 7 = 6 Lose, so viele verkauft Elyas. Zusammen sind das 30 + 6 = 36. Die beiden verkaufen 36 Lose.","sprachtext":null,"symbol":"🎟️"},{"id":"I-25","gruppe":"I","block":"Ic","blockNr":3,"nr":25,"rechenarten":["+","/"],"schwierigkeit":5,"thema":"Fußballturnier","geschichte":"Beim Fußballturnier spielen 64 Buben und 26 Mädchen mit. 4 Trainer helfen beim Einteilen. Alle Kinder werden gleichmäßig in 9 Mannschaften eingeteilt.","frage":"Wie viele Kinder sind in einer Mannschaft?","antwort":10,"rechenweg":"(64 + 26) / 9","hinweis":"Zähl zuerst alle Kinder zusammen. Die Trainer spielen nicht mit.","erklaerung":"So denkst du: 64 + 26 = 90 Kinder spielen mit. Die 4 Trainer zählen nicht dazu. 90 Kinder auf 9 Mannschaften: 90 : 9 = 10. In jeder Mannschaft sind 10 Kinder.","sprachtext":null,"symbol":"⚽"},{"id":"I-26","gruppe":"I","block":"Ic","blockNr":3,"nr":26,"rechenarten":["-","/","+"],"schwierigkeit":6,"thema":"Jausenstand","geschichte":"Ceylin hat am Jausenstand 93 Brezeln. Am Vormittag verkauft sie 45 Brezeln. Den Rest legt sie gleichmäßig auf 8 Teller. Auf einen Teller legt sie noch 7 Brezeln aus einer neuen Packung.","frage":"Wie viele Brezeln liegen auf diesem Teller?","antwort":13,"rechenweg":"(93 - 45) / 8 + 7","hinweis":"Wie viele Brezeln bleiben nach dem Vormittag? Verteile sie auf die Teller. Dann kommen noch welche dazu.","erklaerung":"So denkst du: 93 − 45 = 48 Brezeln bleiben übrig. 48 Brezeln auf 8 Teller: 48 : 8 = 6 pro Teller. Auf einen Teller kommen 7 dazu: 6 + 7 = 13. Dort liegen 13 Brezeln.","sprachtext":null,"symbol":"🥨"},{"id":"I-27","gruppe":"I","block":"Ic","blockNr":3,"nr":27,"rechenarten":["*","+","/"],"schwierigkeit":7,"thema":"Gemüsebeet","geschichte":"Elif erntet im Gemüsebeet 4 Kisten mit je 15 Erdäpfeln. Dazu findet sie noch 12 einzelne Erdäpfel. Alle Erdäpfel füllt sie gleichmäßig in 8 Sackerl.","frage":"Wie viele Erdäpfel sind in einem Sackerl?","antwort":9,"rechenweg":"(4 * 15 + 12) / 8","hinweis":"Rechne zuerst die Erdäpfel in den Kisten aus. Zähl die einzelnen dazu. Dann teile auf die Sackerl auf.","erklaerung":"So denkst du: 4 Kisten mit je 15 Erdäpfeln: 4 · 15 = 60. Mit den einzelnen sind es 60 + 12 = 72 Erdäpfel. 72 auf 8 Sackerl: 72 : 8 = 9. In jedem Sackerl sind 9 Erdäpfel.","sprachtext":null,"symbol":"🥔"},{"id":"I-28","gruppe":"I","block":"Ic","blockNr":3,"nr":28,"rechenarten":["-","/"],"schwierigkeit":8,"thema":"Familienessen","geschichte":"Beim großen Familienessen gibt es 90 Köfte. 36 Köfte werden sofort gegessen. Der Rest wird gleichmäßig auf 6 Platten gelegt. Von einer Platte nimmt sich Amar noch 2 Köfte.","frage":"Wie viele Köfte liegen noch auf dieser Platte?","antwort":7,"rechenweg":"(90 - 36) / 6 - 2","hinweis":"Wie viele Köfte bleiben übrig? Verteile sie auf die Platten. Dann zieh ab, was Amar nimmt.","erklaerung":"So denkst du: 90 − 36 = 54 Köfte bleiben übrig. 54 Köfte auf 6 Platten: 54 : 6 = 9 pro Platte. Amar nimmt 2 weg: 9 − 2 = 7. Auf der Platte liegen noch 7 Köfte.","sprachtext":null,"symbol":"🍢"},{"id":"I-29","gruppe":"I","block":"Ic","blockNr":3,"nr":29,"rechenarten":["*","+","/"],"schwierigkeit":9,"thema":"Pizzaofen","geschichte":"Aslan hilft beim Pizzaofen. Ein Blech braucht 10 Minuten im Ofen. Papa bäckt 3 Bleche mit je 8 Mini-Pizzen und dazu noch 16 Mini-Pizzen auf dem großen Blech. Alle Mini-Pizzen werden gleichmäßig in 5 Boxen gepackt.","frage":"Wie viele Mini-Pizzen sind in einer Box?","antwort":8,"rechenweg":"(3 * 8 + 16) / 5","hinweis":"Rechne zuerst alle Mini-Pizzen zusammen. Die Minuten brauchst du nicht.","erklaerung":"So denkst du: 3 Bleche mit je 8 Mini-Pizzen: 3 · 8 = 24. Mit dem großen Blech sind es 24 + 16 = 40. Die 10 Minuten sind für die Rechnung egal. 40 auf 5 Boxen: 40 : 5 = 8. In jeder Box sind 8 Mini-Pizzen.","sprachtext":null,"symbol":"🍕"},{"id":"I-30","gruppe":"I","block":"Ic","blockNr":3,"nr":30,"rechenarten":["/","+"],"schwierigkeit":10,"thema":"Fußballturnier","geschichte":"Nach dem Fußballturnier werden Medaillen verteilt. 18 Mannschaften haben mitgespielt. 96 kleine Medaillen werden gleichmäßig in 8 Schachteln gepackt, 63 große Medaillen gleichmäßig in 7 Schachteln. Aras trägt eine kleine und eine große Schachtel zur Bühne.","frage":"Wie viele Medaillen trägt Aras zusammen?","antwort":21,"rechenweg":"96 / 8 + 63 / 7","hinweis":"Wie viele Medaillen sind in einer kleinen Schachtel, wie viele in einer großen? Zähl beides zusammen.","erklaerung":"So denkst du: 96 : 8 = 12 kleine Medaillen sind in einer Schachtel. 63 : 7 = 9 große Medaillen sind in einer Schachtel. Zusammen: 12 + 9 = 21. Aras trägt 21 Medaillen.","sprachtext":null,"symbol":"🏅"},{"id":"J-01","gruppe":"J","block":"Ja","blockNr":1,"nr":1,"rechenarten":["*","-"],"schwierigkeit":1,"thema":"Alltag","geschichte":"Im Ferienlager stehen 4 Zelte. In jedem Zelt schlafen 6 Kinder. Das Lager dauert 7 Tage. Am Nachmittag gehen 5 Kinder zum Bach.","frage":"Wie viele Kinder bleiben bei den Zelten?","antwort":19,"rechenweg":"4 * 6 - 5","hinweis":"Welche Zahlen brauchst du wirklich? Rechne zuerst aus, wie viele Kinder insgesamt in den Zelten schlafen.","erklaerung":"So denkst du: Gefragt ist, wie viele Kinder bei den Zelten bleiben. Die 7 Tage brauchst du nicht. 4 Zelte mit je 6 Kindern: 4 * 6 = 24. Davon gehen 5 weg: 24 - 5 = 19.","sprachtext":null,"symbol":"⛺"},{"id":"J-02","gruppe":"J","block":"Ja","blockNr":1,"nr":2,"rechenarten":["+","-"],"schwierigkeit":2,"thema":"Alltag","geschichte":"Lia räumt in der Schulbibliothek ein Regal ein. Dort stehen schon 35 Bücher. In der Bibliothek gibt es auch 5 Tische. Lia stellt 9 neue Bücher dazu. Dann leiht Paul 4 Bücher aus.","frage":"Wie viele Bücher stehen jetzt im Regal?","antwort":40,"rechenweg":"35 + 9 - 4","hinweis":"Zuerst kommen Bücher dazu, dann werden welche ausgeliehen. Welche Zahl brauchst du nicht?","erklaerung":"So denkst du: Gefragt ist, wie viele Bücher im Regal stehen. Die 5 Tische brauchst du nicht. Erst kommen Bücher dazu: 35 + 9 = 44. Dann werden 4 ausgeliehen: 44 - 4 = 40.","sprachtext":null,"symbol":"📚"},{"id":"J-03","gruppe":"J","block":"Ja","blockNr":1,"nr":3,"rechenarten":["/","+"],"schwierigkeit":3,"thema":"Alltag","geschichte":"Beim Spieleabend verteilt Amar 18 Würfel gleichmäßig in 3 Becher. Auf dem Tisch stehen auch 5 Spielfiguren. Danach legt Amar in jeden Becher noch 2 Würfel dazu.","frage":"Wie viele Würfel sind jetzt in einem Becher?","antwort":8,"rechenweg":"18 / 3 + 2","hinweis":"Teile zuerst die 18 Würfel gleichmäßig auf. Die Spielfiguren brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Würfel in einem Becher sind. Die 5 Spielfiguren brauchst du nicht. Erst teilst du: 18 / 3 = 6. Dann kommen 2 dazu: 6 + 2 = 8.","sprachtext":null,"symbol":"🎲"},{"id":"J-04","gruppe":"J","block":"Ja","blockNr":1,"nr":4,"rechenarten":["*","-"],"schwierigkeit":4,"thema":"Alltag","geschichte":"Ceylin besucht das Naturkundemuseum. Das Museum hat 2 Stockwerke. In einem Saal stehen 5 Schaukästen mit je 7 glitzernden Steinen. 12 Steine werden für eine Ausstellung weggeräumt.","frage":"Wie viele Steine bleiben in den Schaukästen?","antwort":23,"rechenweg":"5 * 7 - 12","hinweis":"Rechne zuerst aus, wie viele Steine in allen Schaukästen liegen. Welche Zahl brauchst du nicht?","erklaerung":"So denkst du: Gefragt ist, wie viele Steine bleiben. Die 2 Stockwerke brauchst du nicht. 5 Schaukästen mit je 7 Steinen: 5 * 7 = 35. Dann werden 12 weggeräumt: 35 - 12 = 23.","sprachtext":null,"symbol":"🪨"},{"id":"J-05","gruppe":"J","block":"Ja","blockNr":1,"nr":5,"rechenarten":["*","-"],"schwierigkeit":5,"thema":"Alltag","geschichte":"Bei der Obsternte pflückt Talha 6 Körbe mit je 9 Äpfeln. Auf der Wiese stehen 12 Bäume. Talha gibt seiner Mama Sultan 18 Äpfel für einen Kuchen.","frage":"Wie viele Äpfel hat Talha noch?","antwort":36,"rechenweg":"6 * 9 - 18","hinweis":"Wie viele Äpfel hat Talha zuerst insgesamt? Die Bäume auf der Wiese brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Äpfel Talha noch hat. Die 12 Bäume brauchst du nicht. 6 Körbe mit je 9 Äpfeln: 6 * 9 = 54. Er gibt 18 ab: 54 - 18 = 36.","sprachtext":null,"symbol":"🍎"},{"id":"J-06","gruppe":"J","block":"Ja","blockNr":1,"nr":6,"rechenarten":["-"],"schwierigkeit":6,"thema":"Alltag","geschichte":"Ayda verkauft am Flohmarkt Sticker. Ihr Stand ist 2 Meter lang. Am Morgen hat sie 40 Sticker. Sie verkauft 16 Sticker und verschenkt 3 an ihre Freundin.","frage":"Wie viele Sticker hat Ayda am Abend noch?","antwort":21,"rechenweg":"40 - 16 - 3","hinweis":"Zieh beide Mengen nacheinander ab. Welche Zahl brauchst du nicht?","erklaerung":"So denkst du: Gefragt ist, wie viele Sticker übrig sind. Die 2 Meter brauchst du nicht. Erst werden Sticker verkauft: 40 - 16 = 24. Dann verschenkt sie 3: 24 - 3 = 21.","sprachtext":null,"symbol":"✨"},{"id":"J-07","gruppe":"J","block":"Ja","blockNr":1,"nr":7,"rechenarten":["*","+"],"schwierigkeit":7,"thema":"Alltag","geschichte":"Ayup hilft im Postamt. Dort arbeiten 7 Mitarbeiter. Auf 4 Regalen liegen je 12 Briefe. Auf dem Tisch liegen noch 15 Briefe.","frage":"Wie viele Briefe sind das zusammen?","antwort":63,"rechenweg":"4 * 12 + 15","hinweis":"Rechne zuerst die Briefe auf den Regalen aus. Die Mitarbeiter brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Briefe es zusammen sind. Die 7 Mitarbeiter brauchst du nicht. 4 Regale mit je 12 Briefen: 4 * 12 = 48. Dazu die 15 vom Tisch: 48 + 15 = 63.","sprachtext":null,"symbol":"✉️"},{"id":"J-08","gruppe":"J","block":"Ja","blockNr":1,"nr":8,"rechenarten":["-","+"],"schwierigkeit":8,"thema":"Alltag","geschichte":"Im Hallenbad liegen am Morgen 45 Schwimmbretter im Regal. Das große Becken ist 25 Meter lang. Am Vormittag holen sich die Kinder 23 Bretter. Später bringen sie 10 Bretter zurück.","frage":"Wie viele Bretter liegen jetzt im Regal?","antwort":32,"rechenweg":"45 - 23 + 10","hinweis":"Erst werden Bretter geholt, dann kommen welche zurück. Die Länge des Beckens brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Bretter im Regal liegen. Die 25 Meter brauchst du nicht. Erst werden Bretter geholt: 45 - 23 = 22. Dann kommen 10 zurück: 22 + 10 = 32.","sprachtext":null,"symbol":"🏊"},{"id":"J-09","gruppe":"J","block":"Ja","blockNr":1,"nr":9,"rechenarten":["*","-"],"schwierigkeit":9,"thema":"Alltag","geschichte":"Im Ferienlager macht Elifs Gruppe eine Nachtwanderung. Der Weg ist 4 Kilometer lang. 7 Gruppen bekommen je 9 Knicklichter. Am Ende der Wanderung leuchten 21 Knicklichter nicht mehr.","frage":"Wie viele Knicklichter leuchten noch?","antwort":42,"rechenweg":"7 * 9 - 21","hinweis":"Wie viele Knicklichter gibt es insgesamt? Die Kilometer brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Knicklichter noch leuchten. Die 4 Kilometer brauchst du nicht. 7 Gruppen mit je 9 Knicklichtern: 7 * 9 = 63. 21 leuchten nicht mehr: 63 - 21 = 42.","sprachtext":null,"symbol":"🔦"},{"id":"J-10","gruppe":"J","block":"Ja","blockNr":1,"nr":10,"rechenarten":["*","-","+"],"schwierigkeit":10,"thema":"Alltag","geschichte":"Aras ordnet die Schulbibliothek. Sie ist an 5 Tagen in der Woche offen. In 3 Regalen stehen je 20 Bücher. 14 Bücher werden ausgeliehen. Dann kommen 9 Bücher zurück.","frage":"Wie viele Bücher stehen jetzt in den Regalen?","antwort":55,"rechenweg":"3 * 20 - 14 + 9","hinweis":"Rechne zuerst alle Bücher in den Regalen aus. Dann geht etwas weg und kommt etwas dazu. Eine Zahl brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Bücher in den Regalen stehen. Die 5 Tage brauchst du nicht. 3 Regale mit je 20 Büchern: 3 * 20 = 60. Ausgeliehen: 60 - 14 = 46. Zurückgebracht: 46 + 9 = 55.","sprachtext":null,"symbol":"📖"},{"id":"J-11","gruppe":"J","block":"Jb","blockNr":2,"nr":11,"rechenarten":["/","-"],"schwierigkeit":1,"thema":"Alltag","geschichte":"Beim Spieleabend verteilt Lia 16 Karten gleichmäßig an 4 Kinder. Auf dem Tisch liegen auch 5 Würfel. Paul legt gleich 3 seiner Karten ab.","frage":"Wie viele Karten hält Paul dann noch in der Hand?","antwort":1,"rechenweg":"16 / 4 - 3","hinweis":"Teile die Karten zuerst gleichmäßig auf. Die Würfel brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Karten Paul noch hält. Die 5 Würfel brauchst du nicht. Jedes Kind bekommt 16 / 4 = 4 Karten. Paul legt 3 ab: 4 - 3 = 1.","sprachtext":null,"symbol":"🃏"},{"id":"J-12","gruppe":"J","block":"Jb","blockNr":2,"nr":12,"rechenarten":["/","+"],"schwierigkeit":2,"thema":"Alltag","geschichte":"Bei der Obsternte sammelt Asel 28 Birnen. Im Garten stehen 6 Bäume. Asel legt die Birnen gleichmäßig in 4 Kisten. In eine Kiste legt sie noch 9 Birnen vom kleinen Baum dazu.","frage":"Wie viele Birnen sind jetzt in dieser Kiste?","antwort":16,"rechenweg":"28 / 4 + 9","hinweis":"Wie viele Birnen kommen zuerst in jede Kiste? Die Bäume brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Birnen in dieser einen Kiste sind. Die 6 Bäume brauchst du nicht. In jede Kiste kommen 28 / 4 = 7 Birnen. Dann legt Asel 9 dazu: 7 + 9 = 16.","sprachtext":null,"symbol":"🍐"},{"id":"J-13","gruppe":"J","block":"Jb","blockNr":2,"nr":13,"rechenarten":["*","-"],"schwierigkeit":3,"thema":"Alltag","geschichte":"Im Hallenbad schwimmt Cesur 3 Runden mit je 9 Bahnen. Das Wasser ist 28 Grad warm. Lukas schwimmt 13 Bahnen weniger als Cesur.","frage":"Wie viele Bahnen schwimmt Lukas?","antwort":14,"rechenweg":"3 * 9 - 13","hinweis":"Wie viele Bahnen schwimmt Cesur insgesamt? Die Wassertemperatur brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Bahnen Lukas schwimmt. Die 28 Grad brauchst du nicht. Cesur schwimmt 3 * 9 = 27 Bahnen. Lukas schwimmt 13 weniger: 27 - 13 = 14.","sprachtext":null,"symbol":"🌊"},{"id":"J-14","gruppe":"J","block":"Jb","blockNr":2,"nr":14,"rechenarten":["*","+"],"schwierigkeit":4,"thema":"Alltag","geschichte":"Ayup hilft wieder im Postamt. Heute warten dort 9 Leute. Ayup klebt auf 6 Pakete je 4 Marken. Danach klebt er noch 18 Marken auf Briefe.","frage":"Wie viele Marken verbraucht Ayup insgesamt?","antwort":42,"rechenweg":"6 * 4 + 18","hinweis":"Rechne zuerst die Marken für die Pakete aus. Die wartenden Leute brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Marken Ayup verbraucht. Die 9 Leute brauchst du nicht. Für die Pakete: 6 * 4 = 24 Marken. Dazu die 18 für die Briefe: 24 + 18 = 42.","sprachtext":null,"symbol":"📮"},{"id":"J-15","gruppe":"J","block":"Jb","blockNr":2,"nr":15,"rechenarten":["+","/"],"schwierigkeit":5,"thema":"Alltag","geschichte":"Elyas besucht mit seiner Mama Carola das Naturkundemuseum. Das Museum hat 3 Eingänge. Für die Kinderstation werden 14 Muscheln und 22 Steine gleichmäßig auf 4 Tische verteilt.","frage":"Wie viele Fundstücke liegen auf einem Tisch?","antwort":9,"rechenweg":"(14 + 22) / 4","hinweis":"Zähle zuerst alle Fundstücke zusammen. Die Eingänge brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Fundstücke auf einem Tisch liegen. Die 3 Eingänge brauchst du nicht. Zusammen sind es 14 + 22 = 36 Stücke. Verteilt auf 4 Tische: 36 / 4 = 9.","sprachtext":null,"symbol":"🐚"},{"id":"J-16","gruppe":"J","block":"Jb","blockNr":2,"nr":16,"rechenarten":["*","-"],"schwierigkeit":6,"thema":"Alltag","geschichte":"Ceylin packt für den Flohmarkt 3 Schachteln mit je 14 Murmeln ein. Am Stand liegen auch 20 Bücher. Ceylin verkauft 17 Murmeln.","frage":"Wie viele Murmeln hat Ceylin noch?","antwort":25,"rechenweg":"3 * 14 - 17","hinweis":"Wie viele Murmeln hat Ceylin am Anfang? Die Bücher brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Murmeln übrig sind. Die 20 Bücher brauchst du nicht. 3 Schachteln mit je 14 Murmeln: 3 * 14 = 42. Verkauft werden 17: 42 - 17 = 25.","sprachtext":null,"symbol":"🔵"},{"id":"J-17","gruppe":"J","block":"Jb","blockNr":2,"nr":17,"rechenarten":["-"],"schwierigkeit":7,"thema":"Alltag","geschichte":"Im Ferienlager sammelt Elifs Gruppe 52 Holzstücke für das Lagerfeuer. Im Lager gibt es 6 Gruppen. Am ersten Abend verbrennen 24 Holzstücke, am zweiten Abend 19.","frage":"Wie viele Holzstücke sind dann noch übrig?","antwort":9,"rechenweg":"52 - 24 - 19","hinweis":"Zieh die verbrannten Holzstücke nacheinander ab. Die Anzahl der Gruppen brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Holzstücke übrig sind. Die 6 Gruppen brauchst du nicht. Nach dem ersten Abend: 52 - 24 = 28. Nach dem zweiten Abend: 28 - 19 = 9.","sprachtext":null,"symbol":"🔥"},{"id":"J-18","gruppe":"J","block":"Jb","blockNr":2,"nr":18,"rechenarten":["-","/"],"schwierigkeit":8,"thema":"Alltag","geschichte":"Talha hilft in der Schulbibliothek. Dort stehen 8 Tische. Die Bibliothek bekommt 45 neue Lesezeichen. 21 Lesezeichen werden gleich an Kinder verteilt. Der Rest wird gleichmäßig in 4 Schachteln gelegt.","frage":"Wie viele Lesezeichen kommen in eine Schachtel?","antwort":6,"rechenweg":"(45 - 21) / 4","hinweis":"Wie viele Lesezeichen bleiben nach dem Verteilen übrig? Die Tische brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Lesezeichen in eine Schachtel kommen. Die 8 Tische brauchst du nicht. Übrig bleiben 45 - 21 = 24 Lesezeichen. In 4 Schachteln: 24 / 4 = 6.","sprachtext":null,"symbol":"🔖"},{"id":"J-19","gruppe":"J","block":"Jb","blockNr":2,"nr":19,"rechenarten":["*","+"],"schwierigkeit":9,"thema":"Alltag","geschichte":"Beim Spieleabend baut Aras Türme aus leiben nach dem Aussortieren? Die Schüsseln brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Kärtchen jedes Kind bekommt. Die 2 Schüsseln brauchst du nicht. Nach dem Aussortieren bleiben 56 - 16 = 40 Kärtchen. Verteilt an 5 Kinder: 40 / 5 = 8.","sprachtext":null,"symbol":"🎴"},{"id":"J-28","gruppe":"J","block":"Jc","blockNr":3,"nr":28,"rechenarten":["*","+","-"],"schwierigkeit":8,"thema":"Alltag","geschichte":"Bei der Obsternte füllt Aslan 7 Sackerl mit je 6 Äpfeln. Die Leiter hat 8 Sprossen. Seine Mama Rabia pflückt noch 39 Äpfel dazu. 45 Äpfel werden gleich zu Saft gepresst.","frage":"Wie viele Äpfel bleiben übrig?","antwort":36,"rechenweg":"7 * 6 + 39 - 45","hinweis":"Wie viele Äpfel sind in den Sackerln? Die Sprossen der Leiter brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Äpfel bleiben. Die 8 Sprossen brauchst du nicht. In den Sackerln: 7 * 6 = 42. Mit Mama Rabias Äpfeln: 42 + 39 = 81. Gepresst werden 45: 81 - 45 = 36.","sprachtext":null,"symbol":"🍏"},{"id":"J-29","gruppe":"J","block":"Jc","blockNr":3,"nr":29,"rechenarten":["-","*"],"schwierigkeit":9,"thema":"Alltag","geschichte":"Im Hallenbad gibt es 90 Spinde. Im großen Becken sind 6 Bahnen. 3 Schulklassen mit je 8 Kindern nehmen je 1 Spind. Danach nehmen noch 21 andere Gäste je 1 Spind.","frage":"Wie viele Spinde sind noch frei?","antwort":45,"rechenweg":"90 - 3 * 8 - 21","hinweis":"Rechne zuerst aus, wie viele Kinder in den Schulklassen sind. Die Bahnen brauchst du nicht.","erklaerung":"So denkst du: Gefragt ist, wie viele Spinde frei sind. Die 6 Bahnen brauchst du nicht. In den Klassen sind 3 * 8 = 24 Kinder. Nach den Klassen: 90 - 24 = 66 Spinde. Nach den Gästen: 66 - 21 = 45.","sprachtext":null,"symbol":"🔑"},{"id":"J-30","gruppe":"J","block":"Jc","blockNr":3,"nr":30,"rechenarten":["*","+","-"],"schwierigkeit":10,"thema":"Alltag","geschichte":"Elif hilft mit ihrer Mama Ayten im Postamt. Das Postamt hat 3 Schalter. Auf 4 Wagen liegen je 15 Pakete. Aus dem Lager ema":"Geld","geschichte":"Asel, Lia und Ceylin verkaufen am Schulbasar selbst gemalte Bilder um zusammen 24 Euro. Sie teilen das Geld gerecht. Asel wirft ihren Teil in die Sparbüchse. Dort waren schon 15 Euro. Später nimmt sie 2 Euro heraus.","frage":"Wie viele Euro sind jetzt in Asels Sparbüchse?","antwort":21,"rechenweg":"24 / 3 + 15 - 2","hinweis":"Teil zuerst die 24 Euro gerecht durch die 3 Kinder. Zähl Asels Teil zu den 15 Euro dazu. Zieh am Ende ab, was sie herausnimmt.","erklaerung":"So denkst du: 24 Euro geteilt durch 3 Kinder sind 24 / 3 = 8 Euro für Asel. In der Sparbüchse sind dann 8 + 15 = 23 Euro. Asel nimmt 2 Euro heraus, also bleiben 23 - 2 = 21 Euro.","sprachtext":null,"symbol":"🖼️"},{"id":"K-07","gruppe":"K","block":"Ka","blockNr":1,"nr":7,"rechenarten":["-","*"],"schwierigkeit":7,"thema":"Geld","geschichte":"Ceylin ist mit 50 Euro am Christkindlmarkt. Der Markt hat 25 Stände. Ceylin kauft 2 Sackerl Kekse zu je 7 Euro und warme Handschuhe um 19 Euro.","frage":"Wie viele Euro hat Ceylin danach noch?","antwort":17,"rechenweg":"50 - 2 * 7 - 19","hinweis":"Rechne zuerst aus, was die 2 Sackerl Kekse zusammen kosten. Zieh sie von Ceylins Geld ab. Zieh dann die Handschuhe ab. Die 25 Stände brauchst du nicht.","erklaerung":"So denkst du: 2 Sackerl zu je 7 Euro kosten 2 * 7 = 14 Euro. Ceylin hat dann 50 - 14 = 36 Euro. Für die Handschuhe zahlt sie 19 Euro, also bleiben 36 - 19 = 17 Euro. Die 25 Stände sind nur ein Ablenker.","sprachtext":null,"symbol":"🎄"},{"id":"K-08","gruppe":"K","block":"Ka","blockNr":1,"nr":8,"rechenarten":["+","-","/"],"schwierigkeit":8,"thema":"Geld","geschichte":"Amar und 3 Freunde gewinnen bei der Tombola zusammen 80 Cent. Die vier Kinder teilen den Gewinn gerecht. Amar hatte vorher schon 37 Cent. Dann kauft er ein Zuckerl um 25 Cent.","frage":"Wie viele Cent hat Amar jetzt?","antwort":32,"rechenweg":"80 / 4 + 37 - 25","hinweis":"Amar und seine 3 Freunde sind zusammen 4 Kinder. Teil den Gewinn durch 4. Zähl dann Amars altes Geld dazu und zieh das Zuckerl ab.","erklaerung":"So denkst du: 4 Kinder teilen 80 Cent, also 80 / 4 = 20 Cent für jeden. Amar hat dann 20 + 37 = 57 Cent. Für das Zuckerl zahlt er 25 Cent, also bleiben 57 - 25 = 32 Cent.","sprachtext":null,"symbol":"🍬"},{"id":"K-09","gruppe":"K","block":"Ka","blockNr":1,"nr":9,"rechenarten":["-","*"],"schwierigkeit":9,"thema":"Geld","geschichte":"Cesur und Aras verkaufen am Bauernmarkt Apfelsackerl. Der Markt beginnt um 9 Uhr. Cesur verkauft 7 Sackerl zu je 4 Euro. Aras verkauft 5 Sackerl zu je 4 Euro.","frage":"Wie viele Euro nimmt Cesur mehr ein als Aras?","antwort":8,"rechenweg":"7 * 4 - 5 * 4","hinweis":"Rechne zuerst aus, wie viele Euro Cesur einnimmt. Rechne dann Aras aus. Zieh die kleinere Zahl von der größeren ab. Die Uhrzeit brauchst du nicht.","erklaerung":"So denkst du: Cesur nimmt 7 * 4 = 28 Euro ein. Aras nimmt 5 * 4 = 20 Euro ein. Der Unterschied ist 28 - 20 = 8 Euro. Die Uhrzeit 9 ist nur ein Ablenker.","sprachtext":null,"symbol":"🍎"},{"id":"K-10","gruppe":"K","block":"Ka","blockNr":1,"nr":10,"rechenarten":["-","*","/"],"schwierigkeit":10,"thema":"Geld","geschichte":"Aslan hilft Mama Rabia am Punschstand. Sie verkaufen 5 Becher Punsch zu je 4 Euro. Vom Geld zahlen sie 8 Euro für neue Becher. Den Rest teilen sie gerecht auf die Klassenkassa und auf Aslans Sparbüchse auf.","frage":"Wie viele Euro bekommt die Klassenkassa?","antwort":6,"rechenweg":"(5 * 4 - 8) / 2","hinweis":"Rechne zuerst die Einnahmen aus. Zieh die 8 Euro für die Becher ab. Teil den Rest gerecht in 2 gleich große Teile.","erklaerung":"So denkst du: 5 Becher zu je 4 Euro bringen 5 * 4 = 20 Euro. Nach den Becherkosten bleiben 20 - 8 = 12 Euro. Die 12 Euro werden gerecht geteilt: 12 / 2 = 6 Euro für die Klassenkassa.","sprachtext":null,"symbol":"🎪"},{"id":"K-11","gruppe":"K","block":"Kb","blockNr":2,"nr":11,"rechenarten":["-","*"],"schwierigkeit":1,"thema":"Geld","geschichte":"Elif geht mit Mama Ayten über den Christkindlmarkt. Sie kaufen eine Kerze um 12 Euro und 2 Sterne zu je 9 Euro. Sie zahlen mit 40 Euro.","frage":"Wie viele Euro bekommen sie zurück?","antwort":10,"rechenweg":"40 - 12 - 2 * 9","hinweis":"Rechne zuerst aus, was die 2 Sterne zusammen kosten. Zieh dann die Kerze und die Sterne von den 40 Euro ab.","erklaerung":"So denkst du: 2 Sterne zu je 9 Euro kosten 2 * 9 = 18 Euro. Nach der Kerze bleiben 40 - 12 = 28 Euro. Nach den Sternen bleiben 28 - 18 = 10 Euro Wechselgeld.","sprachtext":null,"symbol":"🕯️"},{"id":"K-12","gruppe":"K","block":"Kb","blockNr":2,"nr":12,"rechenarten":["+","-","*"],"schwierigkeit":2,"thema":"Geld","geschichte":"Ayup ist 9 Jahre alt. In seiner Sparbüchse sind 35 Cent. Er wirft 3 Münzen zu je 20 Cent dazu. Dann nimmt er 40 Cent heraus.","frage":"Wie viele Cent sind noch in der Sparbüchse?","antwort":55,"rechenweg":"35 + 3 * 20 - 40","hinweis":"Rechne zuerst aus, wie viele Cent die 3 Münzen zusammen sind. Zähl sie zu den 35 Cent dazu. Zieh am Ende die 40 Cent ab. Ayups Alter brauchst du nicht.","erklaerung":"So denkst du: 3 Münzen zu je 20 Cent sind 3 * 20 = 60 Cent. In der Sparbüchse sind dann 35 + 60 = 95 Cent. Ayup nimmt 40 Cent heraus, also bleiben 95 - 40 = 55 Cent. Das Alter 9 ist nur ein Ablenker.","sprachtext":null,"symbol":"🪙"},{"id":"K-13","gruppe":"K","block":"Kb","blockNr":2,"nr":13,"rechenarten":["-","*"],"schwierigkeit":3,"thema":"Geld","geschichte":"Lia verkauft am Schulbasar 8 Armbänder zu je 2 Euro. Vom Geld kauft sie ein Buch um 9 Euro und ein Poster um 4 Euro.","frage":"Wie viele Euro bleiben Lia übrig?","antwort":3,"rechenweg":"8 * 2 - 9 - 4","hinweis":"Rechne zuerst aus, wie viele Euro Lia einnimmt. Zieh dann das Buch ab und danach das Poster.","erklaerung":"So denkst du: 8 Armbänder zu je 2 Euro bringen 8 * 2 = 16 Euro. Nach dem Buch bleiben 16 - 9 = 7 Euro. Nach dem Poster bleiben 7 - 4 = 3 Euro.","sprachtext":null,"symbol":"🎀"},{"id":"K-14","gruppe":"K","block":"Kb","blockNr":2,"nr":14,"rechenarten":["-","*"],"schwierigkeit":4,"thema":"Geld","geschichte":"Paul hat 100 Cent im Geldtascherl. Die Trafik öffnet um 8 Uhr. Paul kauft dort einen Bleistift um 55 Cent und 2 Kaugummi zu je 10 Cent.","frage":"Wie viele Cent hat Paul noch?","antwort":25,"rechenweg":"100 - 55 - 2 * 10","hinweis":"Zieh zuerst den Bleistift ab. Rechne dann aus, was die 2 Kaugummi kosten, und zieh sie auch ab. Die Uhrzeit brauchst du nicht.","erklaerung":"So denkst du: Nach dem Bleistift bleiben 100 - 55 = 45 Cent. 2 Kaugummi zu je 10 Cent kosten 2 * 10 = 20 Cent. Es bleiben 45 - 20 = 25 Cent. Die Uhrzeit 8 ist nur ein Ablenker.","sprachtext":null,"symbol":"✏️"},{"id":"K-15","gruppe":"K","block":"Kb","blockNr":2,"nr":15,"rechenarten":["-","*","/"],"schwierigkeit":5,"thema":"Geld","geschichte":"Talha verkauft mit Mama Sultan Honig am Bauernmarkt. 9 Gläser kosten zusammen 45 Euro. Jedes Glas kostet gleich viel. Ein Kunde kauft 4 Gläser und zahlt mit 50 Euro.","frage":"Wie viele Euro Wechselgeld bekommt der Kunde?","antwort":30,"rechenweg":"50 - 45 / 9 * 4","hinweis":"Rechne zuerst aus, was 1 Glas kostet. Rechne dann den Preis für 4 Gläser aus. Zieh ihn von den 50 Euro ab.","erklaerung":"So denkst du: 1 Glas kostet 45 / 9 = 5 Euro. 4 Gläser kosten 4 * 5 = 20 Euro. Der Kunde bekommt 50 - 20 = 30 Euro zurück.","sprachtext":null,"symbol":"🍯"},{"id":"K-16","gruppe":"K","block":"Kb","blockNr":2,"nr":16,"rechenarten":["+","-","*"],"schwierigkeit":6,"thema":"Geld","geschichte":"In der Klassenkassa von Elyas sind 64 Euro. Die Klasse hat 24 Kinder. Elyas' Mama Carola spendet 15 Euro dazu. Die Klasse kauft 3 Spiele zu je 12 Euro.","frage":"Wie viele Euro sind jetzt in der Klassenkassa?","antwort":43,"rechenweg":"64 + 15 - 3 * 12","hinweis":"Zähl zuerst die Spende zur Klassenkassa dazu. Rechne dann aus, was die 3 Spiele kosten, und zieh sie ab. Die 24 Kinder brauchst du nicht.","erklaerung":"So denkst du: Mit der Spende sind 64 + 15 = 79 Euro in der Kassa. 3 Spiele zu je 12 Euro kosten 3 * 12 = 36 Euro. Es bleiben 79 - 36 = 43 Euro. Die 24 Kinder sind nur ein Ablenker.","sprachtext":null,"symbol":"🎲"},{"id":"K-17","gruppe":"K","block":"Kb","blockNr":2,"nr":17,"rechenarten":["+","-","*"],"schwierigkeit":7,"thema":"Geld","geschichte":"Bei der Tombola kostet 1 Los 15 Cent. Ceylin hat 90 Cent dabei. Sie kauft 5 Lose. Danach schenkt ihr der Bruder 25 Cent.","frage":"Wie viele Cent hat Ceylin jetzt?","antwort":40,"rechenweg":"90 - 5 * 15 + 25","hinweis":"Rechne zuerst aus, was die 5 Lose kosten. Zieh sie von Ceylins Geld ab. Zähl dann das Geschenk vom Bruder dazu.","erklaerung":"So denkst du: 5 Lose zu je 15 Cent kosten 5 * 15 = 75 Cent. Ceylin hat dann 90 - 75 = 15 Cent. Ihr Bruder schenkt ihr 25 Cent, also hat sie 15 + 25 = 40 Cent.","sprachtext":null,"symbol":"🎫"},{"id":"K-18","gruppe":"K","block":"Kb","blockNr":2,"nr":18,"rechenarten":["-","*"],"schwierigkeit":8,"thema":"Geld","geschichte":"Elyas und Mama Carola haben einen Stand am Christkindlmarkt. Ein Stern kostet 9 Euro, eine Kerze kostet 6 Euro. Ein Kunde kauft 2 Sterne und 1 Kerze. Er zahlt mit 50 Euro.","frage":"Wie viele Euro Wechselgeld bekommt der Kunde?","antwort":26,"rechenweg":"50 - 2 * 9 - 6","hinweis":"Rechne zuerst aus, was die 2 Sterne kosten. Zieh sie von den 50 Euro ab. Zieh dann die Kerze ab.","erklaerung":"So denkst du: 2 Sterne zu je 9 Euro kosten 2 * 9 = 18 Euro. Nach den Sternen bleiben 50 - 18 = 32 Euro. Nach der Kerze bleiben 32 - 6 = 26 Euro Wechselgeld.","sprachtext":null,"symbol":"⭐"},{"id":"K-19","gruppe":"K","block":"Kb","blockNr":2,"nr":19,"rechenarten":["-","*","/"],"schwierigkeit":9,"thema":"Geld","geschichte":"Ayda und Mama Cangül verkaufen Zuckerl am Schulbasar. Auf dem Tisch liegen 40 Zuckerl. 5 Zuckerl kosten zusammen 60 Cent. Lukas kauft 7 Zuckerl und zahlt mit 100 Cent.","frage":"Wie viele Cent bekommt Lukas zurück?","antwort":16,"rechenweg":"100 - 60 / 5 * 7","hinweis":"Rechne zuerst aus, was 1 Zuckerl kostet. Rechne dann den Preis für 7 Zuckerl aus. Zieh ihn von den 100 Cent ab. Die 40 Zuckerl am Tisch brauchst du nicht.","erklaerung":"So denkst du: 1 Zuckerl kostet 60 / 5 = 12 Cent. 7 Zuckerl kosten 7 * 12 = 84 Cent. Lukas bekommt 100 - 84 = 16 Cent zurück. Die 40 Zuckerl sind nur ein Ablenker.","sprachtext":null,"symbol":"🍭"},{"id":"K-20","gruppe":"K","block":"Kb","blockNr":2,"nr":20,"rechenarten":["-","*"],"schwierigkeit":10,"thema":"Geld","geschichte":"Aslan geht mit Mama Rabia zum Bauernmarkt. Rabia kauft 3 Sackerl Erdäpfel zu je 4 Euro und 2 Stück Käse zu je 9 Euro. Sie zahlt mit 50 Euro.","frage":"Wie viele Euro bekommt Rabia zurück?","antwort":20,"rechenweg":"50 - 3 * 4 - 2 * 9","hinweis":"Rechne zuerst die Erdäpfel aus, dann den Käse. Zieh beides nacheinander von den 50 Euro ab.","erklaerung":"So denkst du: 3 Sackerl zu je 4 Euro kosten 3 * 4 = 12 Euro. 2 Stück Käse zu je 9 Euro kosten 2 * 9 = 18 Euro. Nach den Erdäpfeln bleiben 50 - 12 = 38 Euro. Nach dem Käse bleiben 38 - 18 = 20 Euro Wechselgeld.","sprachtext":null,"symbol":"🧀"},{"id":"K-21","gruppe":"K","block":"Kc","blockNr":3,"nr":21,"rechenarten":["-","*"],"schwierigkeit":1,"thema":"Geld","geschichte":"Cesur ist in der Trafik. Dort hängen 12 Zeitungen. Cesur kauft 3 Sticker zu je 25 Cent und eine Kugel Kaugummi um 5 Cent. Er zahlt mit 90 Cent.","frage":"Wie viele Cent bekommt Cesur zurück?","antwort":10,"rechenweg":"90 - 3 * 25 - 5","hinweis":"Rechne zuerst aus, was die 3 Sticker kosten. Zieh sie vom Geld ab. Zieh dann das Kaugummi ab. Die 12 Zeitungen brauchst du nicht.","erklaerung":"So denkst du: 3 Sticker zu je 25 Cent kosten 3 * 25 = 75 Cent. Nach den Stickern bleiben 90 - 75 = 15 Cent. Nach dem Kaugummi bleiben 15 - 5 = 10 Cent. Die 12 Zeitungen sind nur ein Ablenker.","sprachtext":null,"symbol":"🗞️"},{"id":"K-22","gruppe":"K","block":"Kc","blockNr":3,"nr":22,"rechenarten":["+","-","*"],"schwierigkeit":2,"thema":"Geld","geschichte":"Lukas wirft 4 Wochen lang jede Woche 6 Euro in seine Sparbüchse. Vorher waren schon 8 Euro drin. Dann kauft er ein Kartenspiel um 19 Euro.","frage":"Wie viele Euro sind noch in der Sparbüchse?","antwort":13,"rechenweg":"4 * 6 + 8 - 19","hinweis":"Rechne zuerst aus, wie viel Lukas in 4 Wochen spart. Zähl die 8 Euro dazu, die schon drin waren. Zieh dann das Kartenspiel ab.","erklaerung":"So denkst du: In 4 Wochen spart Lukas 4 * 6 = 24 Euro. Mit den 8 Euro sind 24 + 8 = 32 Euro in der Sparbüchse. Nach dem Kartenspiel bleiben 32 - 19 = 13 Euro.","sprachtext":null,"symbol":"🃏"},{"id":"K-23","gruppe":"K","block":"Kc","blockNr":3,"nr":23,"rechenarten":["-","*"],"schwierigkeit":3,"thema":"Geld","geschichte":"In der Klasse von Asel sind 18 Kinder. Die Kinder sind 8 Jahre alt. Jedes Kind zahlt 5 Euro in die Klassenkassa ein. Die Klasse kauft einen Ball um 27 Euro und Springschnüre um 15 Euro.","frage":"Wie viele Euro bleiben in der Klassenkassa?","antwort":48,"rechenweg":"18 * 5 - 27 - 15","hinweis":"Rechne zuerst aus, wie viel Geld alle Kinder zusammen einzahlen. Zieh dann den Ball ab und danach die Springschnüre. Das Alter der Kinder brauchst du nicht.","erklaerung":"So denkst du: 18 Kinder zahlen je 5 Euro, das sind 18 * 5 = 90 Euro. Nach dem Ball bleiben 90 - 27 = 63 Euro. Nach den Springschnüren bleiben 63 - 15 = 48 Euro. Das Alter 8 ist nur ein Ablenker.","sprachtext":null,"symbol":"⚽"},{"id":"K-24","gruppe":"K","block":"Kc","blockNr":3,"nr":24,"rechenarten":["+","-","/"],"schwierigkeit":4,"thema":"Geld","geschichte":"Ayup und Amar gewinnen bei der Tombola zusammen 90 Cent. Sie teilen den Gewinn gerecht. Ayup hatte vorher schon 30 Cent. Er kauft ein Kaugummi um 25 Cent.","frage":"Wie viele Cent hat Ayup jetzt?","antwort":50,"rechenweg":"90 / 2 + 30 - 25","hinweis":"Teil den Gewinn gerecht durch 2. Zähl dann Ayups altes Geld dazu. Zieh am Ende das Kaugummi ab.","erklaerung":"So denkst du: 90 Cent geteilt durch 2 sind 90 / 2 = 45 Cent für Ayup. Mit seinen 30 Cent hat er 45 + 30 = 75 Cent. Nach dem Kaugummi bleiben 75 - 25 = 50 Cent.","sprachtext":null,"symbol":"💰"},{"id":"K-25","gruppe":"K","block":"Kc","blockNr":3,"nr":25,"rechenarten":["+","*"],"schwierigkeit":5,"thema":"Geld","geschichte":"Aras hilft am Punschstand vom Christkindlmarkt. Ein Kinderpunsch kostet 3 Euro, ein Tee kostet 4 Euro. Aras verkauft 7 Kinderpunsch und 6 Tee.","frage":"Wie viele Euro nimmt Aras ein?","antwort":45,"rechenweg":"7 * 3 + 6 * 4","hinweis":"Rechne zuerst das Geld für den Kinderpunsch aus. Rechne dann das Geld für den Tee aus. Zähl beides zusammen.","erklaerung":"So denkst du: 7 Kinderpunsch zu je 3 Euro bringen 7 * 3 = 21 Euro. 6 Tee zu je 4 Euro bringen 6 * 4 = 24 Euro. Zusammen sind das 21 + 24 = 45 Euro.","sprachtext":null,"symbol":"🫖"},{"id":"K-26","gruppe":"K","block":"Kc","blockNr":3,"nr":26,"rechenarten":["-","*"],"schwierigkeit":6,"thema":"Geld","geschichte":"Der Schulbasar hat 15 Stände. Asel hat 100 Cent. Sie kauft 4 Sticker zu je 12 Cent und einen Anhänger um 35 Cent.","frage":"Wie viele Cent hat Asel danach?","antwort":17,"rechenweg":"100 - 4 * 12 - 35","hinweis":"Rechne zuerst aus, was die 4 Sticker kosten. Zieh sie von den 100 Cent ab. Zieh dann den Anhänger ab. Die 15 Stände brauchst du nicht.","erklaerung":"So denkst du: 4 Sticker zu je 12 Cent kosten 4 * 12 = 48 Cent. Nach den Stickern bleiben 100 - 48 = 52 Cent. Nach dem Anhänger bleiben 52 - 35 = 17 Cent. Die 15 Stände sind nur ein Ablenker.","sprachtext":null,"symbol":"✨"},{"id":"K-27","gruppe":"K","block":"Kc","blockNr":3,"nr":27,"rechenarten":["+","-","*"],"schwierigkeit":7,"thema":"Geld","geschichte":"Elif hat 46 Euro in der Sparbüchse. Mama Ayten schenkt ihr 18 Euro dazu. Elif kauft am Christkindlmarkt 3 Geschenke zu je 8 Euro.","frage":"Wie viele Euro hat Elif noch?","antwort":40,"rechenweg":"46 + 18 - 3 * 8","hinweis":"Zähl zuerst das Geschenk von Mama Ayten zu Elifs Geld dazu. Rechne dann aus, was die 3 Geschenke kosten, und zieh sie ab.","erklaerung":"So denkst du: Elif hat 46 + 18 = 64 Euro. 3 Geschenke zu je 8 Euro kosten 3 * 8 = 24 Euro. Es bleiben 64 - 24 = 40 Euro.","sprachtext":null,"symbol":"🎁"},{"id":"K-28","gruppe":"K","block":"Kc","blockNr":3,"nr":28,"rechenarten":["-","/"],"schwierigkeit":8,"thema":"Geld","geschichte":"Talha, Ayup und Cesur verkaufen am Bauernmarkt Kürbisse um zusammen 96 Euro. Sie stehen 5 Stunden am Markt. Sie zahlen 15 Euro für den Stand. Den Rest teilen die drei Buben gerecht. Talha kauft von seinem Teil ein Buch um 19 Euro.","frage":"Wie viele Euro bleiben Talha?","antwort":8,"rechenweg":"(96 - 15) / 3 - 19","hinweis":"Zieh zuerst die Standgebühr von den Einnahmen ab. Teil den Rest gerecht durch 3. Zieh dann das Buch von Talhas Teil ab. Die 5 Stunden brauchst du nicht.","erklaerung":"So denkst du: Nach der Standgebühr bleiben 96 - 15 = 81 Euro. Geteilt durch 3 Buben sind das 81 / 3 = 27 Euro für Talha. Nach dem Buch bleiben 27 - 19 = 8 Euro. Die 5 Stunden sind nur ein Ablenker.","sprachtext":null,"symbol":"🎃"},{"id":"K-29","gruppe":"K","block":"Kc","blockNr":3,"nr":29,"rechenarten":["-","*"],"schwierigkeit":9,"thema":"Geld","geschichte":"In der Trafik kostet 1 Postkarte 32 Cent. Am Christkindlmarkt kostet die gleiche Karte 45 Cent. Lia kauft 2 Karten in der Trafik und nicht am Markt.","frage":"Wie viele Cent spart Lia dabei?","antwort":26,"rechenweg":"2 * 45 - 2 * 32","hinweis":"Rechne aus, was 2 Karten am Markt kosten. Rechne aus, was 2 Karten in der Trafik kosten. Zieh die kleinere Zahl von der größeren ab.","erklaerung":"So denkst du: 2 Karten am Markt kosten 2 * 45 = 90 Cent. 2 Karten in der Trafik kosten 2 * 32 = 64 Cent. Lia spart 90 - 64 = 26 Cent.","sprachtext":null,"symbol":"📮"},{"id":"K-30","gruppe":"K","block":"Kc","blockNr":3,"nr":30,"rechenarten":["-","*","/"],"schwierigkeit":10,"thema":"Geld","geschichte":"Aslan hilft bei der Schul-Tombola. Die Tombola dauert 3 Stunden. Ein Los kostet 2 Euro. Aslan verkauft 45 Lose. Die Preise haben zusammen 34 Euro gekostet. Die Hälfte vom übrigen Geld geht an die Klassenkassa.","frage":"Wie viele Euro bekommt die Klassenkassa?","antwort":28,"rechenweg":"(45 * 2 - 34) / 2","hinweis":"Rechne zuerst aus, wie viel Geld die Lose bringen. Zieh die Kosten für die Preise ab. Teil den Rest durch 2. Die 3 Stunden brauchst du nicht.","erklaerung":"So denkst du: 45 Lose zu je 2 Euro bringen 45 * 2 = 90 Euro. Nach den Preisen bleiben 90 - 34 = 56 Euro. Die Hälfte davon ist 56 / 2 = 28 Euro für die Klassenkassa. Die 3 Stunden sind nur ein Ablenker.","sprachtext":null,"symbol":"🎉"},{"id":"L-01","gruppe":"L","block":"La","blockNr":1,"nr":1,"rechenarten":["-"],"schwierigkeit":1,"thema":"Zeit","geschichte":"Das Schwimmtraining von Elyas dauert 60 Minuten. Das Becken ist 50 m lang. Zuerst schwimmen sich alle 20 Minuten ein. Dann üben sie 25 Minuten Kraul.","frage":"Wie viele Minuten bleiben für das freie Schwimmen?","antwort":15,"rechenweg":"60 - 20 - 25","hinweis":"Zieh vom ganzen Training zuerst das Einschwimmen ab und dann die Übungszeit. Die Länge des Beckens brauchst du nicht.","erklaerung":"So denkst du: Das ganze Training dauert 60 Minuten. Nach dem Einschwimmen bleiben 60 − 20 = 40 Minuten. Nach dem Kraul-Üben bleiben 40 − 25 = 15 Minuten. Die 50 m sind nur die Beckenlänge und gehören nicht zur Rechnung.","sprachtext":null,"symbol":"🏊"},{"id":"L-02","gruppe":"L","block":"La","blockNr":1,"nr":2,"rechenarten":["+","-"],"schwierigkeit":2,"thema":"Länge","geschichte":"Ayda lässt am Feld ihren Drachen steigen. Ihre Schnur ist 35 m lang. Mama Cangül gibt ihr noch eine Schnur mit 45 m, die sie anknüpft. 30 m bleiben aufgewickelt auf der Rolle. 3 andere Kinder schauen zu.","frage":"Wie viele Meter Schnur hat Ayda ausgelassen?","antwort":50,"rechenweg":"35 + 45 - 30","hinweis":"Rechne zuerst aus, wie lang die ganze Schnur ist. Zieh dann die Meter ab, die noch auf der Rolle sind.","erklaerung":"So denkst du: Ayda knüpft die beiden Schnüre zusammen: 35 + 45 = 80 m. Auf der Rolle bleiben 30 m. Ausgelassen sind also 80 − 30 = 50 m. Die 3 Kinder haben mit der Schnur nichts zu tun.","sprachtext":null,"symbol":"🪁"},{"id":"L-03","gruppe":"L","block":"La","blockNr":1,"nr":3,"rechenarten":["+","-"],"schwierigkeit":3,"thema":"Gewicht","geschichte":"Talha und Cesur helfen beim Apfelernten. Talha pflückt 24 kg, Cesur pflückt 18 kg. 15 kg verkaufen sie gleich am Stand vom Bauern. Am Hof stehen 6 Apfelbäume.","frage":"Wie viele Kilogramm Äpfel bleiben den beiden übrig?","antwort":27,"rechenweg":"24 + 18 - 15","hinweis":"Rechne zuerst zusammen, wie viel beide gepflückt haben. Zieh dann die verkauften Kilogramm ab.","erklaerung":"So denkst du: Zusammen pflücken sie 24 + 18 = 42 kg. Davon verkaufen sie 15 kg. Übrig bleiben 42 − 15 = 27 kg. Die 6 Apfelbäume brauchst du zum Rechnen nicht.","sprachtext":null,"symbol":"🍎"},{"id":"L-04","gruppe":"L","block":"La","blockNr":1,"nr":4,"rechenarten":["+"],"schwierigkeit":4,"thema":"Zeit","geschichte":"Lukas macht mit Lia einen Radausflug. Zuerst fahren sie 35 Minuten bis zum See. Dort rasten sie 15 Minuten. Danach fahren sie noch 25 Minuten bis zur Eisdiele. Unterwegs überholen sie 7 andere Radfahrer.","frage":"Wie viele Minuten dauert der ganze Ausflug vom Start bis zur Eisdiele?","antwort":75,"rechenweg":"35 + 15 + 25","hinweis":"Zähle alle 3 Zeiten zusammen: Fahren, Rasten, Weiterfahren. Eine Zahl in der Geschichte gehört nicht dazu.","erklaerung":"So denkst du: Zuerst fahren sie 35 Minuten. Mit der Rast sind es 35 + 15 = 50 Minuten. Mit dem letzten Stück sind es 50 + 25 = 75 Minuten. Die 7 Radfahrer zählen nicht zur Zeit.","sprachtext":null,"symbol":"🚲"},{"id":"L-05","gruppe":"L","block":"La","blockNr":1,"nr":5,"rechenarten":["*","+"],"schwierigkeit":5,"thema":"Länge","geschichte":"Paul baut eine Modellbrücke. Er legt 4 kurze Stäbe hintereinander, jeder ist 8 cm lang. Vorne kommt noch ein langer Stab mit 25 cm dazu. In der Schachtel liegen noch 9 Stäbe.","frage":"Wie viele Zentimeter lang ist die Brücke?","antwort":57,"rechenweg":"4 * 8 + 25","hinweis":"Rechne zuerst aus, wie lang die 4 kurzen Stäbe zusammen sind. Dann kommt der lange Stab dazu.","erklaerung":"So denkst du: Die 4 kurzen Stäbe sind zusammen 4 · 8 = 32 cm lang. Dazu kommt der lange Stab: 32 + 25 = 57 cm. Die 9 Stäbe in der Schachtel werden nicht verbaut.","sprachtext":null,"symbol":"🌉"},{"id":"L-06","gruppe":"L","block":"La","blockNr":1,"nr":6,"rechenarten":["*","-"],"schwierigkeit":6,"thema":"Gewicht","geschichte":"Aras hilft beim Erdäpfelernten. Er füllt 4 Kisten, in jede passen genau 9 kg. Dann kauft die Nachbarin 13 kg von ihm. Aras arbeitet mit 2 Freunden zusammen.","frage":"Wie viele Kilogramm Erdäpfel bleiben übrig?","antwort":23,"rechenweg":"4 * 9 - 13","hinweis":"Rechne zuerst aus, wie viele Kilogramm in allen Kisten zusammen sind. Zieh dann den Einkauf der Nachbarin ab.","erklaerung":"So denkst du: In den Kisten sind 4 · 9 = 36 kg Erdäpfel. Die Nachbarin nimmt 13 kg mit. Übrig bleiben 36 − 13 = 23 kg. Die 2 Freunde musst du nicht mitrechnen.","sprachtext":null,"symbol":"🥔"},{"id":"L-07","gruppe":"L","block":"La","blockNr":1,"nr":7,"rechenarten":["/","+"],"schwierigkeit":7,"thema":"Zeit","geschichte":"Beim Stafettenlauf läuft die Mannschaft von Ceylin insgesamt 40 Minuten. Alle 4 Kinder laufen gleich lang. Vorher wärmt sich Ceylin 12 Minuten auf. 5 Mannschaften machen mit.","frage":"Wie viele Minuten ist Ceylin insgesamt in Bewegung, mit Aufwärmen und ihrem Lauf?","antwort":22,"rechenweg":"40 / 4 + 12","hinweis":"Teile die 40 Minuten durch die Anzahl der Kinder. Dann rechne das Aufwärmen dazu.","erklaerung":"So denkst du: Die 40 Minuten werden auf 4 Kinder aufgeteilt: 40 : 4 = 10 Minuten läuft Ceylin selbst. Dazu kommen 12 Minuten Aufwärmen. 10 + 12 = 22 Minuten. Die 5 Mannschaften brauchst du nicht.","sprachtext":null,"symbol":"🏃"},{"id":"L-08","gruppe":"L","block":"La","blockNr":1,"nr":8,"rechenarten":["-"],"schwierigkeit":8,"thema":"Länge","geschichte":"Am Wandertag geht die Klasse von Lia einen Rundweg mit 26 km. Vor der Jause schaffen sie 9 km, danach noch 8 km. Nach einer kurzen Rast gehen sie weitere 4 km. In der Klasse sind 22 Kinder.","frage":"Wie viele Kilometer fehlen jetzt noch bis zum Ziel?","antwort":5,"rechenweg":"26 - 9 - 8 - 4","hinweis":"Zieh vom ganzen Weg ein Stück nach dem anderen ab. Die Anzahl der Kinder brauchst du nicht.","erklaerung":"So denkst du: Nach dem ersten Stück fehlen 26 − 9 = 17 km. Nach dem zweiten Stück fehlen 17 − 8 = 9 km. Nach dem dritten Stück fehlen 9 − 4 = 5 km. Die 22 Kinder ändern am Weg nichts.","sprachtext":null,"symbol":"🥾"},{"id":"L-09","gruppe":"L","block":"La","blockNr":1,"nr":9,"rechenarten":["*","+","-"],"schwierigkeit":9,"thema":"Gewicht","geschichte":"Amar hilft am Obsthof. Er füllt 5 Sackerl mit je 6 kg Äpfeln. Der Bauer stellt ihm noch eine Kiste mit 18 kg dazu. 7 kg schenkt Amar seiner Tante. Am Hof stehen 3 Traktoren.","frage":"Wie viele Kilogramm Äpfel hat Amar am Ende?","antwort":41,"rechenweg":"5 * 6 + 18 - 7","hinweis":"Rechne zuerst die Sackerl zusammen, dann die Kiste dazu. Zum Schluss zieh das Geschenk ab.","erklaerung":"So denkst du: In den Sackerln sind 5 · 6 = 30 kg. Mit der Kiste sind es 30 + 18 = 48 kg. Nach dem Geschenk an die Tante bleiben 48 − 7 = 41 kg. Die 3 Traktoren zählen nicht.","sprachtext":null,"symbol":"🍏"},{"id":"L-10","gruppe":"L","block":"La","blockNr":1,"nr":10,"rechenarten":["-","/"],"schwierigkeit":10,"thema":"Zeit","geschichte":"Asel ist beim Skikurs. Der Kurs dauert 96 Minuten. Zuerst wärmen sich alle 15 Minuten auf. Die restliche Zeit teilt der Lehrer in 3 gleich lange Teile: 2 Teile für Abfahrten und 1 Teil für Spiele im Schnee. In der Gruppe sind 8 Kinder.","frage":"Wie viele Minuten dauern die Spiele im Schnee?","antwort":27,"rechenweg":"(96 - 15) / 3","hinweis":"Zieh zuerst das Aufwärmen von der ganzen Kurszeit ab. Teile den Rest in 3 gleiche Teile. Die Spiele sind genau 1 Teil.","erklaerung":"So denkst du: Nach dem Aufwärmen bleiben 96 − 15 = 81 Minuten. Diese Zeit wird in 3 gleiche Teile geteilt: 81 : 3 = 27 Minuten. Die Spiele sind 1 Teil, also 27 Minuten. Die 8 Kinder brauchst du nicht.","sprachtext":null,"symbol":"⛷️"},{"id":"L-11","gruppe":"L","block":"Lb","blockNr":2,"nr":11,"rechenarten":["*","+","-"],"schwierigkeit":1,"thema":"Zeit","geschichte":"Elif trainiert für das Schwimmabzeichen. 3-mal in der Woche übt sie je 25 Minuten Kraul. Am Freitag übt sie zusätzlich 15 Minuten Rückenschwimmen. Am Mittwoch hört sie aber 10 Minuten früher auf. Mama Ayten schaut von der Tribüne zu. Das Bad hat 6 Bahnen.","frage":"Wie viele Minuten trainiert Elif in dieser Woche insgesamt?","antwort":80,"rechenweg":"3 * 25 + 15 - 10","hinweis":"Rechne zuerst die 3 Kraul-Trainings zusammen und das Rückenschwimmen dazu. Zieh dann die Minuten ab, die am Mittwoch ausfallen.","erklaerung":"So denkst du: Kraul wären 3 · 25 = 75 Minuten. Mit dem Rückenschwimmen sind es 75 + 15 = 90 Minuten. Am Mittwoch fallen 10 Minuten weg: 90 − 10 = 80 Minuten. Die 6 Bahnen musst du nicht mitrechnen.","sprachtext":null,"symbol":"🏊"},{"id":"L-12","gruppe":"L","block":"Lb","blockNr":2,"nr":12,"rechenarten":["-"],"schwierigkeit":2,"thema":"Länge","geschichte":"Ayup baut einen Zaun für seine Modelleisenbahn. Seine Holzleiste ist 96 cm lang. Er sägt zuerst ein Stück mit 28 cm ab, dann eines mit 39 cm. Zum Schluss sägt er noch 9 cm für ein kleines Tor ab. Die Eisenbahn hat 5 Waggons.","frage":"Wie viele Zentimeter von der Leiste bleiben übrig?","antwort":20,"rechenweg":"96 - 28 - 39 - 9","hinweis":"Zieh die 3 abgesägten Stücke nacheinander von der Leiste ab. Die Waggons brauchst du nicht.","erklaerung":"So denkst du: Nach dem ersten Schnitt bleiben 96 − 28 = 68 cm. Nach dem zweiten bleiben 68 − 39 = 29 cm. Nach dem Tor bleiben 29 − 9 = 20 cm. Die 5 Waggons zählen nicht.","sprachtext":null,"symbol":"🚂"},{"id":"L-13","gruppe":"L","block":"Lb","blockNr":2,"nr":13,"rechenarten":["*","+"],"schwierigkeit":3,"thema":"Gewicht","geschichte":"Asel packt mit ihrem Papa ein Paket für die Oma. Hinein kommen 3 Packungen Mehl mit je 5 kg und ein Kübel Honig mit 7 kg. Der leere Karton wiegt 2 kg. Die Post ist 4 Straßen weit weg.","frage":"Wie viele Kilogramm wiegt das fertige Paket?","antwort":24,"rechenweg":"3 * 5 + 7 + 2","hinweis":"Rechne zuerst das Mehl zusammen. Dann kommen Honig und Karton dazu. Eine Zahl gehört nicht zum Gewicht.","erklaerung":"So denkst du: Das Mehl wiegt 3 · 5 = 15 kg. Mit dem Honig sind es 15 + 7 = 22 kg. Mit dem Karton wiegt das Paket 22 + 2 = 24 kg. Die 4 Straßen haben mit dem Gewicht nichts zu tun.","sprachtext":null,"symbol":"📦"},{"id":"L-14","gruppe":"L","block":"Lb","blockNr":2,"nr":14,"rechenarten":["+"],"schwierigkeit":4,"thema":"Zeit","geschichte":"Cesur fährt mit dem Zug nach Wien. Er steht schon 12 Minuten vor der geplanten Abfahrt am Bahnsteig. Der Zug kommt aber 17 Minuten zu spät. Die Fahrt selbst dauert dann 55 Minuten. In Wien braucht Cesur noch 8 Minuten bis zum Ausgang. Er wartet auf Bahnsteig 3.","frage":"Wie viele Minuten vergehen vom Ankommen am Bahnsteig bis zum Ausgang in Wien?","antwort":92,"rechenweg":"12 + 17 + 55 + 8","hinweis":"Cesur wartet zweimal: bis zur geplanten Abfahrt und dann noch die Verspätung. Dazu kommen Fahrzeit und der Weg zum Ausgang.","erklaerung":"So denkst du: Cesur wartet 12 Minuten und dann noch 17 Minuten Verspätung: 12 + 17 = 29 Minuten. Mit der Fahrt sind es 29 + 55 = 84 Minuten. Mit dem Weg zum Ausgang sind es 84 + 8 = 92 Minuten. Die 3 ist nur die Nummer vom Bahnsteig.","sprachtext":null,"symbol":"🚉"},{"id":"L-15","gruppe":"L","block":"Lb","blockNr":2,"nr":15,"rechenarten":["/","+","-"],"schwierigkeit":5,"thema":"Länge","geschichte":"Lia und Paul teilen sich eine Drachenschnur mit 84 m gerecht auf. Lia knüpft an ihr Stück noch 16 m an. Beim Steigenlassen reißen ihr aber 8 m ab. Ihr Drache hat 4 bunte Schleifen.","frage":"Wie viele Meter Schnur hat Lia jetzt?","antwort":50,"rechenweg":"84 / 2 + 16 - 8","hinweis":"Teile die Schnur zuerst gerecht durch 2. Dann kommt das angeknüpfte Stück dazu, und das abgerissene Stück kommt weg.","erklaerung":"So denkst du: Beim gerechten Teilen bekommt Lia 84 : 2 = 42 m. Mit dem angeknüpften Stück sind es 42 + 16 = 58 m. Nach dem Riss bleiben 58 − 8 = 50 m. Die 4 Schleifen zählen nicht.","sprachtext":null,"symbol":"🪁"},{"id":"L-16","gruppe":"L","block":"Lb","blockNr":2,"nr":16,"rechenarten":["/","*","+"],"schwierigkeit":6,"thema":"Gewicht","geschichte":"Beim Erntehelfen füllen die Kinder 72 kg Erdäpfel in 8 gleich schwere Säcke. Talha trägt 3 von den Säcken zum Anhänger. Dazu nimmt er noch ein Sackerl mit 5 kg Äpfeln mit. Mama Sultan winkt ihm vom Feldrand zu. Insgesamt helfen 12 Kinder.","frage":"Wie viele Kilogramm trägt Talha zum Anhänger?","antwort":32,"rechenweg":"72 / 8 * 3 + 5","hinweis":"Rechne zuerst aus, wie schwer 1 Sack ist. Dann nimm 3 Säcke und das Apfelsackerl dazu.","erklaerung":"So denkst du: Ein Sack wiegt 72 : 8 = 9 kg. Talha trägt 3 Säcke, das sind 3 · 9 = 27 kg. Mit dem Apfelsackerl sind es 27 + 5 = 32 kg. Die 12 Kinder brauchst du nicht.","sprachtext":null,"symbol":"🥔"},{"id":"L-17","gruppe":"L","block":"Lb","blockNr":2,"nr":17,"rechenarten":["*","+"],"schwierigkeit":7,"thema":"Zeit","geschichte":"Elyas ist beim Skikurs. Für eine Runde braucht er mit dem Lift 8 Minuten hinauf und für die Abfahrt 4 Minuten hinunter. Heute fährt er 6 solche Runden. Zum Schluss geht er noch 5 Minuten zu Fuß zur Hütte, wo Mama Carola wartet. Seine Gruppe hat 9 Kinder.","frage":"Wie viele Minuten braucht Elyas für die 6 Runden und den Weg zur Hütte zusammen?","antwort":77,"rechenweg":"6 * (8 + 4) + 5","hinweis":"Rechne zuerst aus, wie lang 1 Runde dauert: hinauf und hinunter zusammen. Nimm dann die Runden mal und vergiss den Weg zur Hütte nicht.","erklaerung":"So denkst du: Eine Runde dauert 8 + 4 = 12 Minuten. 6 Runden dauern 6 · 12 = 72 Minuten. Mit dem Weg zur Hütte sind es 72 + 5 = 77 Minuten. Die 9 Kinder in der Gruppe zählen nicht.","sprachtext":null,"symbol":"🎿"},{"id":"L-18","gruppe":"L","block":"Lb","blockNr":2,"nr":18,"rechenarten":["-","/","*"],"schwierigkeit":8,"thema":"Länge","geschichte":"Die Stafetten-Strecke am Sportplatz ist 80 m lang. Sie ist in 4 gleich lange Abschnitte geteilt. Ceylin hat schon 2 Abschnitte geschafft. 6 Mannschaften laufen mit.","frage":"Wie viele Meter fehlen Ceylin noch bis zum Ende der Strecke?","antwort":40,"rechenweg":"80 - 80 / 4 * 2","hinweis":"Rechne zuerst aus, wie lang 1 Abschnitt ist. Dann weißt du, wie viele Meter Ceylin schon geschafft hat.","erklaerung":"So denkst du: Ein Abschnitt ist 80 : 4 = 20 m lang. 2 Abschnitte sind 2 · 20 = 40 m, so viel ist Ceylin schon gelaufen. Es fehlen noch 80 − 40 = 40 m. Die 6 Mannschaften zählen nicht.","sprachtext":null,"symbol":"🏃"},{"id":"L-19","gruppe":"L","block":"Lb","blockNr":2,"nr":19,"rechenarten":["*","+"],"schwierigkeit":9,"thema":"Gewicht","geschichte":"Lukas packt für den Radausflug. Er hat 2 Radtaschen. Jede leere Tasche wiegt 2 kg, und in jede packt er 9 kg Gepäck. Dazu trägt er noch einen Rucksack mit 6 kg. Der Ausflug führt durch 3 Dörfer.","frage":"Wie viele Kilogramm Gepäck nimmt Lukas insgesamt mit?","antwort":28,"rechenweg":"2 * (2 + 9) + 6","hinweis":"Rechne zuerst aus, wie schwer 1 volle Tasche ist. Dann nimm beide Taschen und den Rucksack zusammen.","erklaerung":"So denkst du: Eine volle Tasche wiegt 2 + 9 = 11 kg. Beide Taschen wiegen 2 · 11 = 22 kg. Mit dem Rucksack sind es 22 + 6 = 28 kg. Die 3 Dörfer musst du nicht mitrechnen.","sprachtext":null,"symbol":"🎒"},{"id":"L-20","gruppe":"L","block":"Lb","blockNr":2,"nr":20,"rechenarten":["-"],"schwierigkeit":10,"thema":"Zeit","geschichte":"Ayda übt für das Schwimmabzeichen. Ihr Training dauert 84 Minuten und hat 4 Teile: zuerst 26 Minuten Kraul, dann 17 Minuten Rückenschwimmen, dann eine Pause mit 13 Minuten und zum Schluss Tauchen. Mama Cangül wartet mit dem Handtuch. Ayda ist 9 Jahre alt.","frage":"Wie viele Minuten bleiben für das Tauchen?","antwort":28,"rechenweg":"84 - 26 - 17 - 13","hinweis":"Zieh vom ganzen Training die ersten 3 Teile nacheinander ab. Was übrig bleibt, ist die Tauchzeit.","erklaerung":"So denkst du: Nach dem Kraul bleiben 84 − 26 = 58 Minuten. Nach dem Rückenschwimmen bleiben 58 − 17 = 41 Minuten. Nach der Pause bleiben 41 − 13 = 28 Minuten für das Tauchen. Das Alter von Ayda zählt nicht.","sprachtext":null,"symbol":"🏊"},{"id":"L-21","gruppe":"L","block":"Lc","blockNr":3,"nr":21,"rechenarten":["+","/"],"schwierigkeit":1,"thema":"Länge","geschichte":"Asel baut ein Modell-Segelboot. Für den Rumpf braucht sie eine Leiste mit 34 cm. Der Mast ist halb so lang wie der Rumpf. Für die Fahnenstange braucht sie noch 6 cm. Das Segel hat 3 Ecken.","frage":"Wie viele Zentimeter Leiste braucht Asel insgesamt für Rumpf, Mast und Fahnenstange?","antwort":57,"rechenweg":"34 + 34 / 2 + 6","hinweis":"Halb so lang heißt: durch 2 teilen. Rechne dann Rumpf, Mast und Fahnenstange zusammen.","erklaerung":"So denkst du: Der Mast ist halb so lang wie 34 cm, also 34 : 2 = 17 cm. Rumpf und Mast brauchen 34 + 17 = 51 cm. Mit der Fahnenstange sind es 51 + 6 = 57 cm. Die 3 Ecken vom Segel zählen nicht.","sprachtext":null,"symbol":"⛵"},{"id":"L-22","gruppe":"L","block":"Lc","blockNr":3,"nr":22,"rechenarten":["-","+"],"schwierigkeit":2,"thema":"Zeit","geschichte":"Aras macht einen Radausflug zum Badesee. Hin braucht er 38 Minuten. Zurück geht es bergab, da ist er 6 Minuten schneller als hin. Am See bleibt er 25 Minuten. Sein Rad hat 21 Gänge.","frage":"Wie viele Minuten dauert der ganze Ausflug?","antwort":95,"rechenweg":"38 - 6 + 38 + 25","hinweis":"Rechne zuerst aus, wie lang der Rückweg dauert: 6 Minuten weniger als der Hinweg. Dann zähle Rückweg, Hinweg und die Zeit am See zusammen.","erklaerung":"So denkst du: Zurück braucht Aras 38 − 6 = 32 Minuten. Rückweg und Hinweg zusammen sind 32 + 38 = 70 Minuten. Mit der Zeit am See sind es 70 + 25 = 95 Minuten. Die 21 Gänge zählen nicht.","sprachtext":null,"symbol":"🚲"},{"id":"L-23","gruppe":"L","block":"Lc","blockNr":3,"nr":23,"rechenarten":["+","-"],"schwierigkeit":3,"thema":"Gewicht","geschichte":"Aslan hilft mit Mama Rabia beim Apfelernten. Am Vormittag ernten sie 47 kg, am Nachmittag 38 kg. 29 kg geben sie dem Bauern ab. 8 kg sind angefault und kommen weg. 10 Kisten stehen am Feldrand bereit.","frage":"Wie viele Kilogramm Äpfel dürfen die beiden behalten?","antwort":48,"rechenweg":"47 + 38 - 29 - 8","hinweis":"Rechne zuerst die ganze Ernte zusammen. Zieh dann den Anteil vom Bauern ab und danach die angefaulten Äpfel.","erklaerung":"So denkst du: Zusammen ernten sie 47 + 38 = 85 kg. Ohne den Anteil vom Bauern bleiben 85 − 29 = 56 kg. Ohne die angefaulten Äpfel bleiben 56 − 8 = 48 kg. Die 10 Kisten zählen nicht.","sprachtext":null,"symbol":"🍎"},{"id":"L-24","gruppe":"L","block":"Lc","blockNr":3,"nr":24,"rechenarten":["-","*","/"],"schwierigkeit":4,"thema":"Zeit","geschichte":"Das große Schwimmtraining von Elif dauert 96 Minuten. Es hat 4 gleich lange Übungsteile. Zwischen den Teilen gibt es 3 kurze Pausen mit je 4 Minuten. Mama Ayten holt Elif danach ab. 15 Kinder trainieren mit.","frage":"Wie viele Minuten dauert ein Übungsteil?","antwort":21,"rechenweg":"(96 - 3 * 4) / 4","hinweis":"Rechne zuerst aus, wie lang alle Pausen zusammen sind. Zieh sie vom Training ab und teile den Rest durch die Anzahl der Übungsteile.","erklaerung":"So denkst du: Die Pausen dauern zusammen 3 · 4 = 12 Minuten. Für die Übungen bleiben 96 − 12 = 84 Minuten. Ein Übungsteil dauert 84 : 4 = 21 Minuten. Die 15 Kinder brauchst du nicht.","sprachtext":null,"symbol":"🏊"},{"id":"L-25","gruppe":"L","block":"Lc","blockNr":3,"nr":25,"rechenarten":["-","+"],"schwierigkeit":5,"thema":"Länge","geschichte":"Aslan lässt am Hügel seinen Drachen steigen. Auf der Rolle sind 95 m Schnur. Er lässt zuerst 48 m aus, dann noch 29 m. Als der Wind stärker wird, wickelt er 16 m wieder auf. Sein Drache hat 2 lange Schwänze.","frage":"Wie viele Meter Schnur sind jetzt auf der Rolle?","antwort":34,"rechenweg":"95 - 48 - 29 + 16","hinweis":"Zieh die ausgelassenen Meter zweimal von der Rolle ab. Was Aslan aufwickelt, kommt wieder dazu.","erklaerung":"So denkst du: Nach dem ersten Auslassen sind 95 − 48 = 47 m auf der Rolle. Nach dem zweiten bleiben 47 − 29 = 18 m. Durch das Aufwickeln kommen 16 m zurück: 18 + 16 = 34 m. Die 2 Schwänze zählen nicht.","sprachtext":null,"symbol":"🪁"},{"id":"L-26","gruppe":"L","block":"Lc","blockNr":3,"nr":26,"rechenarten":["*","+","-"],"schwierigkeit":6,"thema":"Gewicht","geschichte":"Cesur hilft im Lager seines Onkels beim Wiegen. Er stellt 4 Kisten mit je 6 kg auf die Waage und dazu einen Sack mit 19 kg. Dann bemerkt er 3 kg Werkzeug, das noch in einer Kiste liegt, und nimmt es herunter. Das Lager hat 7 Regale.","frage":"Wie viele Kilogramm zeigt die Waage jetzt an?","antwort":40,"rechenweg":"4 * 6 + 19 - 3","hinweis":"Rechne zuerst die 4 Kisten zusammen, dann den Sack dazu. Das Werkzeug kommt am Schluss weg.","erklaerung":"So denkst du: Die Kisten wiegen 4 · 6 = 24 kg. Mit dem Sack sind es 24 + 19 = 43 kg. Ohne das Werkzeug zeigt die Waage 43 − 3 = 40 kg. Die 7 Regale zählen nicht.","sprachtext":null,"symbol":"⚖️"},{"id":"L-27","gruppe":"L","block":"Lc","blockNr":3,"nr":27,"rechenarten":["*","-"],"schwierigkeit":7,"thema":"Länge","geschichte":"Im Schwimmbad ist eine Bahn 25 m lang. Beim Training schwimmt Talha 4 Bahnen ohne Pause. Lia schafft 2 Bahnen. Mama Sultan schaut vom Beckenrand zu. 8 Kinder sind im Wasser.","frage":"Wie viele Meter schwimmt Talha weiter als Lia?","antwort":50,"rechenweg":"4 * 25 - 2 * 25","hinweis":"Rechne für beide Kinder aus, wie viele Meter sie schwimmen. Dann bilde den Unterschied.","erklaerung":"So denkst du: Talha schwimmt 4 · 25 = 100 m. Lia schwimmt 2 · 25 = 50 m. Der Unterschied ist 100 − 50 = 50 m. Die 8 Kinder im Wasser zählen nicht.","sprachtext":null,"symbol":"🏊"},{"id":"L-28","gruppe":"L","block":"Lc","blockNr":3,"nr":28,"rechenarten":["/","*","-"],"schwierigkeit":8,"thema":"Gewicht","geschichte":"Der Bauer füllt 96 kg Äpfel in 8 gleich schwere Kisten. Ayup lädt 5 Kisten auf den Anhänger. Eine Kiste ist zu voll, darum nimmt er 14 kg wieder herunter. 4 Helfer arbeiten am Feld.","frage":"Wie viele Kilogramm Äpfel liegen jetzt auf dem Anhänger?","antwort":46,"rechenweg":"96 / 8 *
