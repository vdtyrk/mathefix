mm die abgebrochenen Stifte weg.","erklaerung":"So denkst du: Gefragt ist, wie viele Stifte Lukas verwenden kann. Zuerst zählst du alle Stifte zusammen: 6 + 6 = 12. Dann legst du die 2 abgebrochenen weg: 12 - 2 = 10. Lukas kann 10 Buntstifte verwenden.","sprachtext":null,"symbol":"✏️"},{"id":"A-03","gruppe":"A","block":"Aa","blockNr":1,"nr":3,"rechenarten":["+","-"],"schwierigkeit":3,"thema":"Alltag","geschichte":"Ayda hat 14 Sticker. Sie klebt 6 Sticker in ihr Heft. Danach schenkt ihr ihre Mama Cangül 3 neue Sticker.","frage":"Wie viele Sticker hat Ayda jetzt übrig?","antwort":11,"rechenweg":"14 - 6 + 3","hinweis":"Zieh zuerst die geklebten Sticker ab. Dann kommen die neuen Sticker dazu.","erklaerung":"So denkst du: Gefragt ist, wie viele Sticker Ayda übrig hat. Sie klebt 6 Sticker ins Heft: 14 - 6 = 8. Dann bekommt sie 3 neue dazu: 8 + 3 = 11. Ayda hat jetzt 11 Sticker übrig.","sprachtext":null,"symbol":"🌟"},{"id":"A-04","gruppe":"A","block":"Aa","blockNr":1,"nr":4,"rechenarten":["-"],"schwierigkeit":4,"thema":"Zuhause","geschichte":"Talha hat 18 Kekse gebacken. Er gibt 5 Kekse seiner Mama Sultan. Dann gibt er 4 Kekse seinem Freund Amar.","frage":"Wie viele Kekse bleiben Talha übrig?","antwort":9,"rechenweg":"18 - 5 - 4","hinweis":"Talha gibt zweimal Kekse her. Zieh beide Male ab, einen Schritt nach dem anderen.","erklaerung":"So denkst du: Gefragt ist, wie viele Kekse Talha behält. Zuerst gibt er seiner Mama 5 Kekse: 18 - 5 = 13. Dann gibt er Amar 4 Kekse: 13 - 4 = 9. Talha bleiben 9 Kekse übrig.","sprachtext":null,"symbol":"🍪"},{"id":"A-05","gruppe":"A","block":"Aa","blockNr":1,"nr":5,"rechenarten":["+","-"],"schwierigkeit":5,"thema":"Spielplatz","geschichte":"Asel hat 9 Murmeln. Beim Spielen am Spielplatz gewinnt sie 8 Murmeln dazu. Danach verliert sie 6 Murmeln an Cesur.","frage":"Wie viele Murmeln hat Asel am Ende?","antwort":11,"rechenweg":"9 + 8 - 6","hinweis":"Rechne zuerst aus, wie viele Murmeln Asel nach dem Gewinnen hat. Zieh dann die verlorenen Murmeln ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Murmeln Asel am Ende hat. Zuerst gewinnt sie dazu: 9 + 8 = 17. Dann verliert sie 6 Murmeln: 17 - 6 = 11. Asel hat am Ende 11 Murmeln.","sprachtext":null,"symbol":"🔵"},{"id":"A-06","gruppe":"A","block":"Aa","blockNr":1,"nr":6,"rechenarten":["-"],"schwierigkeit":6,"thema":"Zuhause","geschichte":"Amar hat für sein Fest 19 Luftballons aufgeblasen. Am Vormittag platzen 6 Luftballons. Am Nachmittag platzen noch einmal 6 Luftballons.","frage":"Wie viele Luftballons sind noch heil?","antwort":7,"rechenweg":"19 - 6 - 6","hinweis":"Die Luftballons platzen zweimal. Zieh zuerst die vom Vormittag ab, dann die vom Nachmittag.","erklaerung":"So denkst du: Gefragt ist, wie viele Luftballons heil bleiben. Am Vormittag platzen 6: 19 - 6 = 13. Am Nachmittag platzen noch 6: 13 - 6 = 7. Es sind noch 7 Luftballons heil.","sprachtext":null,"symbol":"🎈"},{"id":"A-07","gruppe":"A","block":"Aa","blockNr":1,"nr":7,"rechenarten":["+","-"],"schwierigkeit":7,"thema":"Schule","geschichte":"Lia hat 7 Sammelkarten. In der Pause bekommt sie von Ayup 8 Karten dazu. Zu Hause verschenkt sie 9 Karten an ihre Schwester.","frage":"Wie viele Karten hat Lia dann noch?","antwort":6,"rechenweg":"7 + 8 - 9","hinweis":"Zähle zuerst zusammen, wie viele Karten Lia nach der Pause hat. Dann zieh die verschenkten Karten ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Karten Lia am Schluss hat. Nach der Pause hat sie 7 + 8 = 15 Karten. Dann verschenkt sie 9 Karten: 15 - 9 = 6. Lia hat noch 6 Karten.","sprachtext":null,"symbol":"🃏"},{"id":"A-08","gruppe":"A","block":"Aa","blockNr":1,"nr":8,"rechenarten":["+","-"],"schwierigkeit":8,"thema":"Zuhause","geschichte":"Ceylin fädelt eine Kette. Sie hat 15 Perlen vorbereitet. 3 Perlen fallen auf den Boden und rollen unter den Kasten. Ihre Freundin Elif gibt ihr 8 neue Perlen.","frage":"Wie viele Perlen hat Ceylin jetzt für ihre Kette?","antwort":20,"rechenweg":"15 - 3 + 8","hinweis":"Zieh zuerst die verlorenen Perlen ab. Dann kommen die neuen Perlen von Elif dazu.","erklaerung":"So denkst du: Gefragt ist, wie viele Perlen Ceylin jetzt hat. Zuerst verliert sie 3 Perlen: 15 - 3 = 12. Dann bekommt sie 8 neue: 12 + 8 = 20. Ceylin hat jetzt 20 Perlen für ihre Kette.","sprachtext":null,"symbol":"📿"},{"id":"A-09","gruppe":"A","block":"Aa","blockNr":1,"nr":9,"rechenarten":["+","-"],"schwierigkeit":9,"thema":"Zuhause","geschichte":"Paul baut einen Turm aus 12 Bausteinen. Er setzt noch 7 Bausteine oben drauf. Weil der Turm wackelt, nimmt er 9 Bausteine wieder herunter.","frage":"Aus wie vielen Bausteinen besteht der Turm jetzt?","antwort":10,"rechenweg":"12 + 7 - 9","hinweis":"Rechne zuerst aus, wie hoch der Turm mit allen Steinen ist. Zieh dann die heruntergenommenen Steine ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Bausteine der Turm am Ende hat. Zuerst setzt Paul Steine drauf: 12 + 7 = 19. Dann nimmt er 9 Steine herunter: 19 - 9 = 10. Der Turm besteht jetzt aus 10 Bausteinen.","sprachtext":null,"symbol":"🧱"},{"id":"A-10","gruppe":"A","block":"Aa","blockNr":1,"nr":10,"rechenarten":["+","-"],"schwierigkeit":10,"thema":"Fußball","geschichte":"Aslan hat 16 Fußballbilder gesammelt. Nach dem Training verschenkt er 9 Bilder an Aras, weil er sie doppelt hat. Am Abend kauft ihm seine Mama Rabia 6 neue Bilder.","frage":"Wie viele Fußballbilder hat Aslan jetzt?","antwort":13,"rechenweg":"16 - 9 + 6","hinweis":"Zieh zuerst die verschenkten Bilder ab. Dann kommen die neuen Bilder von Mama Rabia dazu.","erklaerung":"So denkst du: Gefragt ist, wie viele Bilder Aslan am Ende hat. Zuerst verschenkt er 9 Bilder: 16 - 9 = 7. Dann bekommt er 6 neue dazu: 7 + 6 = 13. Aslan hat jetzt 13 Fußballbilder.","sprachtext":null,"symbol":"⚽"},{"id":"A-11","gruppe":"A","block":"Ab","blockNr":2,"nr":11,"rechenarten":["+","-"],"schwierigkeit":1,"thema":"Spielplatz","geschichte":"Ayup sammelt im Park Kastanien. Am Montag findet er 20 Kastanien. Am Dienstag findet er 15 Kastanien. Für ein Kastanien-Männchen braucht er 8 Kastanien.","frage":"Wie viele Kastanien bleiben Ayup übrig?","antwort":27,"rechenweg":"20 + 15 - 8","hinweis":"Zähle zuerst alle gefundenen Kastanien zusammen. Zieh dann die Kastanien für das Männchen ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Kastanien übrig bleiben. Ayup findet insgesamt 20 + 15 = 35 Kastanien. Für das Männchen braucht er 8 davon: 35 - 8 = 27. Es bleiben ihm 27 Kastanien übrig.","sprachtext":null,"symbol":"🌰"},{"id":"A-12","gruppe":"A","block":"Ab","blockNr":2,"nr":12,"rechenarten":["+","-"],"schwierigkeit":2,"thema":"Alltag","geschichte":"Cesur hat 24 Fußballkarten. Zum Geburtstag bekommt er 13 neue Karten. 5 Karten hat er jetzt doppelt, die verschenkt er an Paul.","frage":"Wie viele Karten hat Cesur jetzt?","antwort":32,"rechenweg":"24 + 13 - 5","hinweis":"Rechne zuerst aus, wie viele Karten Cesur nach dem Geburtstag hat. Zieh dann die verschenkten Karten ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Karten Cesur am Ende hat. Nach dem Geburtstag hat er 24 + 13 = 37 Karten. Dann verschenkt er 5 doppelte: 37 - 5 = 32. Cesur hat jetzt 32 Karten.","sprachtext":null,"symbol":"🎴"},{"id":"A-13","gruppe":"A","block":"Ab","blockNr":2,"nr":13,"rechenarten":["-"],"schwierigkeit":3,"thema":"Zuhause","geschichte":"Elif hilft ihrer Mama Ayten beim Geburtstagsfest. Auf dem Tisch liegen 45 Servietten. Beim Essen werden 12 Servietten gebraucht. Beim Kuchen werden noch 9 Servietten gebraucht.","frage":"Wie viele Servietten sind danach noch da?","antwort":24,"rechenweg":"45 - 12 - 9","hinweis":"Es werden zweimal Servietten gebraucht. Zieh beide Zahlen nacheinander ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Servietten übrig bleiben. Beim Essen werden 12 gebraucht: 45 - 12 = 33. Beim Kuchen noch 9: 33 - 9 = 24. Es sind noch 24 Servietten da.","sprachtext":null,"symbol":"🎉"},{"id":"A-14","gruppe":"A","block":"Ab","blockNr":2,"nr":14,"rechenarten":["+","-"],"schwierigkeit":4,"thema":"Schule","geschichte":"In der Klassenbücherei stehen 38 Bücher. Die Kinder aus Aras' Klasse borgen sich 19 Bücher aus. Dann stellt die Lehrerin 14 neue Bücher ins Regal.","frage":"Wie viele Bücher stehen jetzt im Regal?","antwort":33,"rechenweg":"38 - 19 + 14","hinweis":"Zieh zuerst die ausgeborgten Bücher ab. Dann kommen die neuen Bücher dazu.","erklaerung":"So denkst du: Gefragt ist, wie viele Bücher im Regal stehen. Zuerst werden 19 Bücher ausgeborgt: 38 - 19 = 19. Dann kommen 14 neue dazu: 19 + 14 = 33. Jetzt stehen 33 Bücher im Regal.","sprachtext":null,"symbol":"📚"},{"id":"A-15","gruppe":"A","block":"Ab","blockNr":2,"nr":15,"rechenarten":["+","-"],"schwierigkeit":5,"thema":"Alltag","geschichte":"Ayda pflückt mit ihrer Mama Cangül Kirschen im Garten. Ayda pflückt 26 Kirschen. Cangül pflückt 17 Kirschen. Auf der Bank essen die beiden zusammen 13 Kirschen.","frage":"Wie viele Kirschen bringen die beiden ins Haus?","antwort":30,"rechenweg":"26 + 17 - 13","hinweis":"Zähle zuerst die Kirschen von Ayda und Cangül zusammen. Zieh dann die gegessenen Kirschen ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Kirschen übrig bleiben. Zusammen pflücken sie 26 + 17 = 43 Kirschen. Dann essen sie 13 davon: 43 - 13 = 30. Sie bringen 30 Kirschen ins Haus.","sprachtext":null,"symbol":"🍒"},{"id":"A-16","gruppe":"A","block":"Ab","blockNr":2,"nr":16,"rechenarten":["-"],"schwierigkeit":6,"thema":"Zuhause","geschichte":"Lukas macht ein neues Puzzle mit 47 Teilen. Am Vormittag legt er 13 Teile. Am Nachmittag legt er noch 15 Teile.","frage":"Wie viele Teile fehlen ihm noch?","antwort":19,"rechenweg":"47 - 13 - 15","hinweis":"Zieh die gelegten Teile vom ganzen Puzzle ab, zuerst die vom Vormittag, dann die vom Nachmittag.","erklaerung":"So denkst du: Gefragt ist, wie viele Teile noch fehlen. Nach dem Vormittag fehlen 47 - 13 = 34 Teile. Nach dem Nachmittag fehlen 34 - 15 = 19 Teile. Lukas fehlen noch 19 Teile.","sprachtext":null,"symbol":"🧩"},{"id":"A-17","gruppe":"A","block":"Ab","blockNr":2,"nr":17,"rechenarten":["+","-"],"schwierigkeit":7,"thema":"Schule","geschichte":"Ceylin sammelt Blumen für das Schulfest. Auf der Wiese pflückt sie 23 Blumen. Ihr Bruder bringt ihr 18 Blumen dazu. Für einen Blumenkranz verbraucht sie 15 Blumen.","frage":"Wie viele Blumen bleiben für die Vasen übrig?","antwort":26,"rechenweg":"23 + 18 - 15","hinweis":"Rechne zuerst aus, wie viele Blumen Ceylin insgesamt hat. Zieh dann die Blumen für den Kranz ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Blumen übrig bleiben. Insgesamt hat Ceylin 23 + 18 = 41 Blumen. Für den Kranz verbraucht sie 15: 41 - 15 = 26. Für die Vasen bleiben 26 Blumen übrig.","sprachtext":null,"symbol":"🌼"},{"id":"A-18","gruppe":"A","block":"Ab","blockNr":2,"nr":18,"rechenarten":["-"],"schwierigkeit":8,"thema":"Schule","geschichte":"Talhas Mama Sultan hat 45 Muffins für den Kuchenstand der Schule gebacken. In der ersten Pause werden 17 Muffins verkauft. In der zweiten Pause werden 12 Muffins verkauft.","frage":"Wie viele Muffins sind jetzt noch am Stand?","antwort":16,"rechenweg":"45 - 17 - 12","hinweis":"Es wird zweimal verkauft. Zieh zuerst die Muffins aus der ersten Pause ab, dann die aus der zweiten.","erklaerung":"So denkst du: Gefragt ist, wie viele Muffins übrig sind. Nach der ersten Pause sind es 45 - 17 = 28 Muffins. Nach der zweiten Pause sind es 28 - 12 = 16 Muffins. Am Stand sind noch 16 Muffins.","sprachtext":null,"symbol":"🧁"},{"id":"A-19","gruppe":"A","block":"Ab","blockNr":2,"nr":19,"rechenarten":["+","-"],"schwierigkeit":9,"thema":"Alltag","geschichte":"Asel fährt mit dem Bus zur Schule und zählt gerne die Fahrgäste. Am Anfang sitzen 35 Fahrgäste im Bus. Bei der großen Haltestelle steigen 14 Fahrgäste ein. Bei der Schule steigen 26 Fahrgäste aus.","frage":"Wie viele Fahrgäste sind jetzt noch im Bus?","antwort":23,"rechenweg":"35 + 14 - 26","hinweis":"Beim Einsteigen werden es mehr Fahrgäste, beim Aussteigen weniger. Rechne Schritt für Schritt.","erklaerung":"So denkst du: Gefragt ist, wie viele Fahrgäste im Bus bleiben. Nach dem Einsteigen sind es 35 + 14 = 49 Fahrgäste. Dann steigen 26 aus: 49 - 26 = 23. Es sind noch 23 Fahrgäste im Bus.","sprachtext":null,"symbol":"🚌"},{"id":"A-20","gruppe":"A","block":"Ab","blockNr":2,"nr":20,"rechenarten":["+","-"],"schwierigkeit":10,"thema":"Alltag","geschichte":"Amar hat 42 Sammelbilder von wilden Tieren in seiner Mappe. Seiner Cousine schenkt er 25 Bilder, weil sie neu mit dem Sammeln beginnt. Zum Namenstag bekommt Amar dann ein Packerl mit 18 neuen Bildern.","frage":"Wie viele Sammelbilder hat Amar jetzt in seiner Mappe?","antwort":35,"rechenweg":"42 - 25 + 18","hinweis":"Zieh zuerst die verschenkten Bilder ab. Dann kommen die neuen Bilder aus dem Packerl dazu.","erklaerung":"So denkst du: Gefragt ist, wie viele Bilder Amar am Ende hat. Zuerst verschenkt er 25 Bilder: 42 - 25 = 17. Dann bekommt er 18 neue dazu: 17 + 18 = 35. Amar hat jetzt 35 Sammelbilder.","sprachtext":null,"symbol":"🦁"},{"id":"A-21","gruppe":"A","block":"Ac","blockNr":3,"nr":21,"rechenarten":["+","-"],"schwierigkeit":1,"thema":"Schule","geschichte":"Lia ist beim Schulfest im Schulhof. Am Anfang sind 34 Kinder im Hof. Dann kommen 28 Kinder dazu. Weil es kühl wird, gehen 11 Kinder nach Hause.","frage":"Wie viele Kinder sind jetzt noch im Hof?","antwort":51,"rechenweg":"34 + 28 - 11","hinweis":"Rechne zuerst aus, wie viele Kinder insgesamt im Hof waren. Zieh dann die Kinder ab, die heimgehen.","erklaerung":"So denkst du: Gefragt ist, wie viele Kinder im Hof bleiben. Zuerst kommen Kinder dazu: 34 + 28 = 62. Dann gehen 11 Kinder heim: 62 - 11 = 51. Es sind noch 51 Kinder im Hof.","sprachtext":null,"symbol":"🎪"},{"id":"A-22","gruppe":"A","block":"Ac","blockNr":3,"nr":22,"rechenarten":["+","-"],"schwierigkeit":2,"thema":"Zuhause","geschichte":"Paul stellt Dominosteine in einer langen Reihe auf. Zuerst stellt er 55 Steine auf. Dann stellt er noch 23 Steine dazu. Beim Aufstellen fallen 14 Steine um, die legt er zurück in die Schachtel.","frage":"Wie viele Steine stehen jetzt in der Reihe?","antwort":64,"rechenweg":"55 + 23 - 14","hinweis":"Zähle zuerst alle aufgestellten Steine zusammen. Zieh dann die umgefallenen Steine ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Steine in der Reihe stehen. Paul stellt 55 + 23 = 78 Steine auf. Davon fallen 14 um: 78 - 14 = 64. In der Reihe stehen jetzt 64 Steine.","sprachtext":null,"symbol":"🎲"},{"id":"A-23","gruppe":"A","block":"Ac","blockNr":3,"nr":23,"rechenarten":["-"],"schwierigkeit":3,"thema":"Alltag","geschichte":"Elyas schaut mit seiner Mama Carola die Fotos vom Ausflug an. Auf dem Handy sind 81 Fotos. Carola löscht 26 verwackelte Fotos. Danach löscht sie noch 15 doppelte Fotos.","frage":"Wie viele Fotos sind jetzt noch auf dem Handy?","antwort":40,"rechenweg":"81 - 26 - 15","hinweis":"Carola löscht zweimal Fotos. Zieh beide Zahlen nacheinander ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Fotos übrig bleiben. Zuerst werden 26 Fotos gelöscht: 81 - 26 = 55. Dann noch 15 Fotos: 55 - 15 = 40. Auf dem Handy sind noch 40 Fotos.","sprachtext":null,"symbol":"📷"},{"id":"A-24","gruppe":"A","block":"Ac","blockNr":3,"nr":24,"rechenarten":["+","-"],"schwierigkeit":4,"thema":"Schule","geschichte":"Aslan sammelt Flaschendeckel für ein Klassenprojekt. Er hat schon 46 Deckel in einer Schachtel. Seine Freunde bringen ihm 37 Deckel mit. Für ein großes Plakat klebt die Klasse 29 Deckel auf.","frage":"Wie viele Deckel sind noch in Aslans Schachtel?","antwort":54,"rechenweg":"46 + 37 - 29","hinweis":"Rechne zuerst aus, wie viele Deckel insgesamt in der Schachtel sind. Zieh dann die aufgeklebten Deckel ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Deckel in der Schachtel bleiben. Insgesamt sind es 46 + 37 = 83 Deckel. Davon werden 29 aufgeklebt: 83 - 29 = 54. In der Schachtel sind noch 54 Deckel.","sprachtext":null,"symbol":"♻️"},{"id":"A-25","gruppe":"A","block":"Ac","blockNr":3,"nr":25,"rechenarten":["-"],"schwierigkeit":5,"thema":"Schule","geschichte":"Die Lehrerin hat 89 Zettel für die Schulübung kopiert. Ayup hilft beim Austeilen. Zuerst teilt er 34 Zettel in der Klasse 2a aus. Dann teilt er 18 Zettel in der Klasse 2b aus.","frage":"Wie viele Zettel bleiben übrig?","antwort":37,"rechenweg":"89 - 34 - 18","hinweis":"Ayup teilt zweimal Zettel aus. Zieh beide Zahlen vom Stapel ab, eine nach der anderen.","erklaerung":"So denkst du: Gefragt ist, wie viele Zettel übrig bleiben. Nach der 2a bleiben 89 - 34 = 55 Zettel. Nach der 2b bleiben 55 - 18 = 37 Zettel. Es bleiben 37 Zettel übrig.","sprachtext":null,"symbol":"📄"},{"id":"A-26","gruppe":"A","block":"Ac","blockNr":3,"nr":26,"rechenarten":["+","-"],"schwierigkeit":6,"thema":"Alltag","geschichte":"Cesur hilft am Bauernhof von seinem Onkel. Im großen Korb liegen schon 63 Äpfel. Cesur pflückt 19 Äpfel dazu. Dann werden 42 Äpfel für frischen Apfelsaft gepresst.","frage":"Wie viele Äpfel liegen jetzt noch im Korb?","antwort":40,"rechenweg":"63 + 19 - 42","hinweis":"Rechne zuerst aus, wie viele Äpfel im Korb sind, wenn Cesur fertig gepflückt hat. Zieh dann die gepressten Äpfel ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Äpfel im Korb bleiben. Nach dem Pflücken sind es 63 + 19 = 82 Äpfel. Davon werden 42 gepresst: 82 - 42 = 40. Im Korb liegen noch 40 Äpfel.","sprachtext":null,"symbol":"🍏"},{"id":"A-27","gruppe":"A","block":"Ac","blockNr":3,"nr":27,"rechenarten":["+","-"],"schwierigkeit":7,"thema":"Alltag","geschichte":"Aras ist am Nachmittag im Schwimmbad. Zuerst sind 74 Leute im Bad. Als eine Wolke kommt, gehen 36 Leute nach Hause. Später scheint wieder die Sonne, und 25 Leute kommen neu dazu.","frage":"Wie viele Leute sind jetzt im Schwimmbad?","antwort":63,"rechenweg":"74 - 36 + 25","hinweis":"Zieh zuerst die Leute ab, die gehen. Dann zähle die neuen Leute dazu.","erklaerung":"So denkst du: Gefragt ist, wie viele Leute im Bad sind. Zuerst gehen 36 Leute: 74 - 36 = 38. Dann kommen 25 neue dazu: 38 + 25 = 63. Im Schwimmbad sind jetzt 63 Leute.","sprachtext":null,"symbol":"🏊"},{"id":"A-28","gruppe":"A","block":"Ac","blockNr":3,"nr":28,"rechenarten":["+","-"],"schwierigkeit":8,"thema":"Alltag","geschichte":"Ayda wartet mit ihrer Mama Cangül vor dem Supermarkt und schaut auf den großen Parkplatz. Dort stehen 58 Autos. Während sie warten, kommen 34 Autos dazu. Danach fahren 42 Autos wieder weg.","frage":"Wie viele Autos stehen jetzt auf dem Parkplatz?","antwort":50,"rechenweg":"58 + 34 - 42","hinweis":"Erst kommen Autos dazu, dann fahren welche weg. Rechne die beiden Schritte nacheinander.","erklaerung":"So denkst du: Gefragt ist, wie viele Autos am Ende auf dem Parkplatz stehen. Zuerst kommen Autos dazu: 58 + 34 = 92. Dann fahren 42 Autos weg: 92 - 42 = 50. Auf dem Parkplatz stehen jetzt 50 Autos.","sprachtext":null,"symbol":"🚗"},{"id":"A-29","gruppe":"A","block":"Ac","blockNr":3,"nr":29,"rechenarten":["-"],"schwierigkeit":9,"thema":"Alltag","geschichte":"Talha fährt mit seiner Mama Sultan mit dem Zug nach Wien. Beim Start sitzen 99 Fahrgäste im Zug. Beim ersten Halt steigen 43 Fahrgäste aus. Beim zweiten Halt steigen noch 27 Fahrgäste aus. Es steigt niemand ein.","frage":"Wie viele Fahrgäste sitzen jetzt noch im Zug?","antwort":29,"rechenweg":"99 - 43 - 27","hinweis":"Bei jedem Halt werden es weniger Fahrgäste. Zieh die beiden Zahlen nacheinander ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Fahrgäste im Zug bleiben. Nach dem ersten Halt sind es 99 - 43 = 56 Fahrgäste. Nach dem zweiten Halt sind es 56 - 27 = 29 Fahrgäste. Im Zug sitzen noch 29 Fahrgäste.","sprachtext":null,"symbol":"🚆"},{"id":"A-30","gruppe":"A","block":"Ac","blockNr":3,"nr":30,"rechenarten":["-"],"schwierigkeit":10,"thema":"Schule","geschichte":"Aslan verkauft mit seiner Mama Rabia Waffeln beim Schulfest. Am Anfang haben die beiden 85 Waffeln auf ihrem Stand. Am Vormittag verkaufen sie 27 Waffeln. Am Nachmittag ist noch mehr los, da verkaufen sie 39 Waffeln.","frage":"Wie viele Waffeln bleiben am Ende übrig?","antwort":19,"rechenweg":"85 - 27 - 39","hinweis":"Es wird zweimal verkauft. Zieh zuerst die Waffeln vom Vormittag ab, dann die vom Nachmittag.","erklaerung":"So denkst du: Gefragt ist, wie viele Waffeln übrig bleiben. Nach dem Vormittag sind es 85 - 27 = 58 Waffeln. Nach dem Nachmittag sind es 58 - 39 = 19 Waffeln. Am Ende bleiben 19 Waffeln übrig.","sprachtext":null,"symbol":"🧇"},{"id":"B-01","gruppe":"B","block":"Ba","blockNr":1,"nr":1,"rechenarten":["*"],"schwierigkeit":1,"thema":"Schule","geschichte":"Ceylin räumt die Stifte in der Klasse auf. Sie legt 2 Reihen auf den Tisch. In jeder Reihe liegen 5 Stifte.","frage":"Wie viele Stifte liegen auf dem Tisch?","antwort":10,"rechenweg":"2 * 5","hinweis":"2 Reihen mit je 5 Stiften: Das ist 2 mal 5.","erklaerung":"So denkst du: Gefragt ist, wie viele Stifte auf dem Tisch liegen. Es gibt 2 Reihen, in jeder Reihe liegen 5 Stifte. Du rechnest 2 * 5 = 10. Auf dem Tisch liegen also 10 Stifte.","sprachtext":null,"symbol":"✏️"},{"id":"B-02","gruppe":"B","block":"Ba","blockNr":1,"nr":2,"rechenarten":["*"],"schwierigkeit":2,"thema":"Einkaufen","geschichte":"Lukas kauft beim Bäcker 3 Sackerl Semmeln. In jedem Sackerl sind 4 Semmeln.","frage":"Wie viele Semmeln hat Lukas gekauft?","antwort":12,"rechenweg":"3 * 4","hinweis":"3 Sackerl mit je 4 Semmeln: Rechne 3 mal 4.","erklaerung":"So denkst du: Gefragt ist die Zahl aller Semmeln. Lukas hat 3 Sackerl, in jedem Sackerl sind 4 Semmeln. Du rechnest 3 * 4 = 12. Lukas hat 12 Semmeln gekauft.","sprachtext":null,"symbol":"🥖"},{"id":"B-03","gruppe":"B","block":"Ba","blockNr":1,"nr":3,"rechenarten":["*"],"schwierigkeit":3,"thema":"Sport","geschichte":"Paul zählt in der Turnstunde mit. Der Lehrer bildet 4 Mannschaften. In jeder Mannschaft sind 10 Kinder.","frage":"Wie viele Kinder sind in allen Mannschaften zusammen?","antwort":40,"rechenweg":"4 * 10","hinweis":"4 Mannschaften mit je 10 Kindern: Rechne 4 mal 10.","erklaerung":"So denkst du: Gefragt ist, wie viele Kinder das insgesamt sind. Es gibt 4 Mannschaften, in jeder sind 10 Kind *","-"],"schwierigkeit":10,"thema":"Einkaufen","geschichte":"Elyas kauft mit Mama Carola Äpfel am Markt. Sie nehmen 4 Sackerl mit jeweils 9 Äpfeln. Zu Hause verbrauchen sie 12 Äpfel für einen Kuchen.","frage":"Wie viele Äpfel sind noch übrig?","antwort":24,"rechenweg":"4 * 9 - 12","hinweis":"Rechne zuerst aus, wie viele Äpfel in den Sackerln sind. Ziehe dann die Äpfel für den Kuchen ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Äpfel übrig bleiben. 4 Sackerl mit je 9 Äpfeln sind 4 * 9 = 36 Äpfel. Für den Kuchen brauchen sie 12 Äpfel. Du rechnest 36 - 12 = 24. Es sind noch 24 Äpfel übrig.","sprachtext":null,"symbol":"🍎"},{"id":"B-11","gruppe":"B","block":"Bb","blockNr":2,"nr":11,"rechenarten":["*","+"],"schwierigkeit":1,"thema":"Garten","geschichte":"Lia pflanzt Blumen im Garten. Sie setzt 5 Reihen mit jeweils 4 Tulpen. Daneben blühen schon 17 Narzissen.","frage":"Wie viele Blumen sind dann im Beet?","antwort":37,"rechenweg":"5 * 4 + 17","hinweis":"Rechne zuerst 5 mal 4 für die Tulpen. Zähle dann die Narzissen dazu.","erklaerung":"So denkst du: Gefragt ist die Zahl aller Blumen. 5 Reihen mit je 4 Tulpen sind 5 * 4 = 20 Tulpen. Dazu kommen 17 Narzissen. Du rechnest 20 + 17 = 37. Im Beet sind 37 Blumen.","sprachtext":null,"symbol":"🌷"},{"id":"B-12","gruppe":"B","block":"Bb","blockNr":2,"nr":12,"rechenarten":["*","+"],"schwierigkeit":2,"thema":"Zuhause","geschichte":"Cesur hilft beim Einräumen. Er trägt 3 Kisten mit jeweils 7 Flaschen in den Keller. Im Regal stehen schon 21 Flaschen.","frage":"Wie viele Flaschen sind dann im Keller?","antwort":42,"rechenweg":"3 * 7 + 21","hinweis":"Rechne zuerst aus, wie viele Flaschen in den Kisten sind. Zähle dann die Flaschen im Regal dazu.","erklaerung":"So denkst du: Gefragt ist die Zahl aller Flaschen im Keller. 3 Kisten mit je 7 Flaschen sind 3 * 7 = 21 Flaschen. Im Regal stehen schon 21 Flaschen. Du rechnest 21 + 21 = 42. Im Keller sind dann 42 Flaschen.","sprachtext":null,"symbol":"🧃"},{"id":"B-13","gruppe":"B","block":"Bb","blockNr":2,"nr":13,"rechenarten":["*","-"],"schwierigkeit":3,"thema":"Basteln","geschichte":"Ayup schneidet 10 Papierstreifen zurecht. Aus jedem Streifen faltet er 5 Sterne. Danach verschenkt er 23 Sterne an seine Klasse.","frage":"Wie viele Sterne behält Ayup?","antwort":27,"rechenweg":"10 * 5 - 23","hinweis":"Rechne zuerst 10 mal 5 für alle Sterne. Ziehe dann die verschenkten Sterne ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Sterne Ayup behält. Aus 10 Streifen macht er je 5 Sterne, das sind 10 * 5 = 50 Sterne. Er verschenkt 23 Sterne. Du rechnest 50 - 23 = 27. Ayup behält 27 Sterne.","sprachtext":null,"symbol":"🌟"},{"id":"B-14","gruppe":"B","block":"Bb","blockNr":2,"nr":14,"rechenarten":["*","+"],"schwierigkeit":4,"thema":"Sport","geschichte":"Aras räumt im Turnsaal die Ballkiste ein. Er legt 2 Netze mit jeweils 8 Bällen hinein. In der Kiste liegen schon 36 Bälle.","frage":"Wie viele Bälle sind dann in der Kiste?","antwort":52,"rechenweg":"2 * 8 + 36","hinweis":"Rechne zuerst aus, wie viele Bälle in den Netzen sind. Zähle dann die Bälle in der Kiste dazu.","erklaerung":"So denkst du: Gefragt ist die Zahl aller Bälle in der Kiste. 2 Netze mit je 8 Bällen sind 2 * 8 = 16 Bälle. In der Kiste liegen schon 36 Bälle. Du rechnest 16 + 36 = 52. In der Kiste sind dann 52 Bälle.","sprachtext":null,"symbol":"🏀"},{"id":"B-15","gruppe":"B","block":"Bb","blockNr":2,"nr":15,"rechenarten":["*","-"],"schwierigkeit":5,"thema":"Schule","geschichte":"Ceylin holt 4 Schachteln Kreiden aus dem Schrank. In jeder Schachtel sind 6 Kreiden. 13 Kreiden sind abgebrochen und kommen weg.","frage":"Wie viele Kreiden kann die Klasse noch verwenden?","antwort":11,"rechenweg":"4 * 6 - 13","hinweis":"Rechne zuerst 4 mal 6 für alle Kreiden. Ziehe dann die abgebrochenen Kreiden ab.","erklaerung":"So denkst du: Gefragt ist, wie viele Kreiden noch gut sind. 4 Schachteln mit je 6 Kreiden sind 4 * 6 = 24 Kreiden. 13 Kreiden kommen weg. Du rechnest 24 - 13 = 11. Die Klasse kann noch 11  72 − 32 = 40 Steine sind gelb.","sprachtext":null,"symbol":"🟦"},{"id":"D-19","gruppe":"D","block":"Db","blockNr":2,"nr":19,"rechenarten":["-","/"],"schwierigkeit":9,"thema":"Natur","geschichte":"Paul hilft bei der Ernte. Im großen Korb liegen 92 Nüsse. Beim Sortieren sind 29 Nüsse kaputt und kommen weg. Die guten Nüsse füllt Paul gleichmäßig in 9 Sackerl. Die Leiter hat 6 Sprossen.","frage":"Wie viele Nüsse kommen in jedes Sackerl?","antwort":7,"rechenweg":"(92 - 29) / 9","hinweis":"Welche Zahlen brauchst du wirklich? Die Sprossen der Leiter brauchst du nicht. Rechne zuerst aus, wie viele gute Nüsse übrig bleiben.","erklaerung":"So denkst du: Gefragt ist, wie viele Nüsse in jedes Sackerl kommen. Die 6 Sprossen brauchst du nicht. Zuerst ziehst du die kaputten Nüsse ab: 92 − 29 = 63 gute Nüsse. Dann teilst du auf 9 Sackerl auf: 63 geteilt durch 9 sind 7 Nüsse pro Sackerl.","sprachtext":null,"symbol":"🥜"},{"id":"D-20","gruppe":"D","block":"Db","blockNr":2,"nr":20,"rechenarten":["+","*"],"schwierigkeit":10,"thema":"Basteln","geschichte":"Aslan bastelt Girlanden für das Klassenzimmer. Für eine Girlande braucht er 17 rote und 19 gelbe Papierblätter. Er bastelt 2 gleich große Girlanden. Seine Mama Rabia bringt den Kindern 4 Becher Saft.","frage":"Wie viele Papierblätter braucht Aslan für beide Girlanden zusammen?","antwort":72,"rechenweg":"(17 + 19) * 2","hinweis":"Welche Zahlen brauchst du wirklich? Die Saftbecher brauchst du nicht. Rechne zuerst aus, wie viele Blätter eine Girlande braucht.","erklaerung":"So denkst du: Gefragt ist, wie viele Blätter Aslan für beide Girlanden braucht. Die 4 Becher Saft brauchst du nicht. Zuerst rechnest du eine Girlande aus: 17 + 19 = 36 Blätter. Er bastelt 2 Girlanden: 36 mal 2 sind 72 Blätter.","sprachtext":null,"symbol":"🍂"},{"id":"D-21","gruppe":"D","block":"Dc","blockNr":3,"nr":21,"rechenarten":["*","+"],"schwierigkeit":1,"thema":"Spiel","geschichte":"Elif klebt Sticker in ihr Heft. Sie füllt 5 Seiten, auf jede Seite klebt sie 9 Sti 4 - 8","hinweis":"Die Rückfahrt dauert 8 Minuten weniger als die Hinfahrt. Zähle dann beide Fahrten zusammen.","erklaerung":"So denkst du: Zweimal die Hinfahrtszeit wären 34 + 34 = 68 Minuten. Die Rückfahrt ist aber 8 Minuten kürzer: 68 - 8 = 60. Beide Fahrten dauern zusammen 60 Minuten.","sprachtext":null,"symbol":"🚲"},{"id":"F-26","gruppe":"F","block":"Fc","blockNr":3,"nr":26,"rechenarten":["+","-"],"schwierigkeit":6,"thema":"Länge","geschichte":"Elif rollt Murmeln über den langen Gang. Die erste Murmel rollt 45 cm weit. Die zweite Murmel rollt 17 cm weniger weit.","frage":"Wie viele Zentimeter rollen beide Murmeln zusammen?","antwort":73,"rechenweg":"45 + (45 - 17)","hinweis":"Rechne zuerst aus, wie weit die zweite Murmel rollt. Zähle dann beide Strecken zusammen.","erklaerung":"So denkst du: Die zweite Murmel rollt 45 - 17 = 28 cm weit. Beide zusammen: 45 + 28 = 73. Das sind 73 cm.","sprachtext":null,"symbol":"🔵"},{"id":"F-27","gruppe":"F","block":"Fc","blockNr":3,"nr":27,"rechenarten":["-","*"],"schwierigkeit":7,"thema":"Gewicht","geschichte":"Beim Greißler steht ein großer Sack mit 62 kg Erdäpfeln. Lukas hilft mit und füllt 3 Sackerl zu je 9 kg ab.","frage":"Wie viele Kilogramm bleiben im großen Sack?","antwort":35,"rechenweg":"62 - 3 * 9","hinweis":"Rechne zuerst, wie viel abgefüllt wird: 3 mal 9 kg. Ziehe das dann von 62 kg ab.","erklaerung":"So denkst du: 3 Sackerl zu je 9 kg sind 3 · 9 = 27 kg. Aus dem Sack weg: 62 - 27 = 35. Im großen Sack bleiben 35 kg.","sprachtext":null,"symbol":"🥔"},{"id":"F-28","gruppe":"F","block":"Fc","blockNr":3,"nr":28,"rechenarten":["+","*"],"schwierigkeit":8,"thema":"Zeit","geschichte":"Ayda übt für das Konzert Geige. Von Montag bis Freitag übt sie jeden Tag 14 Minuten. Am Samstag hört ihre Mama Cangül zu, da übt Ayda 25 Minuten.","frage":"Wie viele Minuten übt Ayda in dieser Woche insgesamt?","antwort":95,"rechenweg":"14 * 5 + 25","hinweis":"Montag bis Freitag sind 5 Tage. Rechne zuerst mal, dann kommt der Samstag dazu.","erklaerung":"So denkst du: 5 Tage zu je 14 Minuten sind 14 · 5 = 70 Minuten. Dazu der Samstag: 70 + 25 = 95. Ayda übt 95 Minuten in dieser Woche.","sprachtext":null,"symbol":"🎻"},{"id":"F-29","gruppe":"F","block":"Fc","blockNr":3,"nr":29,"rechenarten":["-"],"schwierigkeit":9,"thema":"Länge","geschichte":"Vor der Schule wird ein 90 m langer Gehweg neu gepflastert. Der Papa von Aras schafft am Vormittag 34 m. Der Onkel von Amar schafft 27 m.","frage":"Wie viele Meter Gehweg fehlen dann noch?","antwort":29,"rechenweg":"90 - 34 - 27","hinweis":"Ziehe beide fertigen Stücke nacheinander von 90 m ab. Achtung beim Zehner!","erklaerung":"So denkst du: Der Gehweg ist 90 m lang. Nach dem ersten Stück: 90 - 34 = 56. Nach dem zweiten Stück: 56 - 27 = 29. Es fehlen noch 29 m.","sprachtext":null,"symbol":"🧱"},{"id":"F-30","gruppe":"F","block":"Fc","blockNr":3,"nr":30,"rechenarten":["-","*"],"schwierigkeit":10,"thema":"Gewicht","geschichte":"Talha lädt mit seiner Mama Sultan das Auto für den Flohmarkt. Es dürfen höchstens 95 kg in den Kofferraum. Sie laden 4 Kisten zu je 12 kg und 2 Säcke zu je 18 kg ein.","frage":"Wie viele Kilogramm dürfen noch dazu?","antwort":11,"rechenweg":"95 - 4 * 12 - 2 * 18","hinweis":"Rechne zuerst die Kisten und die Säcke aus, beides sind Mal-Rechnungen. Ziehe dann beides von 95 kg ab.","erklaerung":"So denkst du: 4 Kisten zu je 12 kg sind 4 · 12 = 48 kg. 2 Säcke zu je 18 kg sind 2 · 18 = 36 kg. Dann rechnest du: 95 - 48 = 47 und 47 - 36 = 11. Es dürfen noch 11 kg dazu.","sprachtext":null,"symbol":"🚗"},{"id":"G-01","gruppe":"G","block":"Ga","blockNr":1,"nr":1,"rechenarten":["+","-"],"schwierigkeit":1,"thema":"Schwimmbad","geschichte":"Elif ist mit ihrer Mama Ayten im Schwimmbad. Im Becken liegen 15 Tauchringe. Der Bademeister wirft 4 Ringe dazu. Elif taucht und holt 6 Ringe heraus.","frage":"Wie viele Tauchringe liegen noch im Becken?","antwort":13,"rechenweg":"15 + 4 - 6","hinweis":"Rechne zuerst aus, wie viele Ringe nach dem Dazuwerfen im Becken liegen. Ziehe dann die Ringe ab, die Elif herausholt.","erklaerung":"So denkst du: Zuerst liegen 15 Ringe im Becken. Der Bademeister wirft 4 dazu: 15 + 4 = 19. Elif holt 6 Ringe heraus: 19 - 6 = 13. Es bleiben 13 Tauchringe im Becken.","sprachtext":null,"symbol":"🏊"},{"id":"G-02","gruppe":"G","block":"Ga","blockNr":1,"nr":2,"rechenarten":["+","-"],"schwierigkeit":2,"thema":"Bücherei","geschichte":"In der Bücherei liegen 23 Bücher auf dem Rückgabe-Wagen. Lukas räumt 8 Bücher ins Regal. Dann legt eine Frau 5 Bücher auf den Wagen.","frage":"Wie viele Bücher liegen jetzt auf dem Wagen?","antwort":20,"rechenweg":"23 - 8 + 5","hinweis":"Zuerst werden Bücher vom Wagen weggeräumt. Danach kommen neue dazu. Rechne Schritt für Schritt.","erklaerung":"So denkst du: Auf dem Wagen liegen 23 Bücher. Lukas räumt 8 weg: 23 - 8 = 15. Die Frau legt 5 dazu: 15 + 5 = 20. Jetzt liegen 20 Bücher auf dem Wagen.","sprachtext":null,"symbol":"📚"},{"id":"G-03","gruppe":"G","block":"Ga","blockNr":1,"nr":3,"rechenarten":["-"],"schwierigkeit":3,"thema":"Zoo","geschichte":"Im Zoo bekommt der Tierpfleger am Morgen 30 Fische für die Pinguine. Am Vormittag verfüttert er 12 Fische. Am Nachmittag verfüttert er noch 6 Fische.","frage":"Wie viele Fische bleiben übrig?","antwort":12,"rechenweg":"30 - 12 - 6","hinweis":"Der Pfleger verfüttert zweimal Fische. Ziehe beide Male von den 30 Fischen ab.","erklaerung":"So denkst du: Der Pfleger startet mit 30 Fischen. Am Vormittag verfüttert er 12: 30 - 12 = 18. Am Nachmittag verfüttert er 6: 18 - 6 = 12. Es bleiben 12 Fische übrig.","sprachtext":null,"symbol":"🐧"},{"id":"G-04","gruppe":"G","block":"Ga","blockNr":1,"nr":4,"rechenarten":["+","-"],"schwierigkeit":4,"thema":"Bahnhof","geschichte":"Am Bahnhof warten 26 Leute am Bahnsteig. Dann kommen 15 Leute dazu. Der Zug hat 8 Waggons. 20 Leute steigen ein und fahren mit.","frage":"Wie viele Leute warten noch am Bahnsteig?","antwort":21,"rechenweg":"26 + 15 - 20","hinweis":"Nicht jede Zahl in der Geschichte wird gebraucht. Überlege: Wie viele Leute stehen zuerst am Bahnsteig, und wie viele fahren dann weg?","erklaerung":"So denkst du: Zuerst warten 26 Leute, dann kommen 15 dazu: 26 + 15 = 41. Die 8 Waggons brauchst du für die Rechnung nicht. 20 Leute steigen ein: 41 - 20 = 21. Am Bahnsteig warten noch 21 Leute.","sprachtext":null,"symbol":"🚆"},{"id":"G-05","gruppe":"G","block":"Ga","blockNr":1,"nr":5,"rechenarten":["+","-"],"schwierigkeit":5,"thema":"Werken","geschichte":"Talha bastelt im Werkraum ein Floß. In der Schachtel liegen 42 Holzstäbe. Talha nimmt 17 Stäbe für sein Floß heraus. Seine Mama Sultan legt später 8 neue Stäbe in die Schachtel.","frage":"Wie viele Holzstäbe liegen jetzt in der Schachtel?","antwort":33,"rechenweg":"42 - 17 + 8","hinweis":"Rechne zuerst aus, wie viele Stäbe nach dem Herausnehmen noch da sind. Achtung beim Abziehen: Du musst über einen Zehner gehen.","erklaerung":"So denkst du: In der Schachtel liegen 42 Stäbe. Talha nimmt 17 heraus: 42 - 17 = 25. Mama Sultan legt 8 dazu: 25 + 8 = 33. Jetzt liegen 33 Holzstäbe in der Schachtel.","sprachtext":null,"symbol":"🪵"},{"id":"G-06","gruppe":"G","block":"Ga","blockNr":1,"nr":6,"rechenarten":["+","-"],"schwierigkeit":6,"thema":"Kirtag","geschichte":"Ayda ist mit ihrer Mama Cangül am Kirtag. An der Losbude verkauft der Mann am Vormittag 35 Lose und am Nachmittag 25 Lose. Ein Los kostet 2 Euro. Von allen verkauften Losen sind 40 Lose Nieten.","frage":"Wie viele verkaufte Lose sind Gewinne?","antwort":20,"rechenweg":"35 + 25 - 40","hinweis":"Zähle zuerst alle verkauften Lose zusammen. Ziehe dann die Nieten ab. Eine Zahl in der Geschichte brauchst du gar nicht.","erklaerung":"So denkst du: Am Vormittag und am Nachmittag zusammen sind es 35 + 25 = 60 Lose. Der Preis von 2 Euro spielt keine Rolle. 40 Lose sind Nieten: 60 - 40 = 20. Also sind 20 Lose Gewinne.","sprachtext":null,"symbol":"🎡"},{"id":"G-07","gruppe":"G","block":"Ga","blockNr":1,"nr":7,"rechenarten":["-"],"schwierigkeit":7,"thema":"Winter","geschichte":"Cesur und Ceylin bauen eine Schneeburg. Für die Mauer haben sie 53 Schneebälle gemacht. Beim Spielen zerbrechen 26 Schneebälle. Dann schmelzen in der Sonne noch 9 Schneebälle.","frage":"Wie viele Schneebälle bleiben übrig?","antwort":18,"rechenweg":"53 - 26 - 9","hinweis":"Ziehe zweimal ab. Bei beiden Rechnungen musst du über einen Zehner gehen.","erklaerung":"So denkst du: Die Kinder haben 53 Schneebälle. 26 zerbrechen: 53 - 26 = 27. Dann schmelzen 9: 27 - 9 = 18. Es bleiben 18 Schneebälle übrig.","sprachtext":null,"symbol":"⛄"},{"id":"G-08","gruppe":"G","block":"Ga","blockNr":1,"nr":8,"rechenarten":["+","-"],"schwierigkeit":8,"thema":"Garten","geschichte":"Im Garten von Oma blühen 64 Tulpen. Opa pflanzt noch 18 Tulpen dazu. Der Garten hat 5 Beete. Für den Markt schneidet Oma 35 Tulpen ab.","frage":"Wie viele Tulpen blühen noch im Garten?","antwort":47,"rechenweg":"64 + 18 - 35","hinweis":"Überlege genau, welche Zahlen du brauchst. Erst kommen Tulpen dazu, dann werden welche abgeschnitten.","erklaerung":"So denkst du: Zuerst blühen 64 Tulpen, Opa pflanzt 18 dazu: 64 + 18 = 82. Die 5 Beete brauchst du nicht. Oma schneidet 35 ab: 82 - 35 = 47. Im Garten blühen noch 47 Tulpen.","sprachtext":null,"symbol":"🌷"},{"id":"G-09","gruppe":"G","block":"Ga","blockNr":1,"nr":9,"rechenarten":["+","-"],"schwierigkeit":9,"thema":"Bauernhof","geschichte":"Auf dem Bauernhof sammelt Aras Eier ein. Im Hühnerstall findet er 22 Eier, in der Scheune 14 Eier und hinter dem Traktor noch 9 Eier. Die Bäuerin verkauft davon 15 Eier an einen Nachbarn.","frage":"Wie viele Eier bleiben auf dem Hof?","antwort":30,"rechenweg":"22 + 14 + 9 - 15","hinweis":"Zähle zuerst alle gefundenen Eier zusammen. Das sind drei Zahlen. Ziehe erst am Schluss die verkauften Eier ab.","erklaerung":"So denkst du: Aras findet 22 + 14 = 36 Eier. Mit den Eiern hinter dem Traktor sind es 36 + 9 = 45. Die Bäuerin verkauft 15: 45 - 15 = 30. Auf dem Hof bleiben 30 Eier.","sprachtext":null,"symbol":"🥚"},{"id":"G-10","gruppe":"G","block":"Ga","blockNr":1,"nr":10,"rechenarten":["-","+"],"schwierigkeit":10,"thema":"Schwimmbad","geschichte":"Im Schwimmbad sind am Morgen 71 Badegäste. Zu Mittag gehen 24 Gäste nach Hause. Wenig später gehen noch 13 Gäste. Das Wasser hat 26 Grad. Am Nachmittag kommen 20 neue Gäste.","frage":"Wie viele Badegäste sind jetzt im Schwimmbad?","antwort":54,"rechenweg":"71 - 24 - 13 + 20","hinweis":"Gehe die Geschichte der Reihe nach durch: zweimal gehen Gäste, einmal kommen Gäste. Eine Zahl hat mit den Gästen nichts zu tun.","erklaerung":"So denkst du: Am Morgen sind 71 Gäste da. 24 gehen: 71 - 24 = 47. Noch 13 gehen: 47 - 13 = 34. Die 26 Grad brauchst du nicht. 20 kommen dazu: 34 + 20 = 54. Jetzt sind 54 Badegäste im Bad.","sprachtext":null,"symbol":"🌊"},{"id":"G-11","gruppe":"G","block":"Gb","blockNr":2,"nr":11,"rechenarten":["+","-"],"schwierigkeit":1,"thema":"Bücherei","geschichte":"Elyas hilft seiner Mama Carola in der Bücherei. Auf dem Tisch liegen 45 Comic-Hefte. Eine Klasse bringt 15 Hefte zurück. Dann verleiht Elyas 12 Hefte an Kinder.","frage":"Wie viele Comic-Hefte liegen jetzt auf dem Tisch?","antwort":48,"rechenweg":"45 + 15 - 12","hinweis":"Erst kommen Hefte dazu, dann werden welche verliehen. Rechne der Reihe nach.","erklaerung":"So denkst du: Auf dem Tisch liegen 45 Hefte. Die Klasse bringt 15 zurück: 45 + 15 = 60. Elyas verleiht 12: 60 - 12 = 48. Auf dem Tisch liegen jetzt 48 Comic-Hefte.","sprachtext":null,"symbol":"📖"},{"id":"G-12","gruppe":"G","block":"Gb","blockNr":2,"nr":12,"rechenarten":["-","+"],"schwierigkeit":2,"thema":"Zoo","geschichte":"Im Zoo sitzen 38 Papageien in der großen Voliere. 19 Papageien fliegen in das warme Innenhaus. Um 9 Uhr bringt der Pfleger 24 Papageien aus einem anderen Gehege dazu.","frage":"Wie viele Papageien sind jetzt in der Voliere?","antwort":43,"rechenweg":"38 - 19 + 24","hinweis":"Erst fliegen Papageien weg, dann kommen neue dazu. Die Uhrzeit brauchst du für die Rechnung nicht.","erklaerung":"So denkst du: In der Voliere sitzen 38 Papageien. 19 fliegen weg: 38 - 19 = 19. Die Uhrzeit ist nur eine Zusatzinfo. Der Pfleger bringt 24 dazu: 19 + 24 = 43. In der Voliere sind jetzt 43 Papageien.","sprachtext":null,"symbol":"🦜"},{"id":"G-13","gruppe":"G","block":"Gb","blockNr":2,"nr":13,"rechenarten":["-"],"schwierigkeit":3,"thema":"Bahnhof","geschichte":"Im Zug nach Wien sitzen 56 Fahrgäste. Am ersten Halt steigen 14 Fahrgäste aus. Am nächsten Halt steigen 18 Fahrgäste aus.","frage":"Wie viele Fahrgäste sitzen noch im Zug?","antwort":24,"rechenweg":"56 - 14 - 18","hinweis":"Ziehe zweimal ab. Bei der zweiten Rechnung musst du über einen Zehner gehen.","erklaerung":"So denkst du: Im Zug sitzen 56 Fahrgäste. Am ersten Halt steigen 14 aus: 56 - 14 = 42. Am nächsten Halt steigen 18 aus: 42 - 18 = 24. Im Zug sitzen noch 24 Fahrgäste.","sprachtext":null,"symbol":"🚉"},{"id":"G-14","gruppe":"G","block":"Gb","blockNr":2,"nr":14,"rechenarten":["+","-"],"schwierigkeit":4,"thema":"Werken","geschichte":"Für den Werkunterricht kauft die Lehrerin Perlen. Sie hat 27 rote Perlen und 31 blaue Perlen. Eine Packung Perlen kostet 4 Euro. Die Kinder fädeln 25 Perlen auf Ketten.","frage":"Wie viele Perlen bleiben übrig?","antwort":33,"rechenweg":"27 + 31 - 25","hinweis":"Zähle zuerst die roten und die blauen Perlen zusammen. Eine Zahl in der Geschichte gehört nicht zur Rechnung.","erklaerung":"So denkst du: Rote und blaue Perlen zusammen: 27 + 31 = 58. Der Preis von 4 Euro spielt keine Rolle. Die Kinder fädeln 25 Perlen auf: 58 - 25 = 33. Es bleiben 33 Perlen übrig.","sprachtext":null,"symbol":"📿"},{"id":"G-15","gruppe":"G","block":"Gb","blockNr":2,"nr":15,"rechenarten":["-","+"],"schwierigkeit":5,"thema":"Winter","geschichte":"Beim Schneefest im Park stehen 62 kleine Schneefiguren. In einer warmen Nacht schmelzen 28 Figuren. Am Morgen bauen Ayup und seine Freunde 16 neue Figuren.","frage":"Wie viele Schneefiguren stehen jetzt im Park?","antwort":50,"rechenweg":"62 - 28 + 16","hinweis":"Erst schmelzen Figuren weg, dann kommen neue dazu. Beim Abziehen musst du über einen Zehner gehen.","erklaerung":"So denkst du: Im Park stehen 62 Figuren. 28 schmelzen: 62 - 28 = 34. Ayup und seine Freunde bauen 16 neue: 34 + 16 = 50. Jetzt stehen 50 Schneefiguren im Park.","sprachtext":null,"symbol":"❄️"},{"id":"G-16","gruppe":"G","block":"Gb","blockNr":2,"nr":16,"rechenarten":["+","-"],"schwierigkeit":6,"thema":"Kirtag","geschichte":"Aslan ist mit seiner Mama Rabia am Kirtag. Beim Dosenwerfen sammelt er am Vormittag 44 Punkte und am Nachmittag 27 Punkte. Ein Wurf kostet 3 Euro. Für einen Plüschbären tauscht Aslan 30 Punkte ein.","frage":"Wie viele Punkte hat Aslan noch?","antwort":41,"rechenweg":"44 + 27 - 30","hinweis":"Zähle zuerst alle Punkte zusammen. Ziehe dann die eingetauschten Punkte ab. Der Preis für einen Wurf gehört nicht zur Rechnung.","erklaerung":"So denkst du: Aslan sammelt 44 + 27 = 71 Punkte. Die 3 Euro brauchst du nicht. Für den Bären gibt er 30 Punkte her: 71 - 30 = 41. Aslan hat noch 41 Punkte.","sprachtext":null,"symbol":"🧸"},{"id":"G-17","gruppe":"G","block":"Gb","blockNr":2,"nr":17,"rechenarten":["-"],"schwierigkeit":7,"thema":"Garten","geschichte":"Im Schulgarten hängen 85 Äpfel am großen Apfelbaum. Die Kinder pflücken 35 Äpfel für frischen Apfelsaft. In der Nacht weht der Wind 17 Äpfel herunter.","frage":"Wie viele Äpfel hängen noch am Baum?","antwort":33,"rechenweg":"85 - 35 - 17","hinweis":"Ziehe zweimal ab: erst die gepflückten Äpfel, dann die heruntergewehten. Bei der zweiten Rechnung gehst du über einen Zehner.","erklaerung":"So denkst du: Am Baum hängen 85 Äpfel. Die Kinder pflücken 35: 85 - 35 = 50. Der Wind weht 17 herunter: 50 - 17 = 33. Am Baum hängen noch 33 Äpfel.","sprachtext":null,"symbol":"🍎"},{"id":"G-18","gruppe":"G","block":"Gb","blockNr":2,"nr":18,"rechenarten":["+","-"],"schwierigkeit":8,"thema":"Bauernhof","geschichte":"Der Bauer lädt Heuballen auf den Wagen. Von der ersten Wiese holt er 36 Ballen, von der zweiten Wiese 24 Ballen und von der dritten Wiese 18 Ballen. Der Wagen hat 4 Räder. Beim Stall lädt der Bauer 40 Ballen ab.","frage":"Wie viele Heuballen sind noch auf dem Wagen?","antwort":38,"rechenweg":"36 + 24 + 18 - 40","hinweis":"Zähle zuerst die Ballen von allen drei Wiesen zusammen. Eine Zahl in der Geschichte brauchst du nicht. Ziehe am Schluss die abgeladenen Ballen ab.","erklaerung":"So denkst du: Von den ersten beiden Wiesen kommen 36 + 24 = 60 Ballen. Mit der dritten Wiese sind es 60 + 18 = 78. Die 4 Räder gehören nicht zur Rechnung. Beim Stall lädt der Bauer 40 ab: 78 - 40 = 38. Auf dem Wagen sind noch 38 Heuballen.","sprachtext":null,"symbol":"🌾"},{"id":"G-19","gruppe":"G","block":"Gb","blockNr":2,"nr":19,"rechenarten":["-","+"],"schwierigkeit":9,"thema":"Schwimmbad","geschichte":"Der Kiosk im Schwimmbad hat am Morgen 55 Eis in der Kühltruhe. Am Vormittag verkauft Lia am Kiosk 12 Eis. Zu Mittag verkauft sie noch 20 Eis. Danach liefert der Eiswagen 30 neue Eis.","frage":"Wie viele Eis sind jetzt in der Kühltruhe?","antwort":53,"rechenweg":"55 - 12 - 20 + 30","hinweis":"Gehe die Geschichte der Reihe nach durch: zweimal wird verkauft, einmal wird geliefert. Das sind drei Rechenschritte.","erklaerung":"So denkst du: In der Truhe sind 55 Eis. Lia verkauft 12: 55 - 12 = 43. Sie verkauft noch 20: 43 - 20 = 23. Der Eiswagen liefert 30: 23 + 30 = 53. In der Truhe sind jetzt 53 Eis.","sprachtext":null,"symbol":"🍦"},{"id":"G-20","gruppe":"G","block":"Gb","blockNr":2,"nr":20,"rechenarten":["-","+"],"schwierigkeit":10,"thema":"Zoo","geschichte":"Für die Elefanten im Zoo liegen am Morgen 90 Melonenstücke bereit. Am Vormittag fressen die Elefanten 46 Stücke. Ein Pfleger schneidet 12 neue Stücke. Der Zoo hat 6 Elefanten. Am Nachmittag fressen die Tiere noch 28 Stücke.","frage":"Wie viele Melonenstücke bleiben übrig?","antwort":28,"rechenweg":"90 - 46 + 12 - 28","hinweis":"Gehe Schritt für Schritt durch die Geschichte: fressen, dazuschneiden, wieder fressen. Wie viele Elefanten es sind, brauchst du für die Rechnung nicht.","erklaerung":"So denkst du: Am Morgen liegen 90 Stücke bereit. Die Elefanten fressen 46: 90 - 46 = 44. Der Pfleger schneidet 12 dazu: 44 + 12 = 56. Die Zahl 6 brauchst du nicht. Am Nachmittag fressen die Tiere 28: 56 - 28 = 28. Es bleiben 28 Melonenstücke übrig.","sprachtext":null,"symbol":"🐘"},{"id":"G-21","gruppe":"G","block":"Gc","blockNr":3,"nr":21,"rechenarten":["+","-"],"schwierigkeit":1,"thema":"Bücherei","geschichte":"Die Bücherei bekommt neue Kinderbücher. Am Montag kommen 25 Bücher, am Dienstag 15 Bücher und am Mittwoch 30 Bücher. Lia und die anderen Kinder leihen gleich 22 Bücher aus.","frage":"Wie viele neue Bücher stehen noch im Regal?","antwort":48,"rechenweg":"25 + 15 + 30 - 22","hinweis":"Zähle zuerst die Bücher von allen drei Tagen zusammen. Ziehe dann die ausgeliehenen Bücher ab.","erklaerung":"So denkst du: Am Montag und Dienstag kommen 25 + 15 = 40 Bücher. Mit dem Mittwoch sind es 40 + 30 = 70. Die Kinder leihen 22 aus: 70 - 22 = 48. Im Regal stehen noch 48 neue Bücher.","sprachtext":null,"symbol":"📕"},{"id":"G-22","gruppe":"G","block":"Gc","blockNr":3,"nr":22,"rechenarten":["-","+"],"schwierigkeit":2,"thema":"Bahnhof","geschichte":"Im Fahrradständer am Bahnhof stehen am Morgen 64 Räder. Bis Mittag holen 24 Leute ihr Rad ab. Dann stellen 35 Leute ihr Rad neu hinein. Der Ständer hat 3 Reihen. Am Abend holen noch 11 Leute ihr Rad.","frage":"Wie viele Räder stehen jetzt im Ständer?","antwort":64,"rechenweg":"64 - 24 + 35 - 11","hinweis":"Räder werden geholt, neue kommen dazu, wieder werden welche geholt. Das sind drei Schritte. Eine Zahl brauchst du nicht.","erklaerung":"So denkst du: Am Morgen stehen 64 Räder da. 24 werden geholt: 64 - 24 = 40. 35 kommen dazu: 40 + 35 = 75. Die 3 Reihen brauchst du nicht. Am Abend werden 11 geholt: 75 - 11 = 64. Im Ständer stehen wieder 64 Räder.","sprachtext":null,"symbol":"🚲"},{"id":"G-23","gruppe":"G","block":"Gc","blockNr":3,"nr":23,"rechenarten":["+","-"],"schwierigkeit":3,"thema":"Winter","geschichte":"Ceylin und Paul machen Schneebälle für eine große Schneeballschlacht. Ceylin macht 48 Bälle, Paul macht 26 Bälle. Beim ersten Spiel werfen sie 30 Bälle. Beim zweiten Spiel werfen sie noch 14 Bälle.","frage":"Wie viele Schneebälle haben die beiden noch?","antwort":30,"rechenweg":"48 + 26 - 30 - 14","hinweis":"Zähle zuerst die Bälle von Ceylin und Paul zusammen. Ziehe dann die geworfenen Bälle von beiden Spielen ab.","erklaerung":"So denkst du: Ceylin und Paul machen zusammen 48 + 26 = 74 Bälle. Beim ersten Spiel werfen sie 30: 74 - 30 = 44. Beim zweiten Spiel werfen sie 14: 44 - 14 = 30. Die beiden haben noch 30 Schneebälle.","sprachtext":null,"symbol":"🌨️"},{"id":"G-24","gruppe":"G","block":"Gc","blockNr":3,"nr":24,"rechenarten":["-","+"],"schwierigkeit":4,"thema":"Garten","geschichte":"Asel pflückt Erdbeeren im Garten. Am Beet hängen 72 reife Erdbeeren. Asel pflückt 35 Erdbeeren für die Marmelade. Ihre Schwester nascht 16 Erdbeeren. Das Beet ist 9 Meter lang. Bis zum Abend werden 25 Erdbeeren neu reif.","frage":"Wie viele reife Erdbeeren hängen am Abend am Beet?","antwort":46,"rechenweg":"72 - 35 - 16 + 25","hinweis":"Zweimal werden Erdbeeren weniger, einmal kommen reife dazu. Die Länge des Beetes brauchst du nicht.","erklaerung":"So denkst du: Am Beet hängen 72 reife Erdbeeren. Asel pflückt 35: 72 - 35 = 37. Die Schwester nascht 16: 37 - 16 = 21. Die 9 Meter sind nur eine Zusatzinfo. 25 werden neu reif: 21 + 25 = 46. Am Abend hängen 46 reife Erdbeeren am Beet.","sprachtext":null,"symbol":"🍓"},{"id":"G-25","gruppe":"G","block":"Gc","blockNr":3,"nr":25,"rechenarten":["+","-"],"schwierigkeit":5,"thema":"Kirtag","geschichte":"Amar sammelt am Kirtag Punkte. Beim Ringewerfen gewinnt er 33 Punkte, beim Dosenwerfen 27 Punkte und beim Pfeilwerfen 19 Punkte. Für eine große Zuckerwatte tauscht er 40 Punkte ein.","frage":"Wie viele Punkte hat Amar noch?","antwort":39,"rechenweg":"33 + 27 + 19 - 40","hinweis":"Zähle zuerst die Punkte von allen drei Spielen zusammen. Ziehe erst dann die eingetauschten Punkte ab.","erklaerung":"So denkst du: Ringewerfen und Dosenwerfen bringen 33 + 27 = 60 Punkte. Mit dem Pfeilwerfen sind es 60 + 19 = 79. Für die Zuckerwatte gibt Amar 40 Punkte her: 79 - 40 = 39. Amar hat noch 39 Punkte.","sprachtext":null,"symbol":"🍭"},{"id":"G-26","gruppe":"G","block":"Gc","blockNr":3,"nr":26,"rechenarten":["-","+"],"schwierigkeit":6,"thema":"Bauernhof","geschichte":"Im Stall liegen am Morgen 85 Karotten für die Pferde. Am Vormittag frisst die Herde 27 Karotten. Zu Mittag frisst sie noch 30 Karotten. Auf dem Hof leben 7 Pferde. Am Nachmittag bringt Lukas 12 frische Karotten.","frage":"Wie viele Karotten liegen jetzt im Stall?","antwort":40,"rechenweg":"85 - 27 - 30 + 12","hinweis":"Zweimal fressen die Pferde, einmal kommen Karotten dazu. Wie viele Pferde auf dem Hof leben, brauchst du für die Rechnung nicht.","erklaerung":"So denkst du: Im Stall liegen 85 Karotten. Die Herde frisst 27: 85 - 27 = 58. Sie frisst noch 30: 58 - 30 = 28. Die Zahl 7 gehört nicht zur Rechnung. Lukas bringt 12: 28 + 12 = 40. Im Stall liegen jetzt 40 Karotten.","sprachtext":null,"symbol":"🥕"},{"id":"G-27","gruppe":"G","block":"Gc","blockNr":3,"nr":27,"rechenarten":["+","-"],"schwierigkeit":7,"thema":"Schwimmbad","geschichte":"Beim Schwimmfest sammelt die Klasse von Elyas Punkte. Beim Tauchen holt die Klasse 40 Punkte. Beim Staffelschwimmen holt sie 35 Punkte. Wegen eines Frühstarts werden 18 Punkte abgezogen. Wegen eines zweiten Fehlers werden noch 27 Punkte abgezogen.","frage":"Wie viele Punkte hat die Klasse am Ende?","antwort":30,"rechenweg":"40 + 35 - 18 - 27","hinweis":"Zähle zuerst die gewonnenen Punkte zusammen. Ziehe danach beide Abzüge nacheinander ab.","erklaerung":"So denkst du: Die Klasse holt 40 + 35 = 75 Punkte. Der erste Abzug: 75 - 18 = 57. Der zweite Abzug: 57 - 27 = 30. Die Klasse hat am Ende 30 Punkte.","sprachtext":null,"symbol":"🏅"},{"id":"G-28","gruppe":"G","block":"Gc","blockNr":3,"nr":28,"rechenarten":["-","+"],"schwierigkeit":8,"thema":"Zoo","geschichte":"Im Affenhaus liegen 96 Bananen im Vorrat. Am Montag verfüttert der Pfleger 38 Bananen. Am Dienstag verfüttert er 25 Bananen. Im Affenhaus leben 14 Affen. Am Mittwoch liefert ein Bauer 40 frische Bananen.","frage":"Wie viele Bananen sind jetzt im Vorrat?","antwort":73,"rechenweg":"96 - 38 - 25 + 40","hinweis":"Zweimal werden Bananen verfüttert, dann kommt eine Lieferung. Wie viele Affen es sind, spielt für die Rechnung keine Rolle.","erklaerung":"So denkst du: Im Vorrat liegen 96 Bananen. Am Montag verfüttert der Pfleger 38: 96 - 38 = 58. Am Dienstag noch 25: 58 - 25 = 33. Die 14 Affen brauchst du nicht. Der Bauer liefert 40: 33 + 40 = 73. Im Vorrat sind jetzt 73 Bananen.","sprachtext":null,"symbol":"🍌"},{"id":"G-29","gruppe":"G","block":"Gc","blockNr":3,"nr":29,"rechenarten":["+","-"],"schwierigkeit":9,"thema":"Werken","geschichte":"Für die Winterwerkstatt schneiden die Kinder Papiersterne aus. Ayda schneidet 52 Sterne, Cesur schneidet 29 Sterne. 34 Sterne kleben sie an die Fenster der Klasse. 19 Sterne schenken sie der Nachbarklasse.","frage":"Wie viele Sterne bleiben übrig?","antwort":28,"rechenweg":"52 + 29 - 34 - 19","hinweis":"Zähle zuerst die Sterne von Ayda und Cesur zusammen. Ziehe dann zweimal ab. Bei beiden Abzügen gehst du über einen Zehner.","erklaerung":"So denkst du: Ayda und Cesur schneiden zusammen 52 + 29 = 81 Sterne. An die Fenster kommen 34: 81 - 34 = 47. Die Nachbarklasse bekommt 19: 47 - 19 = 28. Es bleiben 28 Sterne übrig.","sprachtext":null,"symbol":"⭐"},{"id":"G-30","gruppe":"G","block":"Gc","blockNr":3,"nr":30,"rechenarten":["-","+"],"schwierigkeit":10,"thema":"Winter","geschichte":"Am Eislaufplatz liegen am Morgen 100 Paar Leihschlittschuhe im Regal. Am Vormittag borgen sich 45 Kinder je ein Paar aus. Zu Mittag borgen sich noch 28 Kinder je ein Paar aus. Die Eisfläche ist 30 Meter lang. Am Nachmittag geben 36 Kinder ihr Paar zurück.","frage":"Wie viele Paar Leihschlittschuhe liegen jetzt im Regal?","antwort":63,"rechenweg":"100 - 45 - 28 + 36","hinweis":"Zweimal werden Schlittschuhe ausgeborgt, einmal kommen welche zurück. Die Länge der Eisfläche brauchst du nicht. Achtung: Bei beiden Abzügen gehst du über einen Zehner.","erklaerung":"So denkst du: Im Regal liegen 100 Paar. 45 werden ausgeborgt: 100 - 45 = 55. Noch 28 werden ausgeborgt: 55 - 28 = 27. Die 30 Meter sind nur eine Zusatzinfo. 36 Paar kommen zurück: 27 + 36 = 63. Im Regal liegen jetzt 63 Paar Leihschlittschuhe.","sprachtext":null,"symbol":"⛸️"},{"id":"H-01","gruppe":"H","block":"Ha","blockNr":1,"nr":1,"rechenarten":["*","+"],"schwierigkeit":1,"thema":"Sport","geschichte":"Im Turnsaal liegen 3 Reihen mit jeweils 8 Matten. Elif holt noch 4 Matten aus dem Geräteraum dazu.","frage":"Wie viele Matten liegen jetzt im Turnsaal?","antwort":28,"rechenweg":"3 * 8 + 4","hinweis":"Rechne zuerst aus, wie viele Matten in den 3 Reihen liegen. Dann zähle die Matten aus dem Geräteraum dazu.","erklaerung":"So denkst du: 3 Reihen mit jeweils 8 Matten sind 3 mal 8, also 24 Matten. Elif holt noch 4 Matten dazu. 24 plus 4 sind 28. Im Turnsaal liegen jetzt 28 Matten.","sprachtext":null,"symbol":"🤸"},{"id":"H-02","gruppe":"H","block":"Ha","blockNr":1,"nr":2,"rechenarten":["*","-"],"schwierigkeit":2,"thema":"Eislaufen","geschichte":"Mama Cangül bringt Ayda zum Eislaufplatz. Dort stehen 5 Gruppen mit jeweils 6 Kindern auf dem Eis. 7 Kinder gehen zur Pause. Der Eintritt kostet 3 Euro.","frage":"Wie viele Kinder sind noch auf dem Eis?","antwort":23,"rechenweg":"5 * 6 - 7","hinweis":"Rechne zuerst aus, wie viele Kinder in den 5 Gruppen sind. Der Eintrittspreis ist für die Frage nicht wichtig.","erklaerung":"So denkst du: 5 Gruppen mit jeweils 6 Kindern sind 5 mal 6, also 30 Kinder. 7 Kinder gehen zur Pause. 30 minus 7 sind 23. Auf dem Eis sind noch 23 Kinder. Die 3 Euro Eintritt brauchst du für die Rechnung nicht.","sprachtext":null,"symbol":"⛸️"},{"id":"H-03","gruppe":"H","block":"Ha","blockNr":1,"nr":3,"rechenarten":["*","+"],"schwierigkeit":3,"thema":"Bäckerei","geschichte":"In der Bäckerei liegen 4 Bleche mit jeweils 9 Semmeln. Talha schiebt noch 15 Semmeln in das Regal dazu.","frage":"Wie viele Semmeln sind es jetzt zusammen?","antwort":51,"rechenweg":"4 * 9 + 15","hinweis":"Rechne zuerst aus, wie viele Semmeln auf den 4 Blechen liegen. Dann zähle die 15 Semmeln dazu.","erklaerung":"So denkst du: 4 Bleche mit jeweils 9 Semmeln sind 4 mal 9, also 36 Semmeln. Talha legt noch 15 Semmeln dazu. 36 plus 15 sind 51. Zusammen sind es 51 Semmeln.","sprachtext":null,"symbol":"🥐"},{"id":"H-04","gruppe":"H","block":"Ha","blockNr":1,"nr":4,"rechenarten":["-","+"],"schwierigkeit":4,"thema":"Zeltlager","geschichte":"Beim Zeltlager sind 45 Kinder auf dem Platz. 18 Kinder gehen in ihre Zelte. Dann kommen 6 Kinder vom Fußballspielen zurück auf den Platz. Das Lager hat 9 Zelte.","frage":"Wie viele Kinder sind jetzt auf dem Platz?","antwort":33,"rechenweg":"45 - 18 + 6","hinweis":"Zieh zuerst die Kinder ab, die in die Zelte gehen. Dann zähle die Kinder dazu, die zurückkommen. Die Zahl der Zelte brauchst du nicht.","erklaerung":"So denkst du: Zuerst gehen 18 Kinder weg. 45 minus 18 sind 27 Kinder. Dann kommen 6 Kinder zurück. 27 plus 6 sind 33. Auf dem Platz sind jetzt 33 Kinder. Die 9 Zelte sind nur eine Ablenkung.","sprachtext":null,"symbol":"⛺"},{"id":"H-05","gruppe":"H","block":"Ha","blockNr":1,"nr":5,"rechenarten":["*","-"],"schwierigkeit":5,"thema":"Musik","geschichte":"In der Musikschule stehen 6 Regale mit jeweils 7 Notenheften. Die Lehrerin nimmt 12 Hefte für den Unterricht heraus.","frage":"Wie viele Notenhefte stehen noch in den Regalen?","antwort":30,"rechenweg":"6 * 7 - 12","hinweis":"Rechne zuerst aus, wie viele Hefte in allen 6 Regalen stehen. Dann zieh die Hefte ab, die die Lehrerin nimmt.","erklaerung":"So denkst du: 6 Regale mit jeweils 7 Heften sind 6 mal 7, also 42 Hefte. Die Lehrerin nimmt 12 Hefte heraus. 42 minus 12 sind 30. In den Regalen stehen noch 30 Notenhefte.","sprachtext":null,"symbol":"🎵"},{"id":"H-06","gruppe":"H","block":"Ha","blockNr":1,"nr":6,"rechenarten":["*","-"],"schwierigkeit":6,"thema":"Reiterhof","geschichte":"Auf dem Reiterhof lagern 7 Boxen mit jeweils 8 Heuballen. Die Pferde fressen 16 Heuballen auf. Auf dem Hof leben 12 Pferde.","frage":"Wie viele Heuballen bleiben übrig?","antwort":40,"rechenweg":"7 * 8 - 16","hinweis":"Rechne zuerst aus, wie viele Heuballen in allen Boxen lagern. Die Zahl der Pferde brauchst du für die Rechnung nicht.","erklaerung":"So denkst du: 7 Boxen mit jeweils 8 Heuballen sind 7 mal 8, also 56 Ballen. Die Pferde fressen 16 Ballen. 56 minus 16 sind 40. Es bleiben 40 Heuballen übrig. Die 12 Pferde sind nur eine Ablenkung.","sprachtext":null,"symbol":"🐴"},{"id":"H-07","gruppe":"H","block":"Ha","blockNr":1,"nr":7,"rechenarten":["+","-"],"schwierigkeit":7,"thema":"Theater","geschichte":"Die Theatergruppe von Paul und Lia verkauft am Montag 24 Karten und am Dienstag 38 Karten. 15 Karten werden wieder zurückgegeben.","frage":"Wie viele Karten sind am Ende verkauft?","antwort":47,"rechenweg":"24 + 38 - 15","hinweis":"Zähle zuerst die Karten von Montag und Dienstag zusammen. Dann zieh die zurückgegebenen Karten ab.","erklaerung":"So denkst du: Am Montag und Dienstag zusammen sind es 24 plus 38, also 62 Karten. 15 Karten kommen zurück. 62 minus 15 sind 47. Am Ende sind 47 Karten verkauft.","sprachtext":null,"symbol":"🎭"},{"id":"H-08","gruppe":"H","block":"Ha","blockNr":1,"nr":8,"rechenarten":["*","-"],"schwierigkeit":8,"thema":"Sport","geschichte":"Cesur stapelt im Turnsaal 9 Kisten mit jeweils 6 Bällen. Für das Training werden 24 Bälle herausgenommen. Das Training dauert 45 Minuten.","frage":"Wie viele Bälle bleiben in den Kisten?","antwort":30,"rechenweg":"9 * 6 - 24","hinweis":"Rechne zuerst aus, wie viele Bälle in allen 9 Kisten sind. Die Dauer des Trainings ist für die Frage nicht wichtig.","erklaerung":"So denkst du: 9 Kisten mit jeweils 6 Bällen sind 9 mal 6, also 54 Bälle. 24 Bälle werden herausgenommen. 54 minus 24 sind 30. In den Kisten bleiben 30 Bälle. Die 45 Minuten brauchst du nicht.","sprachtext":null,"symbol":"⚽"},{"id":"H-09","gruppe":"H","block":"Ha","blockNr":1,"nr":9,"rechenarten":["*","+"],"schwierigkeit":9,"thema":"Flohmarkt","geschichte":"Elyas und Mama Carola haben einen Flohmarkt-Stand. Elyas verkauft 5 Spielzeugautos für jeweils 9 Euro. Dazu bekommt er 27 Euro für ein Lego-Schiff. Am Stand liegen noch 14 Bücher.","frage":"Wie viel Euro hat Elyas eingenommen?","antwort":72,"rechenweg":"5 * 9 + 27","hinweis":"Rechne zuerst aus, wie viel Euro die 5 Autos zusammen bringen. Die Bücher wurden nicht verkauft.","erklaerung":"So denkst du: 5 Autos für jeweils 9 Euro sind 5 mal 9, also 45 Euro. Dazu kommen 27 Euro für das Schiff. 45 plus 27 sind 72. Elyas hat 72 Euro eingenommen. Die 14 Bücher zählen nicht mit.","sprachtext":null,"symbol":"💶"},{"id":"H-10","gruppe":"H","block":"Ha","blockNr":1,"nr":10,"rechenarten":["-","*"],"schwierigkeit":10,"thema":"Eislaufen","geschichte":"Der Eislaufplatz hat 96 Paar Leihschuhe. Am Vormittag kommen 4 Schulklassen. Jede Klasse leiht sich 7 Paar Schuhe aus. Amar schaut beim Verleih zu.","frage":"Wie viele Paar Leihschuhe sind noch da?","antwort":68,"rechenweg":"96 - 4 * 7","hinweis":"Rechne zuerst aus, wie viele Paar Schuhe alle 4 Klassen zusammen ausleihen. Dann zieh diese Zahl von 96 ab.","erklaerung":"So denkst du: 4 Klassen leihen jeweils 7 Paar Schuhe. 4 mal 7 sind 28 Paar. Vorher waren 96 Paar da. 96 minus 28 sind 68. Es sind noch 68 Paar Leihschuhe da.","sprachtext":null,"symbol":"⛸️"},{"id":"H-11","gruppe":"H","block":"Hb","blockNr":2,"nr":11,"rechenarten":["*","+"],"schwierigkeit":1,"thema":"Bäckerei","geschichte":"Ayup hilft in der Bäckerei. Er legt 6 Reihen mit jeweils 8 Brezeln auf das Blech. Dann legt er noch 13 Brezeln dazu.","frage":"Wie viele Brezeln liegen auf dem Blech?","antwort":61,"rechenweg":"6 * 8 + 13","hinweis":"Rechne zuerst aus, wie viele Brezeln in den 6 Reihen liegen. Dann nkte. Bei der Kür gewinnt sie 18 Punkte dazu. Ihre Startnummer ist 7.","frage":"Wie viele Punkte hat Ayda jetzt?","antwort":54,"rechenweg":"65 - 29 + 18","hinweis":"Zieh zuerst die verlorenen Punkte ab. Dann zähle die gewonnenen Punkte dazu. Die Startnummer brauchst du nicht.","erklaerung":"So denkst du: Ayda verliert 29 von 65 Punkten. 65 minus 29 sind 36 Punkte. Dann gewinnt sie 18 dazu. 36 plus 18 sind 54. Ayda hat jetzt 54 Punkte. Die Startnummer 7 ist nur eine Ablenkung.","sprachtext":null,"symbol":"⛸️"},{"id":"H-21","gruppe":"H","block":"Hc","blockNr":3,"nr":21,"rechenarten":["*","-"],"schwierigkeit":1,"thema":"Musik","geschichte":"In der Musikschule liegen 6 Packungen mit jeweils 7 Gitarrensaiten. Der Lehrer von Lukas verbraucht beim Reparieren 19 Saiten.","frage":"Wie viele Saiten sind noch da?","antwort":23,"rechenweg":"6 * 7 - 19","hinweis":"Rechne zuerst aus, wie viele Saiten in allen 6 Packungen sind. Dann zieh die verbrauchten Saiten ab.","erklaerung":"So denkst du: 6 Packungen mit jeweils 7 Saiten sind 6 mal 7, also 42 Saiten. Der Lehrer verbraucht 19 Saiten. 42 minus 19 sind 23. Es sind noch 23 Saiten da.","sprachtext":null,"symbol":"🎸"},{"id":"H-22","gruppe":"H","block":"Hc","blockNr":3,"nr":22,"rechenarten":["*","+"],"schwierigkeit":2,"thema":"Reiterhof","geschichte":"Elif füttert auf dem Reiterhof die Tiere. 3 Ponys bekommen jeweils 9 Karotten. 4 große Pferde bekommen jeweils 5 Karotten. Mama Ayten schaut ihr dabei zu.","frage":"Wie viele Karotten verfüttert Elif insgesamt?","antwort":47,"rechenweg":"3 * 9 + 4 * 5","hinweis":"Rechne zuerst die Karotten für die Ponys aus, dann die Karotten für die großen Pferde. Zähle beides zusammen.","erklaerung":"So denkst du: Die Ponys bekommen 3 mal 9 Karotten, also 27. Die großen Pferde bekommen 4 mal 5 Karotten, also 20. Jetzt beides zusammenzählen: 27 plus 20 sind 47. Elif verfüttert 47 Karotten.","sprachtext":null,"symbol":"🥕"},{"id":"H-23","gruppe":"H","block":"Hc","blockNr":3,"nr":23,"rechenarten":["*","+"],"schwierigkeit":3,"thema":"Bäckerei","geschichte":"Amar packt in der Bäckerei Kekse ein. Er füllt 5 Sackerl mit jeweils 8 Keksen und 6 Sackerl mit jeweils 9 Keksen.","frage":"Wie viele Kekse packt Amar insgesamt ein?","antwort":94,"rechenweg":"5 * 8 + 6 * 9","hinweis":"Rechne zuerst die Kekse in den ersten Sackerln aus, dann die Kekse in den zweiten Sackerln. Zähle beides zusammen.","erklaerung":"So denkst du: Die ersten Sackerl haben 5 mal 8 Kekse, also 40. Die zweiten Sackerl haben 6 mal 9 Kekse, also 54. Zusammen sind das 40 plus 54, also 94. Amar packt 94 Kekse ein.","sprachtext":null,"symbol":"🍪"},{"id":"H-24","gruppe":"H","block":"Hc","blockNr":3,"nr":24,"rechenarten":["*","-","+"],"schwierigkeit":4,"thema":"Sport","geschichte":"Beim Völkerball im Turnsaal schafft Cesurs Team 9 Runden mit jeweils 9 Punkten. Dann verliert das Team 38 Punkte durch Fehler. Zum Schluss gewinnt es noch 15 Punkte dazu.","frage":"Wie viele Punkte hat das Team am Ende?","antwort":58,"rechenweg":"9 * 9 - 38 + 15","hinweis":"Rechne zuerst die Punkte aus den 9 Runden aus. Dann zieh die verlorenen Punkte ab und zähle die gewonnenen dazu.","erklaerung":"So denkst du: 9 Runden mit jeweils 9 Punkten sind 9 mal 9, also 81 Punkte. Das Team verliert 38 Punkte: 81 minus 38 sind 43. Dann gewinnt es 15 dazu: 43 plus 15 sind 58. Am Ende hat das Team 58 Punkte.","sprachtext":null,"symbol":"🏐"},{"id":"H-25","gruppe":"H","block":"Hc","blockNr":3,"nr":25,"rechenarten":["+","-","*"],"schwierigkeit":5,"thema":"Flohmarkt","geschichte":"Ayup nimmt an seinem Flohmarkt-Stand am Vormittag 48 Euro und am Nachmittag 37 Euro ein. Danach kauft er sich 6 Comic-Hefte für jeweils 9 Euro. Sein Stand ist 4 Meter lang.","frage":"Wie viel Euro bleiben Ayup übrig?","antwort":31,"rechenweg":"48 + 37 - 6 * 9","hinweis":"Zähle zuerst die Einnahmen vom Vormittag und Nachmittag zusammen. Rechne dann aus, was die Comic-Hefte zusammen kosten. Die Länge des Standes brauchst du nicht.","erklaerung":"So denkst du: Ayup nimmt 48 plus 37 Euro ein, also 85 Euro. Die Hefte kosten 6 mal 9 Euro, also 54 Euro. 85 minus 54 sind 31. Ayup bleiben 31 Euro übrig. Die 4 Meter sind nur eine Ablenkung.","sprachtext":null,"symbol":"💶"},{"id":"H-26","gruppe":"H","block":"Hc","blockNr":3,"nr":26,"rechenarten":["-","*"],"schwierigkeit":6,"thema":"Theater","geschichte":"Die Theatergruppe von Lia hat 90 Eintrittskarten drucken lassen. 4 Klassen kaufen jeweils 9 Karten. Dann kauft ein Verein noch 14 Karten.","frage":"Wie viele Karten sind noch übrig?","antwort":40,"rechenweg":"90 - 4 * 9 - 14","hinweis":"Rechne zuerst aus, wie viele Karten die 4 Klassen zusammen kaufen. Zieh danach beide Käufe von 90 ab.","erklaerung":"So denkst du: 4 Klassen kaufen jeweils 9 Karten, das sind 4 mal 9, also 36 Karten. 90 minus 36 sind 54 Karten. Der Verein kauft noch 14: 54 minus 14 sind 40. Es sind noch 40 Karten übrig.","sprachtext":null,"symbol":"🎟️"},{"id":"H-27","gruppe":"H","block":"Hc","blockNr":3,"nr":27,"rechenarten":["*","+","-"],"schwierigkeit":7,"thema":"Zeltlager","geschichte":"Talha sammelt beim Zeltlager Spielpunkte. Er gewinnt 7 Spiele mit jeweils 6 Punkten. Bei der Nachtwanderung bekommt er 32 Bonuspunkte dazu. Für einen Joker muss er 20 Punkte abgeben. Das Lager dauert 10 Tage.","frage":"Wie viele Punkte hat Talha am Ende?","antwort":54,"rechenweg":"7 * 6 + 32 - 20","hinweis":"Rechne zuerst die Punkte aus den 7 Spielen aus. Zähle die Bonuspunkte dazu und zieh dann die Joker-Punkte ab. Die Lagerdauer brauchst du nicht.","erklaerung":"So denkst du: 7 Spiele mit jeweils 6 Punkten sind 7 mal 6, also 42 Punkte. Dazu kommen 32 Bonuspunkte: 42 plus 32 sind 74 Punkte. Für den Joker gibt er 20 ab: 74 minus 20 sind 54. Talha hat am Ende 54 Punkte. Die 10 Tage brauchst du nicht.","sprachtext":null,"symbol":"🏕️"},{"id":"H-28","gruppe":"H","block":"Hc","blockNr":3,"nr":28,"rechenarten":["*","-"],"schwierigkeit":8,"thema":"Eislaufen","geschichte":"Aslan zählt am Eislaufplatz die Sitzplätze. Es gibt 10 Bänke mit jeweils 7 Plätzen. 25 Plätze sind schon besetzt. Dann setzen sich noch 14 Kinder auf freie Plätze. Der Eintritt kostet 4 Euro.","frage":"Wie viele Plätze sind jetzt noch frei?","antwort":31,"rechenweg":"10 * 7 - 25 - 14","hinweis":"Rechne zuerst aus, wie viele Plätze es insgesamt gibt. Zieh dann beide Gruppen ab, die schon sitzen. Der Eintrittspreis ist nicht wichtig.","erklaerung":"So denkst du: 10 Bänke mit jeweils 7 Plätzen sind 10 mal 7, also 70 Plätze. 25 Plätze sind besetzt: 70 minus 25 sind 45. Dann setzen sich 14 Kinder: 45 minus 14 sind 31. Es sind noch 31 Plätze frei.","sprachtext":null,"symbol":"🪑"},{"id":"H-29","gruppe":"H","block":"Hc","blockNr":3,"nr":29,"rechenarten":["*","+"],"schwierigkeit":9,"thema":"Musik","geschichte":"Beim Konzert der Musikschule spielen 2 Gruppen mit jeweils 9 Kindern Geige. Dazu spielen 24 Kinder Flöte. Außerdem singen 25 Kinder im Chor. Asel spielt in der ersten Geigen-Gruppe.","frage":"Wie viele Kinder machen beim Konzert mit?","antwort":67,"rechenweg":"2 * 9 + 24 + 25","hinweis":"Rechne zuerst die Geigen-Kinder aus. Zähle dann die Flöten-Kinder und die Chor-Kinder dazu.","erklaerung":"So denkst du: Geige spielen 2 mal 9 Kinder, also 18. Dazu kommen 24 Flöten-Kinder: 18 plus 24 sind 42 Kinder. Jetzt noch der Chor: 42 plus 25 sind 67. Beim Konzert machen 67 Kinder mit.","sprachtext":null,"symbol":"🎻"},{"id":"H-30","gruppe":"H","block":"Hc","blockNr":3,"nr":30,"rechenarten":["-","*"],"schwierigkeit":10,"thema":"Bäckerei","geschichte":"Die Bäckerei hat am Morgen 100 Krapfen. 7 Kindergärten bestellen jeweils 8 Krapfen. Danach kauft Mama Rabia für Aslans Fest noch 13 Krapfen. Ein Krapfen kostet 2 Euro.","frage":"Wie viele Krapfen bleiben in der Bäckerei?","antwort":31,"rechenweg":"100 - 7 * 8 - 13","hinweis":"Rechne zuerst aus, wie viele Krapfen alle Kindergärten zusammen bestellen. Zieh dann beide Käufe von 100 ab. Der Preis ist nicht wichtig.","erklaerung":"So denkst du: 7 Kindergärten bestellen jeweils 8 Krapfen, das sind 7 mal 8, also 56 Krapfen. 100 minus 56 sind 44 Krapfen. Mama Rabia kauft 13: 44 minus 13 sind 31. In der Bäckerei bleiben 31 Krapfen. Die 2 Euro brauchst du nicht.","sprachtext":null,"symbol":"🍩"},{"id":"I-01","gruppe":"I","block":"Ia","blockNr":1,"nr":1,"rechenarten":["/","+"],"schwierigkeit":1,"thema":"Jausenstand","geschichte":"Ceylin hilft beim Jausenstand in der Schule. Sie legt 24 Semmeln gleichmäßig in 4 Körbe. In einen Korb legt sie danach noch 3 Käsesemmeln dazu.","frage":"Wie viele Semmeln sind jetzt in diesem Korb?","antwort":9,"rechenweg":"24 / 4 + 3","hinweis":"Teile zuerst die 24 Semmeln auf die 4 Körbe auf. Dann kommen in einen Korb noch welche dazu.","erklaerung":"So denkst du: 24 Semmeln werden auf 4 Körbe verteilt. 24 : 4 = 6, in jedem Korb sind 6 Semmeln. In einen Korb kommen noch 3 dazu. 6 + 3 = 9. In diesem Korb sind 9 Semmeln.","sprachtext":null,"symbol":"🥐"},{"id":"I-02","gruppe":"I","block":"Ia","blockNr":1,"nr":2,"rechenarten":["*","/"],"schwierigkeit":2,"thema":"Pizzaofen","geschichte":"Papa bäckt im Pizzaofen 5 Pizzen. Der Ofen braucht dafür 12 Minuten. Jede Pizza wird in 8 Stücke geschnitten. Alle Stücke werden gleichmäßig auf 10 Teller verteilt.","frage":"Wie viele Stücke liegen auf einem Teller?","antwort":4,"rechenweg":"5 * 8 / 10","hinweis":"Rechne zuerst aus, wie viele Stücke es insgesamt gibt. Die Minuten brauchst du nicht.","erklaerung":"So denkst du: 5 Pizzen mit je 8 Stücken sind 5 · 8 = 40 Stücke. Die 12 Minuten sind für die Rechnung egal. 40 Stücke auf 10 Teller: 40 : 10 = 4. Auf jedem Teller liegen 4 Stücke.","sprachtext":null,"symbol":"🍕"},{"id":"I-03","gruppe":"I","block":"Ia","blockNr":1,"nr":3,"rechenarten":["-","/"],"schwierigkeit":3,"thema":"Gemüsebeet","geschichte":"Elif zieht im Gemüsebeet 32 Karotten aus der Erde. 8 Karotten sind zu klein und kommen weg. Die restlichen Karotten bindet sie zu Bünden mit je 6 Stück.","frage":"Wie viele Bünde macht Elif?","antwort":4,"rechenweg":"(32 - 8) / 6","hinweis":"Wie viele Karotten bleiben nach dem Aussortieren übrig? Diese Zahl teilst du durch 6.","erklaerung":"So denkst du: Von 32 Karotten kommen 8 weg. 32 − 8 = 24 Karotten bleiben übrig. Jetzt teilst du: 24 : 6 = 4. Elif macht 4 Bünde.","sprachtext":null,"symbol":"🥕"},{"id":"I-04","gruppe":"I","block":"Ia","blockNr":1,"nr":4,"rechenarten":["/","+"],"schwierigkeit":4,"thema":"Bücherregal","geschichte":"Lukas räumt 72 Bücher in ein Bücherregal. Das Regal ist 2 Meter hoch und hat 8 Fächer. In jedes Fach stellt er gleich viele Bücher. Dann bekommt er 5 neue Bücher und stellt sie alle in das oberste Fach.","frage":"Wie viele Bücher stehen jetzt im obersten Fach?","antwort":14,"rechenweg":"72 / 8 + 5","hinweis":"Teile die 72 Bücher auf die 8 Fächer auf. Die Höhe des Regals brauchst du nicht.","erklaerung":"So denkst du: 72 Bücher auf 8 Fächer: 72 : 8 = 9. In jedem Fach stehen 9 Bücher. Die 2 Meter sind für die Rechnung egal. Ins oberste Fach kommen 5 neue Bücher: 9 + 5 = 14. Dort stehen jetzt 14 Bücher.","sprachtext":null,"symbol":"📚"},{"id":"I-05","gruppe":"I","block":"Ia","blockNr":1,"nr":5,"rechenarten":["/","*"],"schwierigkeit":5,"thema":"Fußballturnier","geschichte":"Beim Fußballturnier spielen 54 Kinder mit. Das Turnier dauert 3 Stunden. Die Kinder werden in Mannschaften mit je 9 Spielern eingeteilt. Jede Mannschaft zahlt 4 Euro Startgeld.","frage":"Wie viele Euro Startgeld kommen insgesamt zusammen?","antwort":24,"rechenweg":"54 / 9 * 4","hinweis":"Finde zuerst heraus, wie viele Mannschaften es gibt. Die Stunden brauchst du nicht.","erklaerung":"So denkst du: 54 Kinder mit je 9 pro Mannschaft: 54 : 9 = 6 Mannschaften. Die 3 Stunden sind für die Rechnung egal. Jede Mannschaft zahlt 4 Euro: 6 · 4 = 24. Es kommen 24 Euro zusammen.","sprachtext":null,"symbol":"⚽"},{"id":"I-06","gruppe":"I","block":"Ia","blockNr":1,"nr":6,"rechenarten":["/","-"],"schwierigkeit":6,"thema":"Imker","geschichte":"Der Imker füllt 56 Gläser Honig ab. Er stellt sie in Kisten mit je 7 Gläsern. 3 volle Kisten verkauft er gleich am Markt.","frage":"Wie viele Kisten hat der Imker noch?","antwort":5,"rechenweg":"56 / 7 - 3","hinweis":"Wie viele Kisten füllt der Imker mit 56 Gläsern? Davon gehen 3 weg.","erklaerung":"So denkst du: 56 Gläser mit je 7 pro Kiste: 56 : 7 = 8 Kisten. Er verkauft 3 Kisten. 8 − 3 = 5. Der Imker hat noch 5 Kisten.","sprachtext":null,"symbol":"🍯"},{"id":"I-07","gruppe":"I","block":"Ia","blockNr":1,"nr":7,"rechenarten":["-","/"],"schwierigkeit":7,"thema":"Werkunterricht","geschichte":"Im Werkunterricht arbeitet Talha 40 Minuten an seiner Leiste. Die Leiste ist 81 cm lang. Er sägt zuerst ein Stück mit 27 cm ab. Den Rest sägt er in 6 gleich lange Teile.","frage":"Wie lang ist eines dieser Teile in cm?","antwort":9,"rechenweg":"(81 - 27) / 6","hinweis":"Wie lang ist die Leiste nach dem ersten Schnitt noch? Diesen Rest teilst du in 6 Teile. Die Minuten brauchst du nicht.","erklaerung":"So denkst du: Von 81 cm sägt Talha 27 cm ab. 81 − 27 = 54 cm bleiben übrig. Die 40 Minuten sind für die Rechnung egal. 54 cm in 6 gleiche Teile: 54 : 6 = 9. Jedes Teil ist 9 cm lang.","sprachtext":null,"symbol":"🪚"},{"id":"I-08","gruppe":"I","block":"Ia","blockNr":1,"nr":8,"rechenarten":["*","/"],"schwierigkeit":8,"thema":"Klassenfest","geschichte":"Ayda bereitet das Klassenfest vor. Sie bläst 4 Packungen Luftballons auf. In jeder Packung sind 20 Ballons. Alle Ballons werden gleichmäßig auf 10 Tische verteilt.","frage":"Wie viele Ballons kommen auf jeden Tisch?","antwort":8,"rechenweg":"4 * 20 / 10","hinweis":"Rechne zuerst aus, wie viele Ballons es insgesamt gibt. Dann teile sie auf die Tische auf.","erklaerung":"So denkst du: 4 Packungen mit je 20 Ballons: 4 · 20 = 80 Ballons. 80 Ballons auf 10 Tische: 80 : 10 = 8. Auf jeden Tisch kommen 8 Ballons.","sprachtext":null,"symbol":"🎈"},{"id":"I-09","gruppe":"I","block":"Ia","blockNr":1,"nr":9,"rechenarten":["-","/"],"schwierigkeit":9,"thema":"Familienessen","geschichte":"Talha und Mama Sultan machen 96 Teigtaschen für das Familienessen. 42 Teigtaschen sind mit Käse gefüllt, alle anderen mit Spinat. Die Spinat-Taschen legen sie gleichmäßig auf 6 Bleche.","frage":"Wie viele Spinat-Taschen liegen auf einem Blech?","antwort":9,"rechenweg":"(96 - 42) / 6","hinweis":"Wie viele Taschen sind mit Spinat gefüllt? Diese Zahl teilst du durch 6.","erklaerung":"So denkst du: Von 96 Taschen sind 42 mit Käse. 96 − 42 = 54 Taschen sind mit Spinat. 54 Taschen auf 6 Bleche: 54 : 6 = 9. Auf jedem Blech liegen 9 Spinat-Taschen.","sprachtext":null,"symbol":"🥟"},{"id":"I-10","gruppe":"I","block":"Ia","blockNr":1,"nr":10,"rechenarten":["/","-"],"schwierigkeit":10,"thema":"Jausenstand","geschichte":"Cesur verkauft am Jausenstand Säfte. Ein Saft kostet 2 Euro. Der Stand ist 4 Stunden offen. Am Ende hat Cesur 76 Euro eingenommen. 19 der verkauften Säfte waren Apfelsäfte, alle anderen Orangensäfte.","frage":"Wie viele Orangensäfte hat Cesur verkauft?","antwort":19,"rechenweg":"76 / 2 - 19","hinweis":"Rechne zuerst aus, wie viele Säfte Cesur insgesamt verkauft hat. Die Stunden brauchst du nicht.","erklaerung":"So denkst du: 76 Euro bei 2 Euro pro Saft: 76 : 2 = 38 Säfte insgesamt. Die 4 Stunden sind für die Rechnung egal. 19 Säfte waren Apfelsäfte. 38 − 19 = 19. Cesur hat 19 Orangensäfte verkauft.","sprachtext":null,"symbol":"🧃"},{"id":"I-11","gruppe":"I","block":"Ib","blockNr":2,"nr":11,"rechenarten":["/","-"],"schwierigkeit":1,"thema":"Gemüsebeet","geschichte":"Asel sät 48 Salatkörner in ihr Gemüsebeet. Sie macht 6 Reihen und legt in jede Reihe gleich viele Körner. In einer Reihe wachsen 2 Körner nicht an.","frage":"Wie viele Salatpflanzen wachsen in dieser Reihe?","antwort":6,"rechenweg":"48 / 6 - 2","hinweis":"Wie viele Körner kommen in eine Reihe? Zwei davon wachsen nicht an.","erklaerung":"So denkst du: 48 Körner auf 6 Reihen: 48 : 6 = 8 Körner pro Reihe. In einer Reihe wachsen 2 nicht an. 8 − 2 = 6. In dieser Reihe wachsen 6 Salatpflanzen.","sprachtext":null,"symbol":"🥬"},{"id":"I-12","gruppe":"I","block":"Ib","blockNr":2,"nr":12,"
