<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mathefix ist umgezogen</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0B1020; color:#EAF0FF; font-family:"Segoe UI",Roboto,sans-serif; text-align:center; }
  .box { max-width:460px; padding:24px; }
  h1 { font-weight:900; } h1 b { color:#22D3EE; }
  a.neu { display:inline-block; margin-top:14px; background:#22D3EE; color:#0B1020; font-weight:800;
          padding:14px 26px; border-radius:14px; text-decoration:none; font-size:18px; }
  button { margin-top:10px; background:#1C2445; color:#EAF0FF; border:1px solid #2A3563;
           border-radius:12px; padding:10px 18px; font-size:15px; cursor:pointer; }
  p.leise { color:#9AA4CF; font-size:14px; line-height:1.5; }
</style>
</head>
<body>
<div class="box">
  <h1>MATHE<b>FIX</b> ist umgezogen! 🚚</h1>
  <p>Die neue Adresse ist:<br><a class="neu" href="https://start.mathefix.here.now/">start.mathefix.here.now</a></p>
  <div id="rettung" style="display:none">
    <p class="leise">Auf diesem Gerät ist noch gespeicherter Übungs-Fortschritt von der alten Adresse.
    Sichere ihn als Datei und lade ihn auf der neuen Seite im Elternbereich unter „Daten → Import“ wieder ein.</p>
    <button id="export">⬇ Fortschritt als Datei sichern</button>
  </div>
  <p class="leise" id="weiterleitung"></p>
</div>
<script>
  (function () {
    var roh = null;
    try { roh = localStorage.getItem("mathefix.v1"); } catch (e) {}
    var stand = null;
    try { stand = roh ? JSON.parse(roh) : null; } catch (e) {}
    var hatFortschritt = stand && stand.kinder && stand.kinder.length > 0;

    if (hatFortschritt) {
      document.getElementById("rettung").style.display = "block";
      document.getElementById("export").addEventListener("click", function () {
        var blob = new Blob([JSON.stringify({ mathefixExport: 1, stand: stand }, null, 2)],
          { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "mathefix-export.json";
        document.body.appendChild(a); a.click(); a.remove();
      });
    } else {
      document.getElementById("weiterleitung").textContent = "Du wirst automatisch weitergeleitet …";
      setTimeout(function () { location.replace("https://start.mathefix.here.now/"); }, 1200);
    }
  })();
</script>
</body>
</html>
