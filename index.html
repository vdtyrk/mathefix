en 8 Kinder aus.","frage":"Wie viele Kinder sind jetzt noch im Bus?","antwort":12,"rechenweg":"15 + 5 - 8","hinweis":"Rechne zuerst aus, wie viele Kinder nach dem Einsteigen im Bus sind. Zieh dann die ausgestiegenen Kinder ab.","erklaerung":"Zuerst sind 15 Kinder im Bus, 5 steigen ein: 15 + 5 = 20. Dann steigen 8 aus: 20 - 8 = 12. Es sind noch 12 Kinder im Bus.","sprachtext":null,"symbol":"🚌"},{"id":"A-11","gruppe":"A","block":"Ab","blockNr":2,"nr":11,"rechenarten":["+"],"schwierigkeit":1,"thema":"Spielen","geschichte":"Paul hat 20 Murmeln in seiner Dose. Beim Spielen im Hof gewinnt er 10 Murmeln dazu.","frage":"Wie viele Murmeln hat Paul jetzt insgesamt?","antwort":30,"rechenweg":"20 + 10","hinweis":"Zähle die gewonnenen Murmeln zu den Murmeln in der Dose dazu.","erklaerung":"Paul hat 20 Murmeln und gewinnt 10 dazu. 20 + 10 = 30. Er hat jetzt 30 Murmeln.","sprachtext":null,"symbol":"🔵"},{"id":"A-12","gruppe":"A","block":"Ab","blockNr":2,"nr":12,"rechenarten":["-"],"schwierigkeit":2,"thema":"Schule","geschichte":"In der Schulbücherei stehen 28 Bücher im Regal. Am Montag borgen sich die Kinder 6 Bücher aus.","frage":"Wie viele Bücher stehen danach noch im Regal?","antwort":22,"rechenweg":"28 - 6","hinweis":"Zieh die ausgeborgten Bücher von den 28 Büchern ab.","erklaerung":"Im Regal stehen 28 Bücher, 6 werden ausgeborgt. 28 - 6 = 22. Es stehen noch 22 Bücher im Regal.","sprachtext":null,"symbol":"📚"},{"id":"A-13","gruppe":"A","block":"Ab","blockNr":2,"nr":13,"rechenarten":["+"],"schwierigkeit":3,"thema":"Natur","geschichte":"Sofia macht mit ihrer Familie einen Ausflug in die Berge. Sie sammelt 23 Tannenzapfen. Ihr kleiner Bruder gibt ihr noch 14 Tannenzapfen dazu.","frage":"Wie viele Tannenzapfen hat Sofia jetzt insgesamt?","antwort":37,"rechenweg":"23 + 14","hinweis":"Zähle die Tannenzapfen von Sofia und die vom Bruder zusammen.","erklaerung":"Sofia hat 23 Tannenzapfen und bekommt 14 dazu. 23 + 14 = 37. Sie hat jetzt 37 Tannenzapfen.","sprachtext":null,"symbol":"🌲"}, ","antwort":45,"rechenweg":"20 + 15 + 10","hinweis":"Rechne zuerst aus, wie viele Sticker Luca nach dem Geschenk vom Papa hat. Zähle dann die Sticker von der Oma dazu.","erklaerung":"Luca hat 20 Sticker, vom Papa kommen 15 dazu: 20 + 15 = 35. Von der Oma kommen 10 dazu: 35 + 10 = 45. Er hat 45 Sticker.","sprachtext":null,"symbol":"⭐"},{"id":"A-18","gruppe":"A","block":"Ab","blockNr":2,"nr":18,"rechenarten":["-"],"schwierigkeit":8,"thema":"Einkaufen","geschichte":"In der Bäckerei liegen in der Früh 46 Semmeln im Korb. Am Vormittag werden 12 Semmeln verkauft. Zu Mittag werden noch 14 Semmeln verkauft.","frage":"Wie viele Semmeln liegen danach noch im Korb?","antwort":20,"rechenweg":"46 - 12 - 14","hinweis":"Zieh zuerst die Semmeln vom Vormittag ab. Zieh danach die Semmeln vom Mittag ab.","erklaerung":"In der Früh sind es 46 Semmeln. 46 - 12 = 34. Dann noch 14 weg: 34 - 14 = 20. Im Korb liegen noch 20 Semmeln.","sprachtext":null,"symbol":"🥐"},{"id":"A-19","gruppe":"A","block":"Ab","blockNr":2,"nr":19,"rechenarten":["+","-"],"schwierigkeit":9,"thema":"Spielen","geschichte":"Aslan hat 25 Bausteine in seiner Kiste. Zum Geburtstag bekommt er 20 neue Bausteine geschenkt. Dann baut er ein Auto und verwendet dafür 13 Bausteine.","frage":"Wie viele Bausteine liegen danach noch in der Kiste?","antwort":32,"rechenweg":"25 + 20 - 13","hinweis":"Rechne zuerst aus, wie viele Bausteine Aslan nach dem Geburtstag hat. Zieh dann die Bausteine für das Auto ab.","erklaerung":"Aslan hat 25 Bausteine und bekommt 20 dazu: 25 + 20 = 45. Für das Auto braucht er 13: 45 - 13 = 32. In der Kiste liegen noch 32 Bausteine.","sprachtext":null,"symbol":"🧱"},{"id":"A-20","gruppe":"A","block":"Ab","blockNr":2,"nr":20,"rechenarten":["+","-"],"schwierigkeit":10,"thema":"Freizeit","geschichte":"Im Schwimmbad sind am Nachmittag 32 Kinder im Wasser. Dann kommen 16 Kinder von einem Fußballverein dazu. Als es kühler wird, gehen 27 Kinder nach Hause.","frage":"Wie viele Kinder sind jetzt noch im Schwimmbad?"," ie Schafe von allen drei Weiden zusammen. Rechne Schritt für Schritt.","erklaerung":"Sofia zählt 40, dann 25, dann 13 Schafe. 40 + 25 = 65 und 65 + 13 = 78. Sie hat insgesamt 78 Schafe gezählt.","sprachtext":null,"symbol":"🐑"},{"id":"A-24","gruppe":"A","block":"Ac","blockNr":3,"nr":24,"rechenarten":["-"],"schwierigkeit":4,"thema":"Lesen","geschichte":"Emre liest ein spannendes Buch mit 87 Seiten. Am Montag liest er 32 Seiten. Am Dienstag liest er noch 21 Seiten.","frage":"Wie viele Seiten muss Emre jetzt noch lesen?","antwort":34,"rechenweg":"87 - 32 - 21","hinweis":"Zieh zuerst die Seiten vom Montag von allen Seiten ab. Zieh danach die Seiten vom Dienstag ab.","erklaerung":"Das Buch hat 87 Seiten. 87 - 32 = 55. Dann noch 21 weg: 55 - 21 = 34. Emre muss noch 34 Seiten lesen.","sprachtext":null,"symbol":"📖"},{"id":"A-25","gruppe":"A","block":"Ac","blockNr":3,"nr":25,"rechenarten":["+","-"],"schwierigkeit":5,"thema":"Spielen","geschichte":"Jakob hat 34 Sammelkarten in seiner Schachtel. Beim Tauschen in der Pause bekommt er 23 Karten dazu. Dann verschenkt er 15 Karten an seinen kleinen Bruder.","frage":"Wie viele Sammelkarten hat Jakob jetzt noch?","antwort":42,"rechenweg":"34 + 23 - 15","hinweis":"Rechne zuerst aus, wie viele Karten Jakob nach dem Tauschen hat. Zieh dann die verschenkten Karten ab.","erklaerung":"Jakob hat 34 Karten und bekommt 23 dazu: 34 + 23 = 57. Er verschenkt 15: 57 - 15 = 42. Er hat noch 42 Sammelkarten.","sprachtext":null,"symbol":"🃏"},{"id":"A-26","gruppe":"A","block":"Ac","blockNr":3,"nr":26,"rechenarten":["-"],"schwierigkeit":6,"thema":"Reisen","geschichte":"Im Zug nach Wien sitzen 96 Fahrgäste. Bei der ersten Station steigen 35 Fahrgäste aus. Bei der zweiten Station steigen noch 21 Fahrgäste aus.","frage":"Wie viele Fahrgäste sitzen jetzt noch im Zug?","antwort":40,"rechenweg":"96 - 35 - 21","hinweis":"Zieh zuerst die Fahrgäste der ersten Station ab. Zieh danach die Fahrgäste der zweiten Station ab.","erklaerung":"Im Zug sitzen 96 Fahrgäste ,"blockNr":2,"nr":17,"rechenarten":["-"],"schwierigkeit":7,"thema":"Zeit","geschichte":"Lena geht am Abend ins Kino. Bis der Film beginnt, sind es noch 90 Minuten. Sie isst 30 Minuten zu Abend und packt 15 Minuten ihre Sachen. Der Weg ins Kino dauert 25 Minuten. Der Film selbst dauert 105 Minuten.","frage":"Wie viele Minuten bleiben Lena dann noch übrig?","antwort":20,"rechenweg":"90 - 30 - 15 - 25","hinweis":"Ziehe alles, was Lena noch erledigen muss, von den 90 Minuten ab. Die Länge vom Film brauchst du nicht.","erklaerung":"Nach dem Essen bleiben 90 − 30 = 60 Minuten. Nach dem Packen bleiben 60 − 15 = 45 Minuten. Nach dem Weg bleiben 45 − 25 = 20 Minuten übrig.","sprachtext":null,"symbol":"🎬"},{"id":"F-18","gruppe":"F","block":"Fb","blockNr":2,"nr":18,"rechenarten":["+","-","*"],"schwierigkeit":8,"thema":"Länge","geschichte":"Mia verpackt Geschenke. Sie hat 2 Rollen Geschenkband: eine mit 150 cm und eine mit 100 cm. Für ein Packerl braucht sie genau 60 cm Band. Sie verpackt 4 Packerl. Dafür braucht sie 20 Minuten.","frage":"Wie viele Zentimeter Band bleiben übrig?","antwort":10,"rechenweg":"150 + 100 - 4 * 60","hinweis":"Rechne zuerst aus, wie viel Band Mia insgesamt hat und wie viel sie für die 4 Packerl braucht.","erklaerung":"Mia hat 150 + 100 = 250 cm Band. Für 4 Packerl braucht sie 4 · 60 = 240 cm. Übrig bleiben 250 − 240 = 10 cm.","sprachtext":null,"symbol":"🎁"},{"id":"F-19","gruppe":"F","block":"Fb","blockNr":2,"nr":19,"rechenarten":["*","+"],"schwierigkeit":9,"thema":"Zeit","geschichte":"Familie Aydın fährt mit dem Zug auf Urlaub. Die Fahrt hat 3 Abschnitte, jeder dauert 65 Minuten. Dazwischen hält der Zug 2 Mal, jedes Mal 10 Minuten. Der Zug hat 8 Waggons.","frage":"Wie viele Minuten dauert die ganze Fahrt?","antwort":215,"rechenweg":"3 * 65 + 2 * 10","hinweis":"Rechne die Fahrzeit und die Haltezeit getrennt aus. Zähle dann beides zusammen. Die Waggons brauchst du nicht.","erklaerung":"Die 3 Abschnitte dauern 3 · 65 = 195 Minuten. Die Halte dauern 2 · 10
